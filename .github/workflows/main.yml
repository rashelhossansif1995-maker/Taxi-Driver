name: Build Taxi Driver Signed AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # 5. Extract project
      - name: Extract Taxi Driver project
        run: |
          unzip -o TaxiDriver_PlayStore_Project-1.zip
          cd TaxiDriver_PlayStore_Project
          echo "Project extracted"
          ls -la

      # 6. Put HTML into assets
      - name: Prepare HTML
        run: |
          cd TaxiDriver_PlayStore_Project

          mkdir -p app/src/main/assets

          cp ../Taxi_Driver_SafeArea_1.3.2_Settings_Clean.html \
             app/src/main/assets/index.html

          echo "HTML copied successfully"

      # 7. Update version
      - name: Update version to 1.0.3
        run: |
          cd TaxiDriver_PlayStore_Project

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          s = p.read_text()

          s = s.replace(
              "versionCode 1",
              "versionCode 4"
          )

          s = s.replace(
              "versionName '1.0.0'",
              "versionName '1.0.3'"
          )

          p.write_text(s)

          print("Version updated:")
          print("versionCode = 4")
          print("versionName = 1.0.3")
          PY

          grep -n "versionCode\|versionName" app/build.gradle

      # 8. Decode existing keystore
      - name: Decode existing signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > taxi-driver.keystore

          echo "Keystore created:"
          ls -lh taxi-driver.keystore

      # 9. Check existing key
      - name: Check existing signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "Checking existing keystore..."

          keytool -list \
            -keystore taxi-driver.keystore \
            -storepass "$KEYSTORE_PASSWORD"

          echo ""
          echo "Configured alias:"
          echo "$KEY_ALIAS"

      # 10. Build unsigned AAB
      - name: Build Release AAB
        run: |
          cd TaxiDriver_PlayStore_Project

          gradle clean

          gradle bundleRelease

      # 11. Find AAB
      - name: Find generated AAB
        run: |
          echo "Searching for AAB..."

          find TaxiDriver_PlayStore_Project \
            -type f \
            -name "*.aab" \
            -print

      # 12. Sign AAB with EXISTING key
      - name: Sign AAB with existing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |

          AAB=$(find TaxiDriver_PlayStore_Project \
            -type f \
            -name "*.aab" \
            | head -n 1)

          if [ -z "$AAB" ]; then
            echo "ERROR: AAB not found"
            exit 1
          fi

          echo "AAB found:"
          echo "$AAB"

          echo ""
          echo "Signing with existing keystore..."

          jarsigner \
            -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore taxi-driver.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            "$AAB" \
            "$KEY_ALIAS"

          echo ""
          echo "AAB signing completed."

      # 13. Verify signature
      - name: Verify AAB signature
        run: |

          AAB=$(find TaxiDriver_PlayStore_Project \
            -type f \
            -name "*.aab" \
            | head -n 1)

          echo "Verifying:"
          echo "$AAB"

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$AAB"

      # 14. Rename AAB
      - name: Rename AAB
        run: |

          AAB=$(find TaxiDriver_PlayStore_Project \
            -type f \
            -name "*.aab" \
            | head -n 1)

          cp "$AAB" Taxi-Driver-1.0.3-Signed.aab

          echo "Final AAB:"
          ls -lh Taxi-Driver-1.0.3-Signed.aab

      # 15. Upload signed AAB
      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: Taxi-Driver-1.0.3-Signed-AAB
          path: Taxi-Driver-1.0.3-Signed.aab
