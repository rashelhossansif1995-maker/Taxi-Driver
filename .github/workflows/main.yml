name: Build Taxi Driver Signed AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Extract Android project
      - name: Extract Android project
        run: |
          rm -rf TaxiDriver_PlayStore_Project
          unzip -o TaxiDriver_PlayStore_Project-1.zip

          echo "Project extracted successfully."

      # 3. Update HTML and version
      - name: Update HTML and version
        working-directory: TaxiDriver_PlayStore_Project
        run: |
          mkdir -p app/src/main/assets

          cp ../Taxi_Driver_SafeArea_1.3.2_Settings_Clean.html \
             app/src/main/assets/index.html

          echo "HTML copied successfully."

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle")

          if not p.exists():
              raise SystemExit("ERROR: app/build.gradle not found")

          s = p.read_text()

          s = re.sub(
              r'versionCode\s+\d+',
              'versionCode 4',
              s
          )

          s = re.sub(
              r'versionName\s+[\'"][^\'"]+[\'"]',
              'versionName "1.0.3"',
              s
          )

          p.write_text(s)

          print("Version Code : 4")
          print("Version Name : 1.0.3")
          PY

      # 4. Verify project
      - name: Verify project
        working-directory: TaxiDriver_PlayStore_Project
        run: |
          echo "Package:"
          grep -n "applicationId" app/build.gradle

          echo "Version:"
          grep -n "versionCode" app/build.gradle
          grep -n "versionName" app/build.gradle

          echo "HTML:"
          test -f app/src/main/assets/index.html
          echo "index.html OK"

      # 5. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 6. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 7. Install Android SDK
      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      # 8. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # 9. Check Gradle
      - name: Check Gradle
        run: |
          gradle --version

      # 10. Decode existing signing key
      - name: Decode signing keystore
        working-directory: TaxiDriver_PlayStore_Project
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode \
            > app/taxi-driver-release.jks

          test -s app/taxi-driver-release.jks

          echo "Existing signing keystore loaded."

      # 11. Clean
      - name: Clean project
        working-directory: TaxiDriver_PlayStore_Project
        run: |
          gradle clean --stacktrace

      # 12. Build unsigned Release AAB
      - name: Build Release AAB
        working-directory: TaxiDriver_PlayStore_Project
        run: |
          gradle bundleRelease --stacktrace

      # 13. Find AAB
      - name: Find generated AAB
        working-directory: TaxiDriver_PlayStore_Project
        run: |
          echo "Generated AAB files:"
          find app/build/outputs/bundle -type f -name "*.aab" -print

      # 14. Sign AAB
      - name: Sign AAB with existing upload key
        working-directory: TaxiDriver_PlayStore_Project
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "======================================"
          echo "SIGNING RELEASE AAB"
          echo "======================================"

          AAB_FILE=$(find app/build/outputs/bundle -type f -name "*.aab" | head -n 1)

          if [ -z "$AAB_FILE" ]; then
            echo "ERROR: AAB not found."
            exit 1
          fi

          echo "AAB found:"
          echo "$AAB_FILE"

          jarsigner \
            -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore app/taxi-driver-release.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$AAB_FILE" \
            "$KEY_ALIAS"

          echo ""
          echo "AAB signing completed."

      # 15. Verify AAB signature
      - name: Verify AAB signature
        working-directory: TaxiDriver_PlayStore_Project
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          AAB_FILE=$(find app/build/outputs/bundle -type f -name "*.aab" | head -n 1)

          if [ -z "$AAB_FILE" ]; then
            echo "ERROR: AAB not found."
            exit 1
          fi

          echo "======================================"
          echo "VERIFYING AAB SIGNATURE"
          echo "======================================"

          jarsigner -verify -verbose -certs "$AAB_FILE"

          echo ""
          echo "AAB signature verification completed."

      # 16. Prepare release
      - name: Prepare release AAB
        working-directory: TaxiDriver_PlayStore_Project
        run: |
          mkdir -p release

          AAB_FILE=$(find app/build/outputs/bundle -type f -name "*.aab" | head -n 1)

          if [ -z "$AAB_FILE" ]; then
            echo "ERROR: AAB not found."
            exit 1
          fi

          cp "$AAB_FILE" release/Taxi-Driver-1.0.3.aab

          echo "======================================"
          echo "FINAL AAB"
          echo "======================================"

          ls -lh release/Taxi-Driver-1.0.3.aab

      # 17. Upload artifact
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Taxi-Driver-1.0.3-AAB
          path: TaxiDriver_PlayStore_Project/release/Taxi-Driver-1.0.3.aab
          if-no-files-found: error

      # 18. Build summary
      - name: Build summary
        run: |
          echo ""
          echo "======================================"
          echo "TAXI DRIVER BUILD SUCCESS"
          echo "======================================"
          echo ""
          echo "App Name     : Taxi Driver"
          echo "Package Name : com.taxidriver.apk"
          echo "Version Code : 4"
          echo "Version Name : 1.0.3"
          echo "Target API   : 36"
          echo "Signed       : YES"
          echo "AAB          : Taxi-Driver-1.0.3.aab"
          echo ""
          echo "======================================"
