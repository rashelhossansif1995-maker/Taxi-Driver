name: Build Taxi Driver Signed AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Extract Android project
      - name: Extract Android project
        run: |
          rm -rf TaxiDriver_PlayStore_Project
          unzip -o TaxiDriver_PlayStore_Project-1.zip

          echo "Android project extracted successfully."

      # 3. Check project structure
      - name: Check project structure
        working-directory: TaxiDriver_PlayStore_Project
        run: |
          echo "======================================"
          echo "PROJECT STRUCTURE"
          echo "======================================"

          pwd

          echo ""
          echo "Project files:"
          ls -la

          echo ""
          echo "App directory:"
          ls -la app

          echo ""
          echo "Source directory:"
          ls -la app/src || true

          echo ""
          echo "Build Gradle:"
          ls -lh app/build.gradle

      # 4. Update HTML and version
      - name: Update HTML and version
        working-directory: TaxiDriver_PlayStore_Project
        run: |
          echo "======================================"
          echo "UPDATING HTML AND VERSION"
          echo "======================================"

          # Create assets directory
          mkdir -p app/src/main/assets

          # Copy latest HTML
          cp ../Taxi_Driver_SafeArea_1.3.2_Settings_Clean.html \
             app/src/main/assets/index.html

          echo "HTML copied successfully."

          # Update version
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle")

          if not p.exists():
              raise SystemExit("ERROR: app/build.gradle not found")

          s = p.read_text()

          # Version Code
          s = re.sub(
              r'versionCode\s+\d+',
              'versionCode 4',
              s
          )

          # Version Name
          s = re.sub(
              r'versionName\s+[\'"][^\'"]+[\'"]',
              'versionName "1.0.3"',
              s
          )

          p.write_text(s)

          print("================================")
          print("VERSION UPDATED")
          print("Version Code : 4")
          print("Version Name : 1.0.3")
          print("================================")
          PY

      # 5. Verify HTML
      - name: Verify HTML
        working-directory: TaxiDriver_PlayStore_Project
        run: |
          echo "======================================"
          echo "VERIFYING HTML"
          echo "======================================"

          if [ ! -f app/src/main/assets/index.html ]; then
            echo "ERROR: index.html not found"
            exit 1
          fi

          echo "HTML file exists."

          echo ""
          echo "HTML file size:"
          wc -c app/src/main/assets/index.html

      # 6. Verify package and version
      - name: Verify package and version
        working-directory: TaxiDriver_PlayStore_Project
        run: |
          echo "======================================"
          echo "VERIFYING PACKAGE AND VERSION"
          echo "======================================"

          echo ""
          echo "Package:"
          grep -R "com.taxidriver.apk" app/build.gradle || true

          echo ""
          echo "Version Code:"
          grep -R "versionCode" app/build.gradle || true

          echo ""
          echo "Version Name:"
          grep -R "versionName" app/build.gradle || true

      # 7. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 8. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 9. Install Android SDK components
      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

          echo "Android SDK components installed."

      # 10. Setup Gradle 8.11.1
      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # 11. Check Gradle
      - name: Check Gradle
        run: |
          echo "======================================"
          echo "GRADLE VERSION"
          echo "======================================"

          gradle --version

      # 12. Decode signing keystore
      - name: Decode signing keystore
        working-directory: TaxiDriver_PlayStore_Project
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "======================================"
          echo "CREATING SIGNING KEYSTORE"
          echo "======================================"

          mkdir -p app

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > app/taxi-driver-release.jks

          echo "Keystore created successfully."

      # 13. Verify signing keystore
      - name: Verify signing keystore
        working-directory: TaxiDriver_PlayStore_Project
        run: |
          echo "======================================"
          echo "VERIFYING KEYSTORE"
          echo "======================================"

          if [ ! -f app/taxi-driver-release.jks ]; then
            echo "ERROR: Signing keystore not found."
            exit 1
          fi

          echo "Signing keystore exists."

          ls -lh app/taxi-driver-release.jks

      # 14. Clean project
      - name: Clean project
        working-directory: TaxiDriver_PlayStore_Project
        run: |
          echo "======================================"
          echo "CLEANING PROJECT"
          echo "======================================"

          gradle clean --stacktrace

      # 15. Build signed Release AAB
      - name: Build signed Release AAB
        working-directory: TaxiDriver_PlayStore_Project
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/TaxiDriver_PlayStore_Project/app/taxi-driver-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "======================================"
          echo "BUILDING SIGNED RELEASE AAB"
          echo "======================================"

          gradle bundleRelease --stacktrace

      # 16. Find generated AAB
      - name: Find generated AAB
        working-directory: TaxiDriver_PlayStore_Project
        run: |
          echo "======================================"
          echo "SEARCHING FOR AAB"
          echo "======================================"

          find . -type f -name "*.aab" -print

      # 17. Prepare release AAB
      - name: Prepare release AAB
        working-directory: TaxiDriver_PlayStore_Project
        run: |
          echo "======================================"
          echo "PREPARING RELEASE AAB"
          echo "======================================"

          mkdir -p release

          AAB_FILE=$(find app/build/outputs/bundle -type f -name "*.aab" | head -n 1)

          if [ -z "$AAB_FILE" ]; then
            echo "ERROR: AAB file not found."
            exit 1
          fi

          echo "Generated AAB:"
          echo "$AAB_FILE"

          cp "$AAB_FILE" release/Taxi-Driver-1.0.3.aab

          echo ""
          echo "Final AAB:"
          ls -lh release/Taxi-Driver-1.0.3.aab

      # 18. Upload AAB artifact
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Taxi-Driver-1.0.3-AAB
          path: TaxiDriver_PlayStore_Project/release/Taxi-Driver-1.0.3.aab
          if-no-files-found: error

      # 19. Build summary
      - name: Build summary
        run: |
          echo ""
          echo "======================================"
          echo "       TAXI DRIVER BUILD SUCCESS"
          echo "======================================"
          echo ""
          echo "App Name     : Taxi Driver"
          echo "Package Name : com.taxidriver.apk"
          echo "Version Code : 4"
          echo "Version Name : 1.0.3"
          echo "Target API   : 36"
          echo "AAB File     : Taxi-Driver-1.0.3.aab"
          echo ""
          echo "======================================"
