name: Build Taxi Driver Signed AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o TaxiDriver_PlayStore_Project-1.zip -d .

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os
          import base64
          import re
          from pathlib import Path

          value = os.environ["KEYSTORE_BASE64"]
          value = re.sub(r"[^A-Za-z0-9+/=]", "", value)
          value += "=" * ((4 - len(value) % 4) % 4)

          data = base64.b64decode(value)
          Path(os.environ["GITHUB_WORKSPACE"], "upload-keystore.jks").write_bytes(data)

          print("Keystore decoded successfully.")
          print(f"Keystore size: {len(data)} bytes")
          PY

      - name: Configure release signing
        working-directory: TaxiDriver_PlayStore_Project
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          s = p.read_text()

          signing = '''
          signingConfigs {
              release {
                  storeFile file(System.getenv("KEYSTORE_FILE"))
                  storePassword System.getenv("KEYSTORE_PASSWORD")
                  keyAlias System.getenv("KEY_ALIAS")
                  keyPassword System.getenv("KEYSTORE_PASSWORD")
              }
          }
          '''

          s = s.replace("    buildTypes {", signing + "\n    buildTypes {")
          s = s.replace(
              "    buildTypes {\n        release {",
              "    buildTypes {\n        release {\n            signingConfig signingConfigs.release"
          )

          p.write_text(s)
          PY

      - name: Build signed release AAB
        working-directory: TaxiDriver_PlayStore_Project
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle bundleRelease --no-daemon

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Taxi-Driver-Signed-AAB
          path: TaxiDriver_PlayStore_Project/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
