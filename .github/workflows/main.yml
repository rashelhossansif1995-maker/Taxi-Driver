name: Build Taxi Driver Signed AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Extract Android project
      - name: Extract Android project
        run: |
          rm -rf TaxiDriver_PlayStore_Project
          unzip -o TaxiDriver_PlayStore_Project-1.zip
          echo "Android project extracted."

      # 3. Check project
      - name: Check project structure
        working-directory: TaxiDriver_PlayStore_Project
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Project files:"
          ls -la

          echo ""
          echo "App directory:"
          ls -la app || true

          echo ""
          echo "Build Gradle:"
          ls -la app/build.gradle || true

      # 4. Update HTML and version
      - name: Update HTML and version
        working-directory: TaxiDriver_PlayStore_Project
        run: |
          # Create assets folder if it does not exist
          mkdir -p app/src/main/assets

          # Copy latest Taxi Driver HTML
          cp ../Taxi_Driver_SafeArea_1.3.2_Settings_Clean.html \
             app/src/main/assets/index.html

          echo "HTML copied successfully."

          # Update Android version
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle")

          if not p.exists():
              raise SystemExit("ERROR: app/build.gradle not found")

          s = p.read_text()

          # Version Code
          s = re.sub(
              r'versionCode\s+\d+',
              'versionCode 4',
              s
          )

          # Version Name
          s = re.sub(
              r'versionName\s+[\'"][^\'"]+[\'"]',
              'versionName "1.0.3"',
              s
          )

          p.write_text(s)

          print("================================")
          print("Taxi Driver version updated")
          print("Version Code : 4")
          print("Version Name : 1.0.3")
          print("================================")
          PY

      # 5. Verify HTML
      - name: Verify HTML
        working-directory: TaxiDriver_PlayStore_Project
        run: |
          echo "Checking HTML file..."

          test -f app/src/main/assets/index.html

          echo "HTML file exists."

          echo ""
          echo "HTML size:"
          wc -c app/src/main/assets/index.html

      # 6. Verify package and version
      - name: Verify package and version
        working-directory: TaxiDriver_PlayStore_Project
        run: |
          echo "Checking Android package..."

          grep -R "com.taxidriver.apk" app/build.gradle || true

          echo ""
          echo "Checking version..."

          grep -R "versionCode" app/build.gradle || true
          grep -R "versionName" app/build.gradle || true

      # 7. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 8. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 9. Install Android SDK components
      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      # 10. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # 11. Decode signing keystore
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        working-directory: TaxiDriver_PlayStore_Project
        run: |
          mkdir -p app

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > app/taxi-driver-release.jks

          echo "Keystore created."

      # 12. Verify signing keystore
      - name: Verify signing keystore
        working-directory: TaxiDriver_PlayStore_Project
        run: |
          test -f app/taxi-driver-release.jks

          echo "Signing keystore exists."

          ls -lh app/taxi-driver-release.jks

      # 13. Make Gradle executable
      - name: Make Gradle executable
        working-directory: TaxiDriver_PlayStore_Project
        run: |
          chmod +x gradlew

      # 14. Clean project
      - name: Clean project
        working-directory: TaxiDriver_PlayStore_Project
        run: |
          ./gradlew clean --stacktrace

      # 15. Build signed Release AAB
      - name: Build signed Release AAB
        working-directory: TaxiDriver_PlayStore_Project
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/TaxiDriver_PlayStore_Project/app/taxi-driver-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --stacktrace

      # 16. Find AAB
      - name: Find generated AAB
        working-directory: TaxiDriver_PlayStore_Project
        run: |
          echo "Searching for AAB..."

          find . -type f -name "*.aab" -print

      # 17. Prepare release file
      - name: Prepare release AAB
        working-directory: TaxiDriver_PlayStore_Project
        run: |
          mkdir -p release

          AAB_FILE=$(find app/build/outputs/bundle -type f -name "*.aab" | head -n 1)

          if [ -z "$AAB_FILE" ]; then
            echo "ERROR: AAB file not found."
            exit 1
          fi

          echo "Found AAB:"
          echo "$AAB_FILE"

          cp "$AAB_FILE" release/Taxi-Driver-1.0.3.aab

          echo ""
          echo "Release AAB created:"
          ls -lh release/Taxi-Driver-1.0.3.aab

      # 18. Upload AAB artifact
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Taxi-Driver-1.0.3-AAB
          path: TaxiDriver_PlayStore_Project/release/Taxi-Driver-1.0.3.aab
          if-no-files-found: error

      # 19. Build summary
      - name: Build summary
        run: |
          echo "======================================"
          echo "Taxi Driver AAB BUILD SUCCESS"
          echo "======================================"
          echo "App Name     : Taxi Driver"
          echo "Package Name : com.taxidriver.apk"
          echo "Version Code : 4"
          echo "Version Name : 1.0.3"
          echo "AAB          : Taxi-Driver-1.0.3.aab"
          echo "======================================"
