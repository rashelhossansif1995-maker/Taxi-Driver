name: Build Taxi Driver Signed AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # 5. Extract Android project
      - name: Extract Android project
        run: |
          unzip -o TaxiDriver_PlayStore_Project-1.zip
          echo "Project extracted successfully"

      # 6. Prepare HTML
      - name: Update HTML and version
        run: |
          cd TaxiDriver_PlayStore_Project

          mkdir -p app/src/main/assets

          cp ../Taxi_Driver_SafeArea_1.3.2_Settings_Clean.html \
             app/src/main/assets/index.html

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          s = p.read_text()

          s = s.replace(
              "versionCode 1",
              "versionCode 4"
          )

          s = s.replace(
              "versionName '1.0.0'",
              "versionName '1.0.3'"
          )

          p.write_text(s)

          print("Version updated to:")
          print("versionCode 4")
          print("versionName 1.0.3")
          PY

          grep -n "versionCode\|versionName" app/build.gradle

      # 7. Verify project
      - name: Verify project
        run: |
          cd TaxiDriver_PlayStore_Project

          echo "Checking project..."
          test -f app/src/main/assets/index.html
          test -f app/build.gradle

          echo "Project verification successful"

      # 8. Decode EXISTING keystore
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > taxi-driver.keystore

          test -s taxi-driver.keystore

          echo "Existing keystore decoded successfully"
          ls -lh taxi-driver.keystore

      # 9. Automatically find PrivateKeyEntry
      - name: Find existing PrivateKey alias
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "Inspecting existing keystore..."

          keytool -list \
            -v \
            -keystore taxi-driver.keystore \
            -storepass "$KEYSTORE_PASSWORD" > keystore-info.txt

          echo "Keystore entries:"
          grep -E "Alias name:|Entry type:" keystore-info.txt || true

          PRIVATE_ALIAS=$(awk '
            /Alias name:/ {
              alias=$0
              sub(/^.*Alias name: /, "", alias)
            }
            /Entry type: PrivateKeyEntry/ {
              print alias
              exit
            }
          ' keystore-info.txt)

          if [ -z "$PRIVATE_ALIAS" ]; then
            echo "ERROR: No PrivateKeyEntry found."
            exit 1
          fi

          echo "PrivateKeyEntry found successfully."

          # Save alias for next steps
          echo "PRIVATE_ALIAS=$PRIVATE_ALIAS" >> "$GITHUB_ENV"

      # 10. Clean
      - name: Clean project
        run: |
          cd TaxiDriver_PlayStore_Project
          gradle clean

      # 11. Build AAB
      - name: Build Release AAB
        run: |
          cd TaxiDriver_PlayStore_Project

          echo "======================================"
          echo "BUILDING RELEASE AAB"
          echo "======================================"

          gradle bundleRelease

      # 12. Find AAB
      - name: Find generated AAB
        run: |
          AAB=$(find TaxiDriver_PlayStore_Project \
            -type f \
            -name "*.aab" \
            | head -n 1)

          if [ -z "$AAB" ]; then
            echo "ERROR: AAB not found."
            exit 1
          fi

          echo "AAB found:"
          echo "$AAB"

          echo "AAB_PATH=$AAB" >> "$GITHUB_ENV"

      # 13. Sign with EXISTING PrivateKey
      - name: Sign AAB with existing private key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "======================================"
          echo "SIGNING RELEASE AAB"
          echo "======================================"

          echo "Using existing PrivateKeyEntry."

          jarsigner \
            -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore taxi-driver.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            "$AAB_PATH" \
            "$PRIVATE_ALIAS"

          echo "======================================"
          echo "AAB SIGNING COMPLETED"
          echo "======================================"

      # 14. Verify signature
      - name: Verify AAB signature
        run: |
          echo "======================================"
          echo "VERIFYING AAB SIGNATURE"
          echo "======================================"

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$AAB_PATH"

          echo "======================================"
          echo "SIGNATURE VERIFIED SUCCESSFULLY"
          echo "======================================"

      # 15. Prepare final AAB
      - name: Prepare release AAB
        run: |
          cp "$AAB_PATH" Taxi-Driver-1.0.3-Signed.aab

          echo "Final AAB:"
          ls -lh Taxi-Driver-1.0.3-Signed.aab

      # 16. Upload artifact
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Taxi-Driver-1.0.3-Signed-AAB
          path: Taxi-Driver-1.0.3-Signed.aab
