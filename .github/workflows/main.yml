name: Build Taxi Driver Signed AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf TaxiDriver_PlayStore_Project
          mkdir -p TaxiDriver_PlayStore_Project
          unzip -o TaxiDriver_PlayStore_Project-1.zip -d TaxiDriver_PlayStore_Project

      - name: Update HTML and version
        working-directory: TaxiDriver_PlayStore_Project
        run: |
          cp ../Taxi_Driver_SafeArea_1.3.2_Settings_Clean.html app/src/main/assets/index.html

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle")
          s = p.read_text()

          # Play Store update:
          # 1.0.2 / versionCode 3 -> 1.0.3 / versionCode 4

          s = re.sub(
              r'versionCode\s+\d+',
              'versionCode 4',
              s
          )

          s = re.sub(
              r'versionName\s+[\'"][^\'"]+[\'"]',
              'versionName "1.0.3"',
              s
          )

          p.write_text(s)

          print("HTML updated successfully.")
          print("Version Code: 4")
          print("Version Name: 1.0.3")
          PY

      - name: Verify package and version
        working-directory: TaxiDriver_PlayStore_Project
        run: |
          echo "Checking Android project..."

          grep -R "com.taxidriver.apk" app/build.gradle || true
          grep -R "versionCode" app/build.gradle || true
          grep -R "versionName" app/build.gradle || true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os
          import base64
          import re
          from pathlib import Path

          value = os.environ.get("KEYSTORE_BASE64", "").strip()

          if not value:
              raise SystemExit(
                  "ERROR: KEYSTORE_BASE64 GitHub Secret is missing."
              )

          value = re.sub(r'[^A-Za-z0-9+/=]', '', value)

          # Fix missing padding if necessary
          value += "=" * ((4 - len(value) % 4) % 4)

          data = base64.b64decode(value)

          out = Path("TaxiDriver_PlayStore_Project/app/taxi-driver-release.jks")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(data)

          print("Keystore decoded successfully.")
          print(f"Keystore path: {out}")
          PY

      - name: Verify signing keystore
        run: |
          if [ ! -f "TaxiDriver_PlayStore_Project/app/taxi-driver-release.jks" ]; then
            echo "ERROR: Keystore file was not created."
            exit 1
          fi

          echo "Keystore file found."

      - name: Make Gradle executable
        working-directory: TaxiDriver_PlayStore_Project
        run: |
          chmod +x gradlew

      - name: Clean project
        working-directory: TaxiDriver_PlayStore_Project
        run: |
          ./gradlew clean

      - name: Build signed Release AAB
        working-directory: TaxiDriver_PlayStore_Project
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/TaxiDriver_PlayStore_Project/app/taxi-driver-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --stacktrace

      - name: Find generated AAB
        run: |
          echo "Searching for AAB..."

          find TaxiDriver_PlayStore_Project/app/build/outputs/bundle \
            -type f \
            -name "*.aab" \
            -print

      - name: Rename AAB
        run: |
          AAB=$(find TaxiDriver_PlayStore_Project/app/build/outputs/bundle \
            -type f \
            -name "*.aab" \
            | head -n 1)

          if [ -z "$AAB" ]; then
            echo "ERROR: AAB file was not found."
            exit 1
          fi

          mkdir -p release

          cp "$AAB" "release/Taxi-Driver-1.0.3.aab"

          echo "AAB created:"
          ls -lh release/Taxi-Driver-1.0.3.aab

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: Taxi-Driver-1.0.3-AAB
          path: release/Taxi-Driver-1.0.3.aab
          if-no-files-found: error
