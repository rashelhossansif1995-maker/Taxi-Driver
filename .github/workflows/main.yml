name: Build Taxi Driver 1.0.5 Signed AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract Taxi Driver 1.0.5 project
        run: |
          rm -rf TaxiDriver_Project
          mkdir TaxiDriver_Project
          unzip -q Taxi_Driver_PlayStore_Update_1.0.5_AAB.zip -d TaxiDriver_Project
          test -f TaxiDriver_Project/app/build.gradle
          test -f TaxiDriver_Project/app/src/main/AndroidManifest.xml

      - name: Verify version and target
        run: |
          cd TaxiDriver_Project
          grep -n "versionCode\|versionName\|targetSdk" app/build.gradle
          test "$(grep -o "versionCode [0-9]*" app/build.gradle | head -1 | awk '{print $2}')" = "105"
          test "$(grep -o "targetSdk [0-9]*" app/build.gradle | head -1 | awk '{print $2}')" = "36"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing KEYSTORE_BASE64"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks
          test -s upload-keystore.jks

      - name: Build signed release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd TaxiDriver_Project
          gradle :app:bundleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/upload-keystore.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Verify AAB exists
        run: |
          test -s TaxiDriver_Project/app/build/outputs/bundle/release/app-release.aab
          ls -lh TaxiDriver_Project/app/build/outputs/bundle/release/app-release.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Taxi-Driver-1.0.5-Signed-AAB
          path: TaxiDriver_Project/app/build/outputs/bundle/release/app-release.aab
