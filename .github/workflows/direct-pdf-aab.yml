name: Build Taxi Driver 1.0.9 Premium Currency - AAB + APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36
        run: |
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Extract Currency Fixed Premium Project
        run: |
          set -e

          ZIP="Taxi_Driver_1.0.9_PREMIUM_FINAL_DESIGN_PROJECT_BUILD_FIXED_CURRENCY.zip"

          echo "Using ZIP:"
          echo "$ZIP"

          test -f "$ZIP"

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP" -d project

          echo "Project extracted successfully."

      - name: Find Android Project
        run: |
          set -e

          SETTINGS=$(find project -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) -print -quit)

          test -n "$SETTINGS"

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Verify Project
        run: |
          set -e

          MAIN_FILE=$(find "$PROJECT_DIR/app/src/main/java" \
            -type f \
            -name "MainActivity.java" \
            -print -quit)

          test -n "$MAIN_FILE"

          test -f "$PROJECT_DIR/app/src/main/assets/index.html"

          test -f "$PROJECT_DIR/app/src/main/res/drawable-nodpi/taxi_driver_premium_logo.png"

          echo "MainActivity found:"
          echo "$MAIN_FILE"

          echo "HTML found:"
          echo "$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Premium logo found."

      - name: Fix Premium Callback
        run: |
          set -e

          MAIN_FILE=$(find "$PROJECT_DIR/app/src/main/java" \
            -type f \
            -name "MainActivity.java" \
            -print -quit)

          test -n "$MAIN_FILE"

          python3 - "$MAIN_FILE" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          s = s.replace(
              "MainActivity.MainActivity.this::showPremiumPlans",
              "MainActivity.this::showPremiumPlans"
          )

          p.write_text(s)

          print("Premium callback cleanup completed.")
          PY

          echo "Checking Premium callback:"
          grep -n "showPremiumPlans" "$MAIN_FILE" || true

      - name: Configure Version 1.0.9
        run: |
          set -e

          python3 - "$PROJECT_DIR/app/build.gradle" <<'PY'
          import sys
          import re
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          s = re.sub(
              r'versionCode\s+\d+',
              'versionCode 109',
              s,
              count=1
          )

          s = re.sub(
              r'versionName\s+["\'][^"\']+["\']',
              'versionName "1.0.9"',
              s,
              count=1
          )

          s = re.sub(
              r'compileSdk\s+\d+',
              'compileSdk 36',
              s,
              count=1
          )

          s = re.sub(
              r'targetSdk\s+\d+',
              'targetSdk 36',
              s,
              count=1
          )

          s = re.sub(
              r'minSdk\s+\d+',
              'minSdk 23',
              s,
              count=1
          )

          p.write_text(s)

          print("Version configuration completed.")
          PY

          echo "===== BUILD CONFIGURATION ====="
          grep -E "versionCode|versionName|compileSdk|minSdk|targetSdk" \
            "$PROJECT_DIR/app/build.gradle" || true
          echo "================================"

      - name: Build Release AAB and APK
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle clean assembleRelease bundleRelease \
            --no-daemon \
            --stacktrace \
            --console=plain

          echo "AAB + APK build completed."

      - name: Prepare Signing Key
        run: |
          set -e

          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore

          test -s release.keystore

          echo "Signing key prepared."

        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Sign AAB
        run: |
          set -e

          mkdir -p output

          AAB=$(find "$PROJECT_DIR/app/build/outputs/bundle/release" \
            -type f \
            -name "*.aab" \
            -print -quit)

          test -n "$AAB"

          echo "Unsigned AAB:"
          echo "$AAB"

          jarsigner \
            -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$AAB" \
            "$KEY_ALIAS"

          jarsigner -verify -verbose -certs "$AAB"

          cp "$AAB" \
            "output/Taxi-Driver-1.0.9-Premium-109-Currency-Signed.aab"

          echo "Signed AAB created."

        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Sign APK
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/release" \
            -type f \
            -name "*.apk" \
            -print -quit)

          test -n "$APK"

          echo "Unsigned APK:"
          echo "$APK"

          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"

          "$BUILD_TOOLS/zipalign" \
            -f 4 \
            "$APK" \
            aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks release.keystore \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out "output/Taxi-Driver-1.0.9-Premium-109-Currency-Signed.apk" \
            aligned.apk

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            "output/Taxi-Driver-1.0.9-Premium-109-Currency-Signed.apk"

          echo "Signed APK created."

        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Show Final Files
        run: |
          echo "======================================"
          echo "FINAL BUILD FILES"
          echo "======================================"

          ls -lh output/

          echo "======================================"

      - name: Upload AAB + APK
        uses: actions/upload-artifact@v4
        with:
          name: Taxi-Driver-1.0.9-Premium-109-Currency-AAB-APK
          path: |
            output/Taxi-Driver-1.0.9-Premium-109-Currency-Signed.aab
            output/Taxi-Driver-1.0.9-Premium-109-Currency-Signed.apk
          if-no-files-found: error
