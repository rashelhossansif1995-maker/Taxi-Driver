- name: Configure explicit release signing
  shell: bash
  env:
    KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
  run: |
    set -e

    BUILD_FILE="$PROJECT_DIR/app/build.gradle"

    cat >> "$BUILD_FILE" <<'EOF'

    // TAXI_DRIVER_EXPLICIT_RELEASE_SIGNING
    android {
        signingConfigs {
            release {
                storeFile file(System.getenv("GITHUB_WORKSPACE") + "/upload-keystore.jks")
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }

        buildTypes {
            release {
                signingConfig signingConfigs.release
            }
        }
    }
    EOF

    grep -q "signingConfig signingConfigs.release" "$BUILD_FILE"

    echo "Explicit release signing configured."
