name: Taxi Driver 1.1.0 FINAL - AAB APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Taxi Driver 1.1.0 FINAL
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT REPOSITORY
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. FIND FINAL ZIP
      # ==========================================
      - name: Find FINAL ZIP
        shell: bash
        run: |
          set -e

          ZIP="Taxi_Driver_1.1.0_FINAL_OVERPAYMENT_BACKUP_RESTORE_FIXED_GITHUB.zip"

          echo "Checking FINAL ZIP..."

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: FINAL ZIP NOT FOUND"
            echo ""
            echo "Expected file:"
            echo "$ZIP"
            echo ""
            echo "Repository files:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo ""
          echo "FINAL ZIP FOUND:"
          ls -lh "$ZIP"


      # ==========================================
      # 3. EXTRACT FINAL ZIP
      # ==========================================
      - name: Extract FINAL ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted_final taxi_work

          mkdir -p extracted_final

          unzip -q \
            "Taxi_Driver_1.1.0_FINAL_OVERPAYMENT_BACKUP_RESTORE_FIXED_GITHUB.zip" \
            -d extracted_final

          if [ -d "extracted_final/taxi_work" ]; then
            cp -R "extracted_final/taxi_work" "taxi_work"
          else

            FOUND_DIR=$(find extracted_final \
              -type d \
              -name "taxi_work" \
              -print -quit)

            if [ -z "$FOUND_DIR" ]; then
              echo "ERROR: taxi_work folder not found."
              find extracted_final -maxdepth 4 -type f | sort
              exit 1
            fi

            cp -R "$FOUND_DIR" "taxi_work"
          fi

          echo ""
          echo "FINAL PROJECT:"
          find taxi_work -maxdepth 4 -type f | sort | head -300


      # ==========================================
      # 4. SET MINIMUM SDK 24
      # ==========================================
      - name: Set Minimum SDK 24
        shell: bash
        run: |
          set -e

          BUILD="taxi_work/app/build.gradle"

          if [ ! -f "$BUILD" ]; then
            echo "ERROR: app/build.gradle NOT FOUND"
            exit 1
          fi

          echo "=========================================="
          echo "SETTING MIN SDK 24"
          echo "=========================================="

          echo ""
          echo "Before:"
          grep -n "minSdk" "$BUILD" || true

          sed -i -E \
            's/minSdk[[:space:]]+[0-9]+/minSdk 24/' \
            "$BUILD"

          echo ""
          echo "After:"
          grep -n "minSdk" "$BUILD"

          grep -Eq \
            "minSdk[[:space:]]+24" \
            "$BUILD" || {
              echo "ERROR: Could not set minSdk 24"
              exit 1
            }

          echo ""
          echo "minSdk 24: OK"


      # ==========================================
      # 5. VERIFY OVERPAYMENT + BACKUP
      # ==========================================
      - name: Verify Overpayment and Backup
        shell: bash
        run: |
          set -e

          HTML="taxi_work/app/src/main/assets/index.html"

          if [ ! -f "$HTML" ]; then
            echo "ERROR: index.html NOT FOUND"
            exit 1
          fi

          echo "Checking OVERPAYMENT..."

          grep -Fqi "overpayment" "$HTML" || {
            echo "ERROR: OVERPAYMENT NOT FOUND"
            exit 1
          }

          echo "OVERPAYMENT: OK"

          echo ""
          echo "Checking Financial Loan removal..."

          if grep -Fqi "Financial Loan" "$HTML"; then
            echo "ERROR: Financial Loan still exists."
            grep -Fin "Financial Loan" "$HTML" | head -30
            exit 1
          fi

          echo "Financial Loan: REMOVED"

          echo ""
          echo "Checking Export Backup..."

          grep -Fq "backupData" "$HTML" || {
            echo "ERROR: backupData NOT FOUND"
            exit 1
          }

          echo "Export Backup: OK"

          echo ""
          echo "Checking Restore Backup..."

          grep -Fq "restoreData" "$HTML" || {
            echo "ERROR: restoreData NOT FOUND"
            exit 1
          }

          echo "Restore Backup: OK"

          echo ""
          echo "FINAL HTML CHECK: PASSED"


      # ==========================================
      # 6. SETUP JDK 17
      # ==========================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 7. SETUP ANDROID SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""


      # ==========================================
      # 8. INSTALL ANDROID 36
      # ==========================================
      - name: Install Android 36 SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(
              find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -print -quit \
              2>/dev/null || true
            )"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo ""
          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          echo ""
          echo "Installing Android Platform 36..."

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platforms;android-36"

          echo ""
          echo "Installing Build Tools 36.0.0..."

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "build-tools;36.0.0"

          echo ""
          echo "Android SDK installation completed."


      # ==========================================
      # 9. VERIFY ANDROID SDK
      # ==========================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "Checking Android Platform 36..."

          test -d \
            "$ANDROID_HOME/platforms/android-36"

          echo "Platform 36: OK"

          echo ""
          echo "Checking Build Tools 36.0.0..."

          test -d \
            "$ANDROID_HOME/build-tools/36.0.0"

          echo "Build Tools 36.0.0: OK"

          echo ""
          echo "Checking zipalign..."

          test -f \
            "$ANDROID_HOME/build-tools/36.0.0/zipalign"

          echo "zipalign: OK"

          echo ""
          echo "Checking apksigner..."

          test -f \
            "$ANDROID_HOME/build-tools/36.0.0/apksigner"

          echo "apksigner: OK"

          echo ""
          echo "ANDROID SDK CHECK: PASSED"


      # ==========================================
      # 10. SETUP GRADLE
      # ==========================================
      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"


      # ==========================================
      # 11. CHECK ANDROID PROJECT
      # ==========================================
      - name: Check Android Project
        working-directory: taxi_work
        shell: bash
        run: |
          set -e

          echo "Project:"
          pwd

          echo ""
          echo "Files:"

          find . \
            -maxdepth 4 \
            -type f \
            | sort \
            | head -300

          test -f app/build.gradle

          echo ""
          echo "app/build.gradle: FOUND"


      # ==========================================
      # 12. VERIFY VERSION + SDK
      # ==========================================
      - name: Verify Version 1.1.0 Code 110 SDK 36 Min SDK 24
        shell: bash
        run: |
          set -e

          BUILD="taxi_work/app/build.gradle"

          echo "=========================================="
          echo "VERSION / SDK CHECK"
          echo "=========================================="

          echo ""
          echo "Current configuration:"

          grep -nE \
            "compileSdk|minSdk|targetSdk|versionCode|versionName" \
            "$BUILD"

          echo ""
          echo "Checking compileSdk 36..."

          grep -Eq \
            "compileSdk[[:space:]]+36" \
            "$BUILD" || {
              echo "ERROR: compileSdk 36 NOT FOUND"
              exit 1
            }

          echo "compileSdk 36: OK"

          echo ""
          echo "Checking minSdk 24..."

          grep -Eq \
            "minSdk[[:space:]]+24" \
            "$BUILD" || {
              echo "ERROR: minSdk 24 NOT FOUND"
              exit 1
            }

          echo "minSdk 24: OK"

          echo ""
          echo "Checking targetSdk 36..."

          grep -Eq \
            "targetSdk[[:space:]]+36" \
            "$BUILD" || {
              echo "ERROR: targetSdk 36 NOT FOUND"
              exit 1
            }

          echo "targetSdk 36: OK"

          echo ""
          echo "Checking versionCode 110..."

          grep -Eq \
            "versionCode[[:space:]]+110" \
            "$BUILD" || {
              echo "ERROR: versionCode 110 NOT FOUND"
              exit 1
            }

          echo "versionCode 110: OK"

          echo ""
          echo "Checking versionName 1.1.0..."

          grep -Eq \
            "versionName[[:space:]]+['\"]1\.1\.0['\"]" \
            "$BUILD" || {
              echo "ERROR: versionName 1.1.0 NOT FOUND"
              exit 1
            }

          echo "versionName 1.1.0: OK"

          echo ""
          echo "VERSION / SDK CHECK: PASSED"


      # ==========================================
      # 13. CHECK SIGNING SECRETS
      # ==========================================
      - name: Check Signing Secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          test -n "$KEYSTORE_BASE64" || {
            echo "ERROR: KEYSTORE_BASE64 missing"
            exit 1
          }

          test -n "$KEYSTORE_PASSWORD" || {
            echo "ERROR: KEYSTORE_PASSWORD missing"
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "ERROR: KEY_ALIAS missing"
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "ERROR: KEY_PASSWORD missing"
            exit 1
          }

          echo "SIGNING SECRETS: OK"


      # ==========================================
      # 14. PREPARE SIGNING KEYSTORE
      # ==========================================
      - name: Prepare Signing Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          echo "$KEYSTORE_BASE64" \
            | base64 --decode \
            > taxi-release.keystore

          test -s taxi-release.keystore || {
            echo "ERROR: Keystore creation failed"
            exit 1
          }

          echo "KEYSTORE: READY"


      # ==========================================
      # 15. BUILD RELEASE AAB + APK
      # ==========================================
      - name: Build Release AAB and APK
        working-directory: taxi_work
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING TAXI DRIVER 1.1.0"
          echo "=========================================="

          gradle \
            clean \
            bundleRelease \
            assembleRelease \
            --no-daemon

          echo ""
          echo "BUILD COMPLETED"

          echo ""
          echo "BUILD OUTPUTS:"

          find app/build/outputs \
            -type f \
            | sort


      # ==========================================
      # 16. CHECK AAB
      # ==========================================
      - name: Check AAB
        shell: bash
        run: |
          set -e

          AAB="taxi_work/app/build/outputs/bundle/release/app-release.aab"

          test -f "$AAB" || {
            echo "ERROR: AAB NOT CREATED"
            exit 1
          }

          echo "AAB CREATED:"
          ls -lh "$AAB"


      # ==========================================
      # 17. SIGN AAB
      # ==========================================
      - name: Sign AAB
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          AAB="taxi_work/app/build/outputs/bundle/release/app-release.aab"

          jarsigner \
            -keystore taxi-release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            "$AAB" \
            "$KEY_ALIAS"

          echo "AAB SIGNED"


      # ==========================================
      # 18. VERIFY AAB SIGNATURE
      # ==========================================
      - name: Verify AAB Signature
        shell: bash
        run: |
          set -e

          jarsigner \
            -verify \
            -verbose \
            -certs \
            taxi_work/app/build/outputs/bundle/release/app-release.aab

          echo "AAB SIGNATURE: VERIFIED"


      # ==========================================
      # 19. PREPARE APK
      # ==========================================
      - name: Prepare APK
        shell: bash
        run: |
          set -e

          APK="taxi_work/app/build/outputs/apk/release/app-release-unsigned.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: unsigned APK NOT FOUND"

            echo ""
            echo "APK files:"

            find taxi_work/app/build/outputs/apk \
              -type f \
              | sort

            exit 1
          fi

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
            -f \
            -p \
            4 \
            "$APK" \
            taxi-unsigned-aligned.apk

          echo "APK ALIGNED"


      # ==========================================
      # 20. SIGN APK
      # ==========================================
      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            sign \
            --ks taxi-release.keystore \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass pass:"$KEY_PASSWORD" \
            --out taxi-signed.apk \
            taxi-unsigned-aligned.apk

          echo "APK SIGNED"


      # ==========================================
      # 21. VERIFY APK SIGNATURE
      # ==========================================
      - name: Verify APK Signature
        shell: bash
        run: |
          set -e

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            verify \
            --verbose \
            taxi-signed.apk

          echo "APK SIGNATURE: VERIFIED"


      # ==========================================
      # 22. CREATE FINAL RELEASE FILES
      # ==========================================
      - name: Create Final Release Files
        shell: bash
        run: |
          set -e

          rm -rf output

          mkdir -p output

          cp \
            taxi_work/app/build/outputs/bundle/release/app-release.aab \
            "output/Taxi-Driver-1.1.0-Premium-110-Currency-Signed.aab"

          cp \
            taxi-signed.apk \
            "output/Taxi-Driver-1.1.0-Premium-110-Currency-Signed.apk"

          echo ""
          echo "=========================================="
          echo "FINAL RELEASE"
          echo "=========================================="

          ls -lh output/


      # ==========================================
      # 23. UPLOAD AAB + APK
      # ==========================================
      - name: Upload AAB and APK
        uses: actions/upload-artifact@v4
        with:
          name: Taxi-Driver-1.1.0-FINAL-Overpayment-Backup-Restore
          path: output/
          if-no-files-found: error
