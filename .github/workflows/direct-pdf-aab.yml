name: Taxi Driver 1.1.1 FINAL - Signed AAB APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Taxi Driver 1.1.1
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. JAVA 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 3. SETUP GRADLE 8.10.2
      # ==========================================
      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"


      # ==========================================
      # 4. FIND ANDROID SDKMANAGER
      # ==========================================
      - name: Find Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER=""

          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          if [ -z "$SDKMANAGER" ] && [ -n "$ANDROID_HOME" ]; then
            if [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            fi
          fi

          if [ -z "$SDKMANAGER" ] && [ -n "$ANDROID_HOME" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -print -quit 2>/dev/null || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android sdkmanager was not found."
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"


      # ==========================================
      # 5. INSTALL ANDROID 36
      # ==========================================
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo "Android SDK 36 installed."


      # ==========================================
      # 6. FIND 1.1.1 SOURCE ZIP
      # ==========================================
      - name: Find Taxi Driver 1.1.1 source ZIP
        shell: bash
        run: |
          set -e

          echo "Searching repository for 1.1.1 source..."

          ZIP_FILE=""

          ZIP_FILE="$(find . \
            -maxdepth 3 \
            -type f \
            -name 'Taxi-Driver-1.1.1-FINAL-FIXED.zip' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . \
              -maxdepth 3 \
              -type f \
              -name 'Taxi-Driver-1.1.1-FINAL-FIXED-SOURCE.zip' \
              -print -quit)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Taxi Driver 1.1.1 source ZIP not found."
            echo ""
            echo "Repository files:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "SOURCE ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ==========================================
      # 7. EXTRACT SOURCE
      # ==========================================
      - name: Extract Taxi Driver 1.1.1
        shell: bash
        run: |
          set -e

          rm -rf taxi_source
          mkdir -p taxi_source

          unzip -q "$ZIP_FILE" -d taxi_source

          echo "Extracted source:"
          find taxi_source -maxdepth 5 -type f | sort


      # ==========================================
      # 8. FIND ANDROID PROJECT
      # ==========================================
      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          if [ -f "taxi_source/taxi_work/settings.gradle" ]; then
            PROJECT_DIR="taxi_source/taxi_work"
          elif [ -f "taxi_source/taxi_work/settings.gradle.kts" ]; then
            PROJECT_DIR="taxi_source/taxi_work"
          else

            SETTINGS_FILE="$(find taxi_source \
              -type f \
              \( \
                -name 'settings.gradle' \
                -o \
                -name 'settings.gradle.kts' \
              \) \
              -print -quit)"

            if [ -n "$SETTINGS_FILE" ]; then
              PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."

            echo ""
            echo "Gradle project files:"
            find taxi_source \
              -type f \
              \( \
                -name 'settings.gradle' \
                -o \
                -name 'settings.gradle.kts' \
                -o \
                -name 'build.gradle' \
                -o \
                -name 'build.gradle.kts' \
              \) \
              -print

            exit 1
          fi

          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo "ANDROID PROJECT:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==========================================
      # 9. CHECK VERSION
      # ==========================================
      - name: Verify Version 1.1.1
        shell: bash
        run: |
          set -e

          echo "Checking Taxi Driver version..."

          grep -n \
            -E \
            "compileSdk|targetSdk|versionCode|versionName" \
            "$PROJECT_DIR/app/build.gradle"

          echo ""
          echo "Expected:"
          echo "Version Code: 111"
          echo "Version Name: 1.1.1"
          echo "Target SDK: 36"


      # ==========================================
      # 10. PREPARE SIGNING KEY
      # ==========================================
      - name: Prepare release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 GitHub Secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$GITHUB_WORKSPACE/taxi-release.keystore"

          test -s "$GITHUB_WORKSPACE/taxi-release.keystore"

          echo "Release keystore prepared."


      # ==========================================
      # 11. BUILD RELEASE AAB + APK
      # ==========================================
      - name: Build release AAB and APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Gradle version:"
          gradle --version

          echo ""
          echo "Cleaning project..."

          gradle clean

          echo ""
          echo "Building Release AAB..."

          gradle bundleRelease --stacktrace

          echo ""
          echo "Building Release APK..."

          gradle assembleRelease --stacktrace


      # ==========================================
      # 12. CHECK UNSIGNED OUTPUT
      # ==========================================
      - name: Check build output
        shell: bash
        run: |
          set -e

          echo "AAB files:"
          find "$PROJECT_DIR" \
            -type f \
            -name "*.aab" \
            -exec ls -lh {} \;

          echo ""
          echo "APK files:"
          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;


      # ==========================================
      # 13. SIGN AAB
      # ==========================================
      - name: Sign AAB
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          AAB="$PROJECT_DIR/app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$AAB" ]; then
            echo "ERROR: Release AAB not found."
            exit 1
          fi

          jarsigner \
            -keystore "$GITHUB_WORKSPACE/taxi-release.keystore" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            "$AAB" \
            "$KEY_ALIAS"

          echo "AAB signed successfully."


      # ==========================================
      # 14. VERIFY AAB
      # ==========================================
      - name: Verify signed AAB
        shell: bash
        run: |
          set -e

          AAB="$PROJECT_DIR/app/build/outputs/bundle/release/app-release.aab"

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$AAB"

          echo "AAB signature verification successful."


      # ==========================================
      # 15. ALIGN APK
      # ==========================================
      - name: Align APK
        shell: bash
        run: |
          set -e

          UNSIGNED_APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release-unsigned.apk"

          if [ ! -f "$UNSIGNED_APK" ]; then
            echo "ERROR: Unsigned APK not found."
            exit 1
          fi

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
            -f \
            -p \
            4 \
            "$UNSIGNED_APK" \
            "$GITHUB_WORKSPACE/taxi-aligned.apk"

          echo "APK aligned."


      # ==========================================
      # 16. SIGN APK
      # ==========================================
      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$GITHUB_WORKSPACE/taxi-release.keystore" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$GITHUB_WORKSPACE/Taxi-Driver-1.1.1-SIGNED.apk" \
            "$GITHUB_WORKSPACE/taxi-aligned.apk"

          echo "APK signed successfully."


      # ==========================================
      # 17. VERIFY APK
      # ==========================================
      - name: Verify signed APK
        shell: bash
        run: |
          set -e

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            verify \
            --verbose \
            "$GITHUB_WORKSPACE/Taxi-Driver-1.1.1-SIGNED.apk"

          echo "APK signature verification successful."


      # ==========================================
      # 18. PREPARE FINAL FILES
      # ==========================================
      - name: Prepare final release
        shell: bash
        run: |
          set -e

          rm -rf output
          mkdir -p output

          cp \
            "$PROJECT_DIR/app/build/outputs/bundle/release/app-release.aab" \
            "output/Taxi-Driver-1.1.1-SIGNED.aab"

          cp \
            "$GITHUB_WORKSPACE/Taxi-Driver-1.1.1-SIGNED.apk" \
            "output/Taxi-Driver-1.1.1-SIGNED.apk"

          echo ""
          echo "=========================================="
          echo "FINAL RELEASE FILES"
          echo "=========================================="

          ls -lh output/


      # ==========================================
      # 19. UPLOAD FINAL ARTIFACT
      # ==========================================
      - name: Upload signed AAB and APK
        uses: actions/upload-artifact@v4
        with:
          name: Taxi-Driver-1.1.1-SIGNED-AAB-APK
          path: output/*
          if-no-files-found: error
          retention-days: 30
