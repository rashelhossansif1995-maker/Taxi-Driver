name: Taxi Driver 1.1.1 CUMULATIVE FINAL

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Taxi Driver 1.1.1 CUMULATIVE
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. JAVA 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 3. GRADLE
      # ==========================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"


      # ==========================================
      # 4. ANDROID SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ==========================================
      # 5. INSTALL SDK 36
      # ==========================================
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo "Android SDK 36 installed."


      # ==========================================
      # 6. FIND ONLY NEW CUMULATIVE ZIP
      # ==========================================
      - name: Find ONLY CUMULATIVE source ZIP
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING ONLY FOR FINAL CUMULATIVE SOURCE"
          echo "=========================================="

          ZIP_FILE="$(find . \
            -type f \
            -name 'Taxi-Driver-1.1.1-FINAL-CUMULATIVE-SOURCE.zip' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo ""
            echo "ERROR!"
            echo "FINAL CUMULATIVE SOURCE ZIP NOT FOUND."
            echo ""
            echo "Required:"
            echo "Taxi-Driver-1.1.1-FINAL-CUMULATIVE-SOURCE.zip"
            echo ""
            echo "Repository ZIP files:"
            find . \
              -type f \
              -name "*.zip" \
              -print \
              | sort

            exit 1
          fi

          echo ""
          echo "FOUND FINAL CUMULATIVE SOURCE:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ==========================================
      # 7. EXTRACT ONLY NEW SOURCE
      # ==========================================
      - name: Extract CUMULATIVE source
        shell: bash
        run: |
          set -e

          rm -rf taxi_source
          mkdir -p taxi_source

          unzip -q "$ZIP_FILE" -d taxi_source

          echo "=========================================="
          echo "CUMULATIVE SOURCE EXTRACTED"
          echo "=========================================="

          find taxi_source -maxdepth 6 -type f | sort


      # ==========================================
      # 8. FIND ANDROID PROJECT
      # ==========================================
      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          SETTINGS_FILE="$(find taxi_source \
            -type f \
            \( \
              -name 'settings.gradle' \
              -o \
              -name 'settings.gradle.kts' \
            \) \
            -print -quit)"

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo "ANDROID PROJECT:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==========================================
      # 9. VERIFY INDEX.HTML
      # ==========================================
      - name: Verify CUMULATIVE index.html
        shell: bash
        run: |
          set -e

          INDEX_FILE="$PROJECT_DIR/app/src/main/assets/index.html"

          if [ ! -f "$INDEX_FILE" ]; then
            echo "ERROR: index.html not found."
            exit 1
          fi

          echo "=========================================="
          echo "FINAL CUMULATIVE index.html FOUND"
          echo "=========================================="

          ls -lh "$INDEX_FILE"

          echo ""
          echo "Checking monthly filter..."

          if grep -q "startsWith(ms)" "$INDEX_FILE"; then
            echo "ERROR: OLD MONTHLY FILTER STILL EXISTS!"
            echo "Build stopped."
            exit 1
          fi

          echo "OK: OLD MONTHLY FILTER NOT FOUND."


      # ==========================================
      # 10. VERIFY PROJECT
      # ==========================================
      - name: Verify project files
        shell: bash
        run: |
          set -e

          echo "Gradle files:"
          find "$PROJECT_DIR" \
            -maxdepth 4 \
            -type f \
            \( \
              -name "build.gradle" \
              -o \
              -name "build.gradle.kts" \
              -o \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            -print


      # ==========================================
      # 11. PREPARE SIGNING KEY
      # ==========================================
      - name: Prepare release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$GITHUB_WORKSPACE/taxi-release.keystore"

          if [ ! -s "$GITHUB_WORKSPACE/taxi-release.keystore" ]; then
            echo "ERROR: Keystore is empty."
            exit 1
          fi

          echo "Keystore ready."


      # ==========================================
      # 12. CLEAN
      # ==========================================
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle clean


      # ==========================================
      # 13. BUILD AAB
      # ==========================================
      - name: Build Release AAB
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle bundleRelease --stacktrace


      # ==========================================
      # 14. BUILD APK
      # ==========================================
      - name: Build Release APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle assembleRelease --stacktrace


      # ==========================================
      # 15. FIND AAB
      # ==========================================
      - name: Find AAB
        shell: bash
        run: |
          set -e

          AAB="$(find "$PROJECT_DIR" \
            -type f \
            -name "app-release.aab" \
            -print -quit)"

          if [ -z "$AAB" ]; then
            echo "ERROR: AAB not found."
            exit 1
          fi

          echo "AAB FOUND:"
          echo "$AAB"

          echo "AAB_FILE=$AAB" >> "$GITHUB_ENV"


      # ==========================================
      # 16. SIGN AAB
      # ==========================================
      - name: Sign AAB
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          jarsigner \
            -keystore "$GITHUB_WORKSPACE/taxi-release.keystore" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            "$AAB_FILE" \
            "$KEY_ALIAS"

          echo "AAB signed."


      # ==========================================
      # 17. VERIFY AAB
      # ==========================================
      - name: Verify AAB
        shell: bash
        run: |
          set -e

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$AAB_FILE"

          echo "AAB signature verified."


      # ==========================================
      # 18. FIND APK
      # ==========================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          APK="$(find "$PROJECT_DIR" \
            -type f \
            -name "app-release-unsigned.apk" \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: unsigned APK not found."
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          echo "APK_FILE=$APK" >> "$GITHUB_ENV"


      # ==========================================
      # 19. ALIGN APK
      # ==========================================
      - name: Align APK
        shell: bash
        run: |
          set -e

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
            -f \
            -p \
            4 \
            "$APK_FILE" \
            "$GITHUB_WORKSPACE/taxi-aligned.apk"


      # ==========================================
      # 20. SIGN APK
      # ==========================================
      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$GITHUB_WORKSPACE/taxi-release.keystore" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$GITHUB_WORKSPACE/Taxi-Driver-1.1.1-CUMULATIVE-SIGNED.apk" \
            "$GITHUB_WORKSPACE/taxi-aligned.apk"

          echo "APK signed."


      # ==========================================
      # 21. VERIFY APK
      # ==========================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            verify \
            --verbose \
            "$GITHUB_WORKSPACE/Taxi-Driver-1.1.1-CUMULATIVE-SIGNED.apk"

          echo "APK signature verified."


      # ==========================================
      # 22. PREPARE FINAL FILES
      # ==========================================
      - name: Prepare final files
        shell: bash
        run: |
          set -e

          rm -rf output
          mkdir -p output

          cp "$AAB_FILE" \
            "output/Taxi-Driver-1.1.1-CUMULATIVE-SIGNED.aab"

          cp "$GITHUB_WORKSPACE/Taxi-Driver-1.1.1-CUMULATIVE-SIGNED.apk" \
            "output/Taxi-Driver-1.1.1-CUMULATIVE-SIGNED.apk"

          echo "=========================================="
          echo "FINAL RELEASE FILES"
          echo "=========================================="

          ls -lh output/


      # ==========================================
      # 23. UPLOAD ARTIFACTS
      # ==========================================
      - name: Upload AAB and APK
        uses: actions/upload-artifact@v4
        with:
          name: Taxi-Driver-1.1.1-CUMULATIVE-SIGNED
          path: output/*
          if-no-files-found: error
          retention-days: 30
