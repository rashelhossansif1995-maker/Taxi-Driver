name: Build Taxi Driver Direct PDF

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout Repository
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Set up JDK 17
      # ==========================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # 3. Set up Android SDK
      # ==========================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''


      # ==========================================
      # 4. Install Android 36 SDK
      # ==========================================
      - name: Install Android 36 SDK components
        run: |
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"


      # ==========================================
      # 5. Verify Android SDK
      # ==========================================
      - name: Verify Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -d "${ANDROID_SDK_ROOT}/platforms/android-36"
          test -d "${ANDROID_SDK_ROOT}/build-tools/36.0.0"

          echo "Android SDK 36 verified successfully"


      # ==========================================
      # 6. Set up Gradle
      # ==========================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'


      # ==========================================
      # 7. Extract Direct PDF Project
      # ==========================================
      - name: Extract Direct PDF project
        run: |
          unzip -o \
            Taxi_Driver_PlayStore_Update_1.0.5_DIRECT_PDF.zip \
            -d direct_pdf_project

          PROJECT_DIR=$(find direct_pdf_project \
            -type f \
            -name "settings.gradle" \
            -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found at:"
          echo "$PROJECT_DIR"


      # ==========================================
      # 8. Fix AdMob SDK
      # ==========================================
      - name: Fix AdMob SDK version
        run: |
          echo "Current AdMob SDK:"
          grep -n "play-services-ads" \
            "$PROJECT_DIR/app/build.gradle" || true

          sed -i \
            "s/com.google.android.gms:play-services-ads:25.5.0/com.google.android.gms:play-services-ads:24.8.0/g" \
            "$PROJECT_DIR/app/build.gradle"

          echo "AdMob SDK after fix:"
          grep -n "play-services-ads" \
            "$PROJECT_DIR/app/build.gradle"

          grep -q \
            "play-services-ads:24.8.0" \
            "$PROJECT_DIR/app/build.gradle"

          echo "AdMob SDK 24.8.0 verified"


      # ==========================================
      # 9. Fix BillingClientStateListener
      # ==========================================
      - name: Fix BillingClientStateListener
        run: |
          MAIN_ACTIVITY="$PROJECT_DIR/app/src/main/java/com/taxidriver/apk/MainActivity.java"

          if [ ! -f "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity.java not found"
            exit 1
          fi

          echo "Checking BillingClientStateListener..."

          grep -n "BillingClientStateListener" \
            "$
