name: Taxi Driver 1.1.2 - Original Source AAB APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract original source unchanged
        shell: bash
        run: |
          set -euo pipefail
          unzip -q "Taxi-Driver-Premium-Popups-Integrated-Source-v1.1.2.zip" -d source
          test -f source/taxi_work/app/src/main/assets/index.html
          test -f source/taxi_work/app/build.gradle

      - name: Check original version
        shell: bash
        run: |
          grep -E 'applicationId|versionCode|versionName|targetSdk' source/taxi_work/app/build.gradle

      - name: Prepare original upload key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > taxi-release.keystore
          test -s taxi-release.keystore

      - name: Build original AAB and APK
        working-directory: source/taxi_work
        run: gradle clean bundleRelease assembleRelease --no-daemon

      - name: Sign Play Store AAB
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          jarsigner -keystore taxi-release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            source/taxi_work/app/build/outputs/bundle/release/app-release.aab \
            "$KEY_ALIAS"
          jarsigner -verify -strict source/taxi_work/app/build/outputs/bundle/release/app-release.aab

      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 \
            source/taxi_work/app/build/outputs/apk/release/app-release-unsigned.apk \
            taxi-aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks taxi-release.keystore \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out taxi-signed.apk taxi-aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose taxi-signed.apk

      - name: Prepare final files
        run: |
          mkdir -p output
          cp source/taxi_work/app/build/outputs/bundle/release/app-release.aab output/Taxi-Driver-1.1.2-SIGNED.aab
          cp taxi-signed.apk output/Taxi-Driver-1.1.2-SIGNED.apk

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: Taxi-Driver-1.1.2-AAB-APK
          path: output/*
          retention-days: 30
