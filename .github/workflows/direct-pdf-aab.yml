name: Taxi Driver 1.1.1 MONTH FIXED - Signed AAB APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Taxi Driver 1.1.1 MONTH FIXED
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT REPOSITORY
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. JAVA 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 3. SETUP GRADLE
      # ==========================================
      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"


      # ==========================================
      # 4. FIND ANDROID SDK
      # ==========================================
      - name: Find Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER=""

          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          if [ -z "$SDKMANAGER" ] && [ -n "$ANDROID_HOME" ]; then
            if [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            fi
          fi

          if [ -z "$SDKMANAGER" ] && [ -n "$ANDROID_HOME" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -print -quit 2>/dev/null || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android sdkmanager was not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "Using:"
          echo "$SDKMANAGER"


      # ==========================================
      # 5. INSTALL ANDROID SDK 36
      # ==========================================
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo "Android SDK 36 ready."


      # ==========================================
      # 6. FIND NEW MONTH-FIXED SOURCE ZIP
      # ==========================================
      - name: Find NEW MONTH FIXED source
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING FOR NEW MONTH-FIXED SOURCE"
          echo "=========================================="

          ZIP_FILE="$(find . \
            -type f \
            -name 'Taxi-Driver-1.1.1-FINAL-MONTH-FIXED-SOURCE.zip' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo ""
            echo "ERROR: NEW MONTH-FIXED SOURCE ZIP NOT FOUND!"
            echo ""
            echo "Required file:"
            echo "Taxi-Driver-1.1.1-FINAL-MONTH-FIXED-SOURCE.zip"
            echo ""
            echo "Repository files:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          echo ""
          echo "NEW MONTH-FIXED SOURCE FOUND:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ==========================================
      # 7. EXTRACT NEW SOURCE
      # ==========================================
      - name: Extract NEW MONTH FIXED source
        shell: bash
        run: |
          set -e

          rm -rf taxi_source
          mkdir -p taxi_source

          unzip -q "$ZIP_FILE" -d taxi_source

          echo "=========================================="
          echo "NEW SOURCE EXTRACTED"
          echo "=========================================="

          find taxi_source -maxdepth 6 -type f | sort


      # ==========================================
      # 8. FIND ANDROID PROJECT
      # ==========================================
      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          # Expected project location
          if [ -f "taxi_source/taxi_work/settings.gradle" ]; then
            PROJECT_DIR="taxi_source/taxi_work"

          elif [ -f "taxi_source/taxi_work/settings.gradle.kts" ]; then
            PROJECT_DIR="taxi_source/taxi_work"

          else

            SETTINGS_FILE="$(find taxi_source \
              -type f \
              \( \
                -name 'settings.gradle' \
                -o \
                -name 'settings.gradle.kts' \
              \) \
              -print -quit)"

            if [ -n "$SETTINGS_FILE" ]; then
              PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
            fi

          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."

            echo ""
            echo "Gradle files found:"
            find taxi_source \
              -type f \
              \( \
                -name 'settings.gradle' \
                -o \
                -name 'settings.gradle.kts' \
                -o \
                -name 'build.gradle' \
                -o \
                -name 'build.gradle.kts' \
              \) \
              -print

            exit 1
          fi

          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo ""
          echo "ANDROID PROJECT:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==========================================
      # 9. VERIFY 1.1.1
      # ==========================================
      - name: Verify Version 1.1.1
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERSION CHECK"
          echo "=========================================="

          grep -R \
            -n \
            -E \
            "versionCode|versionName|compileSdk|targetSdk" \
            "$PROJECT_DIR/app" \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            2>/dev/null || true

          echo ""
          echo "EXPECTED:"
          echo "Version Name: 1.1.1"
          echo "Version Code: 111"
          echo "Target SDK: 36"


      # ==========================================
      # 10. CHECK MONTH-FIXED INDEX.HTML
      # ==========================================
      - name: Verify MONTH FIXED index.html
        shell: bash
        run: |
          set -e

          INDEX_FILE="$PROJECT_DIR/app/src/main/assets/index.html"

          if [ ! -f "$INDEX_FILE" ]; then
            echo "ERROR: index.html not found!"
            exit 1
          fi

          echo "=========================================="
          echo "INDEX.HTML FOUND"
          echo "=========================================="

          ls -lh "$INDEX_FILE"

          echo ""
          echo "Checking source..."

          if grep -q "startsWith(ms)" "$INDEX_FILE"; then
            echo "WARNING: old monthly filter detected."
          else
            echo "Old startsWith(ms) filter not detected."
          fi

          echo ""
          echo "index.html verification complete."


      # ==========================================
      # 11. PREPARE SIGNING KEY
      # ==========================================
      - name: Prepare release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$GITHUB_WORKSPACE/taxi-release.keystore"

          if [ ! -s "$GITHUB_WORKSPACE/taxi-release.keystore" ]; then
            echo "ERROR: Keystore file is empty."
            exit 1
          fi

          echo "Release keystore prepared."


      # ==========================================
      # 12. CLEAN PROJECT
      # ==========================================
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle clean


      # ==========================================
      # 13. BUILD AAB
      # ==========================================
      - name: Build Release AAB
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "BUILDING RELEASE AAB"
          echo "=========================================="

          gradle bundleRelease --stacktrace


      # ==========================================
      # 14. BUILD APK
      # ==========================================
      - name: Build Release APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "BUILDING RELEASE APK"
          echo "=========================================="

          gradle assembleRelease --stacktrace


      # ==========================================
      # 15. CHECK BUILD FILES
      # ==========================================
      - name: Check build outputs
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILD OUTPUTS"
          echo "=========================================="

          find "$PROJECT_DIR" \
            -type f \
            \( \
              -name "*.aab" \
              -o \
              -name "*.apk" \
            \) \
            -exec ls -lh {} \;


      # ==========================================
      # 16. SIGN AAB
      # ==========================================
      - name: Sign AAB
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          AAB="$PROJECT_DIR/app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$AAB" ]; then
            echo "ERROR: app-release.aab not found!"
            exit 1
          fi

          jarsigner \
            -keystore "$GITHUB_WORKSPACE/taxi-release.keystore" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            "$AAB" \
            "$KEY_ALIAS"

          echo "AAB signed successfully."


      # ==========================================
      # 17. VERIFY AAB
      # ==========================================
      - name: Verify AAB signature
        shell: bash
        run: |
          set -e

          AAB="$PROJECT_DIR/app/build/outputs/bundle/release/app-release.aab"

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$AAB"

          echo "AAB signature verified."


      # ==========================================
      # 18. ALIGN APK
      # ==========================================
      - name: Align APK
        shell: bash
        run: |
          set -e

          UNSIGNED_APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release-unsigned.apk"

          if [ ! -f "$UNSIGNED_APK" ]; then
            echo "ERROR: unsigned APK not found!"
            exit 1
          fi

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
            -f \
            -p \
            4 \
            "$UNSIGNED_APK" \
            "$GITHUB_WORKSPACE/taxi-aligned.apk"

          echo "APK aligned."


      # ==========================================
      # 19. SIGN APK
      # ==========================================
      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$GITHUB_WORKSPACE/taxi-release.keystore" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$GITHUB_WORKSPACE/Taxi-Driver-1.1.1-MONTH-FIXED-SIGNED.apk" \
            "$GITHUB_WORKSPACE/taxi-aligned.apk"

          echo "APK signed successfully."


      # ==========================================
      # 20. VERIFY APK
      # ==========================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            verify \
            --verbose \
            "$GITHUB_WORKSPACE/Taxi-Driver-1.1.1-MONTH-FIXED-SIGNED.apk"

          echo "APK signature verified."


      # ==========================================
      # 21. PREPARE FINAL RELEASE
      # ==========================================
      - name: Prepare final release files
        shell: bash
        run: |
          set -e

          rm -rf output
          mkdir -p output

          cp \
            "$PROJECT_DIR/app/build/outputs/bundle/release/app-release.aab" \
            "output/Taxi-Driver-1.1.1-MONTH-FIXED-SIGNED.aab"

          cp \
            "$GITHUB_WORKSPACE/Taxi-Driver-1.1.1-MONTH-FIXED-SIGNED.apk" \
            "output/Taxi-Driver-1.1.1-MONTH-FIXED-SIGNED.apk"

          echo "=========================================="
          echo "FINAL FILES"
          echo "=========================================="

          ls -lh output/


      # ==========================================
      # 22. UPLOAD ARTIFACT
      # ==========================================
      - name: Upload final AAB and APK
        uses: actions/upload-artifact@v4
        with:
          name: Taxi-Driver-1.1.1-MONTH-FIXED-SIGNED
          path: output/*
          if-no-files-found: error
          retention-days: 30
