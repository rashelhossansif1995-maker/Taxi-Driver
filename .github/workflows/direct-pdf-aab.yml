name: Build Taxi Driver 1.0.9 Premium - Signed AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. CHECKOUT
      - name: Checkout
        uses: actions/checkout@v4

      # 2. JDK 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. ANDROID SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 4. ANDROID 36
      - name: Install Android 36
        run: |
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # 5. GRADLE
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # 6. EXTRACT NEW FIXED PROJECT
      - name: Extract Final Build Fixed Project
        run: |
          set -e

          ZIP="Taxi_Driver_1.0.9_PREMIUM_FINAL_DESIGN_PROJECT_BUILD_FIXED.zip"

          echo "Using ZIP:"
          echo "$ZIP"

          test -f "$ZIP"

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP" -d project

          echo "PROJECT EXTRACTED SUCCESSFULLY"

      # 7. FIND ANDROID PROJECT
      - name: Find Android Project
        run: |
          set -e

          SETTINGS=$(find project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      # 8. VERIFY PROJECT
      - name: Verify Premium Project
        run: |
          set -e

          MAIN_FILE=$(find "$PROJECT_DIR/app/src/main/java" \
            -type f \
            -name "MainActivity.java" \
            -print -quit)

          if [ -z "$MAIN_FILE" ]; then
            echo "ERROR: MainActivity.java not found"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/assets/index.html" ]; then
            echo "ERROR: index.html not found"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/res/drawable-nodpi/taxi_driver_premium_logo.png" ]; then
            echo "ERROR: Premium logo PNG not found"
            exit 1
          fi

          echo "MainActivity: OK"
          echo "Premium HTML: OK"
          echo "Premium Logo PNG: OK"

      # 9. FIX PREMIUM CALLBACK
      - name: Fix Premium Callback
        run: |
          set -e

          MAIN_FILE=$(find "$PROJECT_DIR/app/src/main/java" \
            -type f \
            -name "MainActivity.java" \
            -print -quit)

          echo "Checking Premium callback..."

          sed -i \
            's/this::showPremiumPlans/MainActivity.this::showPremiumPlans/g' \
            "$MAIN_FILE"

          echo "Premium callback fixed."

      # 10. CONFIGURE VERSION
      - name: Configure Play Store Version
        run: |
          set -e

          python3 - "$PROJECT_DIR/app/build.gradle" <<'PY'
          import sys
          import re
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          s = re.sub(
              r'versionCode\s+\d+',
              'versionCode 109',
              s
          )

          s = re.sub(
              r'versionName\s+["\'][^"\']+["\']',
              'versionName "1.0.9"',
              s
          )

          s = re.sub(
              r'compileSdk\s+\d+',
              'compileSdk 36',
              s
          )

          s = re.sub(
              r'minSdk\s+\d+',
              'minSdk 23',
              s
          )

          s = re.sub(
              r'targetSdk\s+\d+',
              'targetSdk 36',
              s
          )

          p.write_text(s)
          PY

          echo "VERSION NAME: 1.0.9"
          echo "VERSION CODE: 109"
          echo "TARGET SDK: 36"
          echo "MIN SDK: 23"

      # 11. BUILD RELEASE AAB
      - name: Build Release AAB
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          gradle clean bundleRelease \
            --no-daemon \
            --stacktrace \
            --console=plain

          echo "RELEASE AAB BUILD SUCCESSFUL"

      # 12. PREPARE SIGNING KEY
      - name: Prepare Signing Key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > taxi-release.keystore

          test -s taxi-release.keystore

          echo "KEYSTORE READY"

      # 13. SIGN AAB
      - name: Sign AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD secret is missing"
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS secret is missing"
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD secret is missing"
            exit 1
          fi

          AAB="${PROJECT_DIR}/app/build/outputs/bundle/release/app-release.aab"

          test -f "$AAB"

          jarsigner \
            -keystore taxi-release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            "$AAB" \
            "$KEY_ALIAS"

          echo "AAB SIGNED SUCCESSFULLY"

      # 14. VERIFY SIGNATURE
      - name: Verify AAB
        run: |
          set -e

          AAB="${PROJECT_DIR}/app/build/outputs/bundle/release/app-release.aab"

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$AAB"

          echo "AAB SIGNATURE VERIFIED"

      # 15. PREPARE FINAL AAB
      - name: Prepare Final AAB
        run: |
          set -e

          mkdir -p output

          cp \
            "${PROJECT_DIR}/app/build/outputs/bundle/release/app-release.aab" \
            "output/Taxi-Driver-1.0.9-Premium-109-Signed.aab"

          ls -lh output/

      # 16. UPLOAD AAB ARTIFACT
      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: Taxi-Driver-1.0.9-Premium-109-Signed
          path: output/Taxi-Driver-1.0.9-Premium-109-Signed.aab
