name: Build Taxi Driver 1.0.9 Premium - Signed AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36
        run: |
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # ==========================================
      # EXTRACT PROJECT
      # ==========================================
      - name: Extract Premium 3 Plans project
        shell: bash
        run: |
          set -e

          ZIP="Taxi_Driver_PlayStore_Update_1.0.6_PREMIUM_3PLANS_v108_FIXED.zip"

          test -f "$ZIP"

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP" -d project

          echo "PROJECT EXTRACTED"

      # ==========================================
      # FIND GRADLE PROJECT
      # ==========================================
      - name: Find Gradle project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          test -n "$SETTINGS"

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "PROJECT DIR = $PROJECT_DIR"

      # ==========================================
      # FIND APP GRADLE
      # ==========================================
      - name: Find app Gradle file
        shell: bash
        run: |
          set -e

          BUILD_FILE="$PROJECT_DIR/app/build.gradle"

          if [ ! -f "$BUILD_FILE" ]; then
            BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"
          fi

          test -f "$BUILD_FILE"

          echo "BUILD_FILE=$BUILD_FILE" >> "$GITHUB_ENV"

          echo "BUILD FILE = $BUILD_FILE"

      # ==========================================
      # VERSION 1.0.9 / CODE 109
      # ==========================================
      - name: Configure version 1.0.9 code 109
        shell: bash
        run: |
          set -e

          python3 - "$BUILD_FILE" <<'PY'
          import sys
          import re
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          s = re.sub(
              r'\bversionCode\s*(?:=)?\s*\d+',
              'versionCode 109',
              s
          )

          s = re.sub(
              r'\bversionName\s*(?:=)?\s*["\'][^"\']+["\']',
              'versionName "1.0.9"',
              s
          )

          p.write_text(s)
          PY

          echo "VERSION NAME = 1.0.9"
          echo "VERSION CODE = 109"

      # ==========================================
      # MIN SDK 23
      # ==========================================
      - name: Force minimum SDK 23
        shell: bash
        run: |
          set -e

          python3 - "$BUILD_FILE" <<'PY'
          import sys
          import re
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          s = re.sub(
              r'\bminSdkVersion\s*[=:]?\s*\d+',
              'minSdkVersion 23',
              s
          )

          s = re.sub(
              r'\bminSdk\s*=\s*\d+',
              'minSdk = 23',
              s
          )

          s = re.sub(
              r'\bminSdk\s+\d+',
              'minSdk 23',
              s
          )

          p.write_text(s)
          PY

      # ==========================================
      # TARGET SDK 36
      # ==========================================
      - name: Force target SDK 36
        shell: bash
        run: |
          set -e

          python3 - "$BUILD_FILE" <<'PY'
          import sys
          import re
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          s = re.sub(
              r'\btargetSdkVersion\s*[=:]?\s*\d+',
              'targetSdkVersion 36',
              s
          )

          s = re.sub(
              r'\btargetSdk\s*=\s*\d+',
              'targetSdk = 36',
              s
          )

          s = re.sub(
              r'\btargetSdk\s+\d+',
              'targetSdk 36',
              s
          )

          p.write_text(s)
          PY

          echo "TARGET SDK = 36"

      # ==========================================
      # ADS SDK 24.8.0
      # ==========================================
      - name: Use Google Mobile Ads SDK 24.8.0
        shell: bash
        run: |
          set -e

          grep -RIl \
            "com.google.android.gms:play-services-ads:25.5.0" \
            "$PROJECT_DIR" \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            2>/dev/null \
          | while read -r FILE; do
              sed -i \
                's/com\.google\.android\.gms:play-services-ads:25\.5\.0/com.google.android.gms:play-services-ads:24.8.0/g' \
                "$FILE"
            done

          echo "ADS SDK = 24.8.0"

      # ==========================================
      # IMPORTANT:
      # USE NEW PREMIUM DESIGN MAINACTIVITY
      # ==========================================
      - name: Install Premium Design MainActivity
        shell: bash
        run: |
          set -e

          DESIGN_FILE="$GITHUB_WORKSPACE/MainActivity_Premium_Design_1.0.9.java"

          if [ ! -f "$DESIGN_FILE" ]; then
            echo "ERROR: MainActivity_Premium_Design_1.0.9.java not found."
            exit 1
          fi

          MAIN_FILE=$(find "$PROJECT_DIR/app/src/main/java" \
            -type f \
            -name "MainActivity.java" \
            -print -quit)

          if [ -z "$MAIN_FILE" ]; then
            echo "ERROR: Original MainActivity.java not found."
            exit 1
          fi

          echo "Original MainActivity:"
          echo "$MAIN_FILE"

          cp "$DESIGN_FILE" "$MAIN_FILE"

          echo ""
          echo "=========================================="
          echo "NEW PREMIUM DESIGN INSTALLED"
          echo "=========================================="

          grep -n \
            "Taxi Driver Premium\|Full Features\|No Ads\|Use Everywhere\|Lifetime\|Monthly\|Yearly" \
            "$MAIN_FILE" || true

      # ==========================================
      # FORCE RELEASE DEBUGGABLE FALSE
      # ==========================================
      - name: Force release debuggable false
        shell: bash
        run: |
          set -e

          python3 - "$BUILD_FILE" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          s = s.replace(
              "debuggable true",
              "debuggable false"
          )

          s = s.replace(
              "debuggable = true",
              "debuggable = false"
          )

          p.write_text(s)
          PY

          echo "DEBUGGABLE = FALSE"

      # ==========================================
      # VERIFY PREMIUM IDS
      # ==========================================
      - name: Check Premium 3 Plan IDs
        shell: bash
        run: |
          set -e

          MAIN_FILE=$(find "$PROJECT_DIR/app/src/main/java" \
            -type f \
            -name "MainActivity.java" \
            -print -quit)

          echo "Checking Premium IDs..."

          grep -n "taxi_driver_premium" "$MAIN_FILE"

          echo ""
          echo "Lifetime = taxi_driver_premium"
          echo "Monthly  = taxi_driver_premium_monthly"
          echo "Yearly   = taxi_driver_premium_yearly"

      # ==========================================
      # SIGNING KEY
      # ==========================================
      - name: Decode existing signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          test -n "$KEYSTORE_BASE64"

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$GITHUB_WORKSPACE/upload-keystore.jks"

          test -s "$GITHUB_WORKSPACE/upload-keystore.jks"

          echo "SIGNING KEY LOADED"

      - name: Verify signing key
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e

          keytool -list \
            -keystore "$GITHUB_WORKSPACE/upload-keystore.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

          echo "SIGNING KEY VERIFIED"

      # ==========================================
      # BUILD
      # ==========================================
      - name: Build release APK and AAB
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle clean \
            --no-daemon \
            --stacktrace \
            --console=plain

          gradle \
            :app:assembleRelease \
            :app:bundleRelease \
            --no-daemon \
            --stacktrace \
            --console=plain

      # ==========================================
      # FIND FILES
      # ==========================================
      - name: Find APK and AAB
        shell: bash
        run: |
          set -e

          APK_FILE=$(find "$PROJECT_DIR/app/build" \
            -type f \
            -name "*.apk" \
            | head -1)

          AAB_FILE=$(find "$PROJECT_DIR/app/build" \
            -type f \
            -name "*.aab" \
            | head -1)

          test -n "$APK_FILE"
          test -n "$AAB_FILE"

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"
          echo "AAB_FILE=$AAB_FILE" >> "$GITHUB_ENV"

          ls -lh "$APK_FILE"
          ls -lh "$AAB_FILE"

      # ==========================================
      # SIGN AAB
      # ==========================================
      - name: Sign AAB
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          jarsigner \
            -keystore "$GITHUB_WORKSPACE/upload-keystore.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -signedjar "${AAB_FILE}.signed" \
            "$AAB_FILE" \
            "$KEY_ALIAS"

          mv "${AAB_FILE}.signed" "$AAB_FILE"

          echo "AAB SIGNED"

      # ==========================================
      # SIGN APK
      # ==========================================
      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"

          "$APKSIGNER" sign \
            --ks "$GITHUB_WORKSPACE/upload-keystore.jks" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "${APK_FILE}.signed.apk" \
            "$APK_FILE"

          mv "${APK_FILE}.signed.apk" "$APK_FILE"

          echo "APK SIGNED"

      # ==========================================
      # VERIFY SIGNATURES
      # ==========================================
      - name: Verify AAB signature
        shell: bash
        run: |
          set -e

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$AAB_FILE"

          echo "AAB SIGNATURE VERIFIED"

      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" \
            verify \
            --verbose \
            "$APK_FILE"

          echo "APK SIGNATURE VERIFIED"

      # ==========================================
      # FINAL INFO
      # ==========================================
      - name: Show final Play Store build
        shell: bash
        run: |
          echo "=============================================="
          echo "       TAXI DRIVER PLAY STORE BUILD"
          echo "=============================================="
          echo ""
          echo "VERSION NAME : 1.0.9"
          echo "VERSION CODE : 109"
          echo "MIN SDK      : 23"
          echo "TARGET SDK   : 36"
          echo "DEBUGGABLE   : FALSE"
          echo "ADS SDK      : 24.8.0"
          echo "AAB SIGNED   : YES"
          echo "APK SIGNED   : YES"
          echo ""
          echo "PREMIUM DESIGN: INSTALLED"
          echo ""
          echo "Lifetime : AED 19.99"
          echo "Monthly  : AED 2.09"
          echo "Yearly   : AED 9.99"
          echo ""
          echo "One-time payment : HIDDEN"
          echo "Auto-renewing    : HIDDEN"
          echo ""
          echo "=============================================="

      # ==========================================
      # FINAL FILE NAMES
      # ==========================================
      - name: Prepare final Play Store files
        shell: bash
        run: |
          set -e

          cp "$AAB_FILE" \
            Taxi-Driver-1.0.9-Signed-109-API23.aab

          cp "$APK_FILE" \
            Taxi-Driver-1.0.9-Signed-109-API23.apk

          ls -lh \
            Taxi-Driver-1.0.9-Signed-109-API23.aab \
            Taxi-Driver-1.0.9-Signed-109-API23.apk

      # ==========================================
      # ARTIFACT
      # ==========================================
      - name: Upload signed Play Store files
        uses: actions/upload-artifact@v4
        with:
          name: Taxi-Driver-1.0.9-Signed-109-API23-Premium-Design
          path: |
            Taxi-Driver-1.0.9-Signed-109-API23.aab
            Taxi-Driver-1.0.9-Signed-109-API23.apk
