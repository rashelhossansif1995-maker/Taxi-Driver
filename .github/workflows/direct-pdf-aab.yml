name: Build Taxi Driver 1.0.9 Premium - Signed AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36
        run: |
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Extract Final Premium Project
        run: |
          set -e

          ZIP="Taxi_Driver_1.0.9_PREMIUM_FINAL_DESIGN_PROJECT.zip"

          test -f "$ZIP"

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP" -d project

          echo "PROJECT EXTRACTED"

      - name: Find Android Project
        run: |
          set -e

          SETTINGS=$(find project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          test -n "$SETTINGS"

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Verify Final Premium Project
        run: |
          set -e

          test -f "$PROJECT_DIR/app/src/main/java/com/taxidriver/apk/MainActivity.java"
          test -f "$PROJECT_DIR/app/src/main/assets/index.html"
          test -f "$PROJECT_DIR/app/src/main/res/drawable-nodpi/taxi_driver_premium_logo.png"

          echo "Premium project verified."
          echo "MainActivity: OK"
          echo "Premium HTML: OK"
          echo "Premium logo: OK"

      - name: Configure Play Store Version
        run: |
          set -e

          python3 - "$PROJECT_DIR/app/build.gradle" <<'PY'
          import sys
          import re
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          s = re.sub(
              r'versionCode\s+\d+',
              'versionCode 109',
              s
          )

          s = re.sub(
              r'versionName\s+["\'][^"\']+["\']',
              'versionName "1.0.9"',
              s
          )

          s = re.sub(
              r'compileSdk\s+\d+',
              'compileSdk 36',
              s
          )

          s = re.sub(
              r'minSdk\s+\d+',
              'minSdk 23',
              s
          )

          s = re.sub(
              r'targetSdk\s+\d+',
              'targetSdk 36',
              s
          )

          p.write_text(s)
          PY

          echo "VERSION = 1.0.9"
          echo "VERSION CODE = 109"
          echo "TARGET SDK = 36"

      - name: Build Signed Release AAB
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          gradle clean bundleRelease \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Prepare Signing Key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          test -n "$KEYSTORE_BASE64"

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > taxi-release.keystore

          test -s taxi-release.keystore

          echo "KEYSTORE READY"

      - name: Sign AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          jarsigner \
            -keystore taxi-release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            "${PROJECT_DIR}/app/build/outputs/bundle/release/app-release.aab" \
            "$KEY_ALIAS"

          echo "AAB SIGNED"

      - name: Verify AAB
        run: |
          set -e

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "${PROJECT_DIR}/app/build/outputs/bundle/release/app-release.aab"

          echo "AAB SIGNATURE VERIFIED"

      - name: Prepare Final AAB
        run: |
          set -e

          mkdir -p output

          cp \
            "${PROJECT_DIR}/app/build/outputs/bundle/release/app-release.aab" \
            "output/Taxi-Driver-1.0.9-Premium-109-Signed.aab"

          ls -lh output/

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: Taxi-Driver-1.0.9-Premium-109-Signed
          path: output/Taxi-Driver-1.0.9-Premium-109-Signed.aab
