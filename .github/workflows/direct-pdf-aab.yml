name: Build Taxi Driver 1.0.6 Signed AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 SDK
        run: |
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Find Taxi Driver project
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$(find . -type f -name 'settings.gradle' -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Set Version Code 106
        shell: bash
        run: |
          set -e

          BUILD_FILE="$PROJECT_DIR/app/build.gradle"

          if [ ! -f "$BUILD_FILE" ]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          sed -i -E \
            's/versionCode[[:space:]]+[0-9]+/versionCode 106/' \
            "$BUILD_FILE"

          echo "Version configuration:"
          grep -n "versionCode\|versionName\|targetSdk\|compileSdk" "$BUILD_FILE" || true

      - name: Verify Target SDK 36
        shell: bash
        run: |
          set -e

          if ! grep -Eq \
            'targetSdk[[:space:]]*[=:]?[[:space:]]*36|targetSdkVersion[[:space:]]*[=:]?[[:space:]]*36' \
            "$PROJECT_DIR/app/build.gradle"; then
            echo "ERROR: Target SDK 36 not found."
            exit 1
          fi

          echo "Target SDK 36 verified."

      - name: Verify Package ID
        shell: bash
        run: |
          set -e

          if ! grep -R -q "com.taxidriver.apk" "$PROJECT_DIR/app/src/main"; then
            echo "ERROR: Package ID com.taxidriver.apk not found."
            exit 1
          fi

          echo "Package ID verified: com.taxidriver.apk"

      - name: Decode existing signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/upload-keystore.jks"

          if [ ! -s "$GITHUB_WORKSPACE/upload-keystore.jks" ]; then
            echo "ERROR: Keystore could not be decoded."
            exit 1
          fi

          echo "Existing signing keystore loaded."

      - name: Verify existing signing key
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e

          keytool -list \
            -keystore "$GITHUB_WORKSPACE/upload-keystore.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

          echo "Existing signing key verified."

      - name: Build Release APK and AAB
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle clean --no-daemon --stacktrace

          gradle \
            :app:assembleRelease \
            :app:bundleRelease \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Find APK and AAB
        shell: bash
        run: |
          set -e

          APK_FILE="$(find "$PROJECT_DIR/app/build" -type f -name '*.apk' | head -n 1)"
          AAB_FILE="$(find "$PROJECT_DIR/app/build" -type f -name '*.aab' | head -n 1)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          if [ -z "$AAB_FILE" ]; then
            echo "ERROR: AAB not found."
            exit 1
          fi

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"
          echo "AAB_FILE=$AAB_FILE" >> "$GITHUB_ENV"

          ls -lh "$APK_FILE"
          ls -lh "$AAB_FILE"

      - name: Sign AAB with existing key
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          KEYSTORE="$GITHUB_WORKSPACE/upload-keystore.jks"

          jarsigner \
            -keystore "$KEYSTORE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -signedjar "${AAB_FILE}.signed" \
            "$AAB_FILE" \
            "$KEY_ALIAS"

          mv "${AAB_FILE}.signed" "$AAB_FILE"

          echo "AAB signing completed."

      - name: Sign APK with existing key
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          KEYSTORE="$GITHUB_WORKSPACE/upload-keystore.jks"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "${APK_FILE}.signed.apk" \
            "$APK_FILE"

          mv "${APK_FILE}.signed.apk" "$APK_FILE"

          echo "APK signing completed."

      - name: Verify AAB signature
        shell: bash
        run: |
          set -e

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$AAB_FILE"

          if ! unzip -l "$AAB_FILE" | grep -Eq \
            'META-INF/[^/]+\.(RSA|DSA|EC)( |$)'; then
            echo "ERROR: AAB has no signature block."
            exit 1
          fi

          echo "AAB SIGNATURE VERIFIED."

      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" \
            verify \
            --verbose \
            "$APK_FILE"

          echo "APK SIGNATURE VERIFIED."

      - name: Prepare Play Store files
        shell: bash
        run: |
          set -e

          cp "$AAB_FILE" Taxi-Driver-1.0.6-Direct-PDF.aab
          cp "$APK_FILE" Taxi-Driver-1.0.6-Direct-PDF.apk

          echo "=========================================="
          echo "PLAY STORE BUILD READY"
          echo "VERSION CODE: 106"
          echo "TARGET SDK: 36"
          echo "PACKAGE: com.taxidriver.apk"
          echo "SIGNED: YES"
          echo "=========================================="

          ls -lh Taxi-Driver-1.0.6-Direct-PDF.aab
          ls -lh Taxi-Driver-1.0.6-Direct-PDF.apk

      - name: Upload signed AAB and APK
        uses: actions/upload-artifact@v4
        with:
          name: Taxi-Driver-1.0.6-Signed
          path: |
            Taxi-Driver-1.0.6-Direct-PDF.aab
            Taxi-Driver-1.0.6-Direct-PDF.apk
