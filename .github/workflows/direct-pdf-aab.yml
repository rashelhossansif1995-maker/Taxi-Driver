name: Build Taxi Driver 1.0.6 Premium - Signed AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. JAVA 17
      # ==========================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # 3. ANDROID SDK 36
      # ==========================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36
        run: |
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # ==========================================
      # 4. GRADLE 8.10.2
      # ==========================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # ==========================================
      # 5. EXTRACT NEW PREMIUM ZIP
      # ==========================================
      - name: Extract Premium 3 Plans project
        shell: bash
        run: |
          set -e

          ZIP="Taxi_Driver_PlayStore_Update_1.0.6_PREMIUM_3PLANS_v107_Source.zip"

          echo "Looking for:"
          echo "$ZIP"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP file not found."
            echo "Files in repository:"
            ls -lah
            exit 1
          fi

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP" -d project

          echo "PROJECT EXTRACTED"

          find project -maxdepth 4 -type f | head -150

      # ==========================================
      # 6. FIND GRADLE PROJECT
      # ==========================================
      - name: Find Gradle project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found."
            find project -type f | head -250
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "PROJECT DIR:"
          echo "$PROJECT_DIR"

      # ==========================================
      # 7. FIND APP GRADLE
      # ==========================================
      - name: Find app Gradle file
        shell: bash
        run: |
          set -e

          BUILD_FILE="$PROJECT_DIR/app/build.gradle"

          if [ ! -f "$BUILD_FILE" ]; then
            BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"
          fi

          if [ ! -f "$BUILD_FILE" ]; then
            echo "ERROR: app Gradle file not found."
            find "$PROJECT_DIR" -maxdepth 4 -type f
            exit 1
          fi

          echo "BUILD_FILE=$BUILD_FILE" >> "$GITHUB_ENV"

          echo "BUILD FILE:"
          echo "$BUILD_FILE"

      # ==========================================
      # 8. VERSION 1.0.6 / CODE 107
      # ==========================================
      - name: Configure version 1.0.6 code 107
        shell: bash
        run: |
          set -e

          python3 - "$BUILD_FILE" <<'PY'
          import sys
          import re
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          s = re.sub(
              r'\bversionCode\s*(?:=)?\s*\d+',
              'versionCode 107',
              s
          )

          s = re.sub(
              r'\bversionName\s*(?:=)?\s*["\'][^"\']+["\']',
              'versionName "1.0.6"',
              s
          )

          p.write_text(s)
          PY

          echo "======================================"
          echo "VERSION"
          echo "======================================"

          grep -n \
            "versionCode\|versionName" \
            "$BUILD_FILE" || true

      # ==========================================
      # 9. MIN SDK 23
      # ==========================================
      - name: Force minimum SDK 23
        shell: bash
        run: |
          set -e

          python3 - "$BUILD_FILE" <<'PY'
          import sys
          import re
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          s = re.sub(
              r'\bminSdkVersion\s*[=:]?\s*\d+',
              'minSdkVersion 23',
              s
          )

          s = re.sub(
              r'\bminSdk\s*=\s*\d+',
              'minSdk = 23',
              s
          )

          s = re.sub(
              r'\bminSdk\s+\d+',
              'minSdk 23',
              s
          )

          p.write_text(s)
          PY

          echo "MIN SDK = 23"

          grep -n \
            "minSdk\|minSdkVersion" \
            "$BUILD_FILE" || true

      # ==========================================
      # 10. TARGET SDK 36
      # ==========================================
      - name: Force target SDK 36
        shell: bash
        run: |
          set -e

          python3 - "$BUILD_FILE" <<'PY'
          import sys
          import re
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          s = re.sub(
              r'\btargetSdkVersion\s*[=:]?\s*\d+',
              'targetSdkVersion 36',
              s
          )

          s = re.sub(
              r'\btargetSdk\s*=\s*\d+',
              'targetSdk = 36',
              s
          )

          s = re.sub(
              r'\btargetSdk\s+\d+',
              'targetSdk 36',
              s
          )

          p.write_text(s)
          PY

          echo "TARGET SDK = 36"

          grep -n \
            "targetSdk\|targetSdkVersion" \
            "$BUILD_FILE" || true

      # ==========================================
      # 11. GOOGLE MOBILE ADS 24.8.0
      # ==========================================
      - name: Use Google Mobile Ads SDK 24.8.0
        shell: bash
        run: |
          set -e

          echo "Searching for Google Mobile Ads SDK..."

          while IFS= read -r FILE; do

            echo "Updating:"
            echo "$FILE"

            sed -i \
              's/com\.google\.android\.gms:play-services-ads:25\.5\.0/com.google.android.gms:play-services-ads:24.8.0/g' \
              "$FILE"

            sed -i \
              's/play-services-ads[[:space:]]*=[[:space:]]*["'\'']25\.5\.0["'\'']/play-services-ads = "24.8.0"/g' \
              "$FILE"

            sed -i \
              's/play-services-ads-version[[:space:]]*=[[:space:]]*["'\'']25\.5\.0["'\'']/play-services-ads-version = "24.8.0"/g' \
              "$FILE"

          done < <(
            grep -RIl \
              "25\.5\.0" \
              "$PROJECT_DIR" \
              --include="*.gradle" \
              --include="*.gradle.kts" \
              --include="*.toml" \
              || true
          )

          echo "Checking for Ads SDK 25.5.0..."

          if grep -RIn \
            "play-services-ads.*25\.5\.0\|25\.5\.0.*play-services-ads" \
            "$PROJECT_DIR" \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            --include="*.toml"; then

            echo "ERROR: Ads SDK 25.5.0 still exists."
            exit 1
          fi

          echo "Google Mobile Ads SDK = 24.8.0"

      # ==========================================
      # 12. RELEASE DEBUGGABLE FALSE
      # ==========================================
      - name: Force release debuggable false
        shell: bash
        run: |
          set -e

          python3 - "$BUILD_FILE" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          s = s.replace(
              "debuggable true",
              "debuggable false"
          )

          s = s.replace(
              "debuggable = true",
              "debuggable = false"
          )

          p.write_text(s)
          PY

          echo "RELEASE DEBUGGABLE = FALSE"

      # ==========================================
      # 13. OPTIONAL HARDWARE FEATURES
      # ==========================================
      - name: Add optional hardware features
        shell: bash
        run: |
          set -e

          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          python3 - "$MANIFEST" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          features = [
              '    <uses-feature android:name="android.hardware.camera" android:required="false" />',
              '    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />',
              '    <uses-feature android:name="android.hardware.camera.any" android:required="false" />',
              '    <uses-feature android:name="android.hardware.location.gps" android:required="false" />',
              '    <uses-feature android:name="android.hardware.location.network" android:required="false" />',
              '    <uses-feature android:name="android.hardware.bluetooth" android:required="false" />',
              '    <uses-feature android:name="android.hardware.bluetooth_le" android:required="false" />',
              '    <uses-feature android:name="android.hardware.microphone" android:required="false" />',
              '    <uses-feature android:name="android.hardware.wifi" android:required="false" />'
          ]

          missing = []

          for line in features:
              name = line.split('android:name="')[1].split('"')[0]

              if f'android:name="{name}"' not in s:
                  missing.append(line)

          if missing:
              addition = "\n" + "\n".join(missing) + "\n"

              s = s.replace(
                  "<application",
                  addition + "\n    <application",
                  1
              )

          p.write_text(s)
          PY

          echo "OPTIONAL FEATURES CONFIGURED"

      # ==========================================
      # 14. VERIFY PREMIUM PRODUCT IDS
      # ==========================================
      - name: Check Premium 3 Plan IDs
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "PREMIUM PRODUCT IDS"
          echo "=============================================="

          grep -RIn \
            "taxi_driver_premium" \
            "$PROJECT_DIR" \
            --exclude-dir=build \
            || true

          echo ""
          echo "Expected:"
          echo "Lifetime = taxi_driver_premium"
          echo "Monthly  = taxi_driver_premium_monthly"
          echo "Yearly   = taxi_driver_premium_yearly"

      # ==========================================
      # 15. VERIFY FINAL CONFIG
      # ==========================================
      - name: Verify final Android configuration
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "FINAL CONFIGURATION"
          echo "=============================================="

          echo ""
          echo "VERSION:"
          grep -n \
            "versionCode\|versionName" \
            "$BUILD_FILE" || true

          echo ""
          echo "MIN SDK:"
          grep -n \
            "minSdk\|minSdkVersion" \
            "$BUILD_FILE" || true

          echo ""
          echo "TARGET SDK:"
          grep -n \
            "targetSdk\|targetSdkVersion" \
            "$BUILD_FILE" || true

          echo ""
          echo "ADS SDK:"
          grep -RIn \
            "play-services-ads" \
            "$PROJECT_DIR" \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            --include="*.toml" \
            || true

      # ==========================================
      # 16. LOAD EXISTING SIGNING KEY
      # ==========================================
      - name: Decode existing signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$GITHUB_WORKSPACE/upload-keystore.jks"

          test -s "$GITHUB_WORKSPACE/upload-keystore.jks"

          echo "SIGNING KEY LOADED"

      # ==========================================
      # 17. VERIFY SIGNING KEY
      # ==========================================
      - name: Verify signing key
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e

          keytool -list \
            -keystore "$GITHUB_WORKSPACE/upload-keystore.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

          echo "SIGNING KEY VERIFIED"

      # ==========================================
      # 18. BUILD RELEASE APK + AAB
      # ==========================================
      - name: Build release APK and AAB
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "GRADLE CLEAN"
          echo "======================================"

          gradle clean \
            --no-daemon \
            --stacktrace \
            --console=plain

          echo "======================================"
          echo "BUILDING RELEASE"
          echo "======================================"

          gradle \
            :app:assembleRelease \
            :app:bundleRelease \
            --no-daemon \
            --stacktrace \
            --console=plain

      # ==========================================
      # 19. FIND APK + AAB
      # ==========================================
      - name: Find APK and AAB
        shell: bash
        run: |
          set -e

          APK_FILE=$(find "$PROJECT_DIR/app/build" \
            -type f \
            -name "*.apk" \
            | head -1)

          AAB_FILE=$(find "$PROJECT_DIR/app/build" \
            -type f \
            -name "*.aab" \
            | head -1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          if [ -z "$AAB_FILE" ]; then
            echo "ERROR: AAB not found."
            exit 1
          fi

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"
          echo "AAB_FILE=$AAB_FILE" >> "$GITHUB_ENV"

          echo "APK:"
          ls -lh "$APK_FILE"

          echo "AAB:"
          ls -lh "$AAB_FILE"

      # ==========================================
      # 20. SIGN AAB
      # ==========================================
      - name: Sign AAB
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          jarsigner \
            -keystore "$GITHUB_WORKSPACE/upload-keystore.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -signedjar "${AAB_FILE}.signed" \
            "$AAB_FILE" \
            "$KEY_ALIAS"

          mv "${AAB_FILE}.signed" "$AAB_FILE"

          echo "AAB SIGNED"

      # ==========================================
      # 21. SIGN APK
      # ==========================================
      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"

          "$APKSIGNER" sign \
            --ks "$GITHUB_WORKSPACE/upload-keystore.jks" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "${APK_FILE}.signed.apk" \
            "$APK_FILE"

          mv "${APK_FILE}.signed.apk" "$APK_FILE"

          echo "APK SIGNED"

      # ==========================================
      # 22. VERIFY AAB SIGNATURE
      # ==========================================
      - name: Verify AAB signature
        shell: bash
        run: |
          set -e

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$AAB_FILE"

          if ! unzip -l "$AAB_FILE" | \
            grep -Eq 'META-INF/[^/]+\.(RSA|DSA|EC)( |$)'; then
            echo "ERROR: AAB signature block not found."
            exit 1
          fi

          echo "AAB SIGNATURE VERIFIED"

      # ==========================================
      # 23. VERIFY APK SIGNATURE
      # ==========================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" \
            verify \
            --verbose \
            "$APK_FILE"

          echo "APK SIGNATURE VERIFIED"

      # ==========================================
      # 24. SHOW FINAL BUILD INFO
      # ==========================================
      - name: Show final Play Store build
        shell: bash
        run: |
          echo ""
          echo "================================================"
          echo "       TAXI DRIVER PLAY STORE BUILD"
          echo "================================================"
          echo ""
          echo "VERSION NAME : 1.0.6"
          echo "VERSION CODE : 107"
          echo "MIN SDK      : 23"
          echo "TARGET SDK   : 36"
          echo "DEBUGGABLE   : FALSE"
          echo "ADS SDK      : 24.8.0"
          echo "AAB SIGNED   : YES"
          echo "APK SIGNED   : YES"
          echo ""
          echo "PREMIUM:"
          echo "Lifetime : taxi_driver_premium"
          echo "Monthly  : taxi_driver_premium_monthly"
          echo "Yearly   : taxi_driver_premium_yearly"
          echo ""
          echo "================================================"

          ls -lh "$AAB_FILE"
          ls -lh "$APK_FILE"

      # ==========================================
      # 25. PREPARE FINAL FILES
      # ==========================================
      - name: Prepare final Play Store files
        shell: bash
        run: |
          set -e

          cp "$AAB_FILE" \
            Taxi-Driver-1.0.6-Signed-107-API23.aab

          cp "$APK_FILE" \
            Taxi-Driver-1.0.6-Signed-107-API23.apk

          echo "FINAL FILES:"

          ls -lh \
            Taxi-Driver-1.0.6-Signed-107-API23.aab \
            Taxi-Driver-1.0.6-Signed-107-API23.apk

      # ==========================================
      # 26. UPLOAD ARTIFACT
      # ==========================================
      - name: Upload signed Play Store files
        uses: actions/upload-artifact@v4
        with:
          name: Taxi-Driver-1.0.6-Signed-107-API23
          path: |
            Taxi-Driver-1.0.6-Signed-107-API23.aab
            Taxi-Driver-1.0.6-Signed-107-API23.apk
