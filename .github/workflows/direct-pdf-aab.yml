name: Taxi Driver 1.1.0 FINAL - AAB APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Final Taxi Driver 1.1.0
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. FIND FINAL ZIP
      # ============================================================
      - name: Find FINAL ZIP
        shell: bash
        run: |
          set -e

          ZIP="Taxi_Driver_1.1.0_FINAL_OVERPAYMENT_BACKUP_RESTORE_FIXED_GITHUB.zip"

          echo "Searching for FINAL ZIP..."
          echo "$ZIP"

          if [ ! -f "$ZIP" ]; then
            echo ""
            echo "ERROR: FINAL ZIP NOT FOUND"
            echo ""
            echo "Repository files:"
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

          echo ""
          echo "FINAL ZIP FOUND:"
          ls -lh "$ZIP"

      # ============================================================
      # 3. EXTRACT FINAL ZIP
      # ============================================================
      - name: Extract FINAL ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted_final taxi_work

          mkdir -p extracted_final

          unzip -q \
            "Taxi_Driver_1.1.0_FINAL_OVERPAYMENT_BACKUP_RESTORE_FIXED_GITHUB.zip" \
            -d extracted_final

          if [ -d "extracted_final/taxi_work" ]; then
            cp -R "extracted_final/taxi_work" "taxi_work"
          else
            FOUND_DIR=$(find extracted_final -type d -name "taxi_work" -print -quit)

            if [ -z "$FOUND_DIR" ]; then
              echo "ERROR: taxi_work folder was not found."
              echo ""
              echo "Extracted files:"
              find extracted_final -maxdepth 4 -type f | sort
              exit 1
            fi

            cp -R "$FOUND_DIR" "taxi_work"
          fi

          echo ""
          echo "FINAL PROJECT FOUND:"
          find taxi_work -maxdepth 3 -type f | sort | head -200

      # ============================================================
      # 4. VERIFY FINAL HTML
      # ============================================================
      - name: Verify FINAL HTML
        shell: bash
        run: |
          set -e

          HTML="taxi_work/app/src/main/assets/index.html"

          if [ ! -f "$HTML" ]; then
            echo "ERROR: index.html NOT FOUND"
            exit 1
          fi

          echo "Checking OVERPAYMENT..."

          grep -Fqi "overpayment" "$HTML" || {
            echo "ERROR: OVERPAYMENT NOT FOUND"
            exit 1
          }

          echo "OVERPAYMENT: OK"

          echo ""
          echo "Checking Financial Loan..."

          if grep -Fqi "Financial Loan" "$HTML"; then
            echo "ERROR: Financial Loan still exists."
            grep -Fin "Financial Loan" "$HTML" | head -30
            exit 1
          fi

          echo "Financial Loan: REMOVED"

          echo ""
          echo "Checking Export Backup..."

          grep -Fq "backupData" "$HTML" || {
            echo "ERROR: backupData NOT FOUND"
            exit 1
          }

          echo "Export Backup: OK"

          echo ""
          echo "Checking Restore Backup..."

          grep -Fq "restoreData" "$HTML" || {
            echo "ERROR: restoreData NOT FOUND"
            exit 1
          }

          echo "Restore Backup: OK"

          echo ""
          echo "HTML verification PASSED."

      # ============================================================
      # 5. SETUP JDK 17
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 6. SETUP ANDROID SDK
      # IMPORTANT:
      # Do NOT install old "tools" package.
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      # ============================================================
      # 7. VERIFY ANDROID SDK
      # ============================================================
      - name: Verify Android SDK 36
        shell: bash
        run: |
          set -e

          echo "Checking Android Platform 36..."
          test -d "$ANDROID_HOME/platforms/android-36"

          echo "Android Platform 36: OK"

          echo ""
          echo "Checking Build Tools 36.0.0..."
          test -d "$ANDROID_HOME/build-tools/36.0.0"

          echo "Build Tools 36.0.0: OK"

          echo ""
          echo "Checking ADB..."
          "$ANDROID_HOME/platform-tools/adb" version

          echo ""
          echo "Android SDK verification PASSED."

      # ============================================================
      # 8. SETUP GRADLE
      # ============================================================
      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # ============================================================
      # 9. CHECK ANDROID PROJECT
      # ============================================================
      - name: Check Android project
        working-directory: taxi_work
        shell: bash
        run: |
          set -e

          echo "Project files:"
          ls -la

          echo ""
          echo "Gradle files:"
          find . -maxdepth 3 \
            \( -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            -print

      # ============================================================
      # 10. VERIFY VERSION / SDK
      # ============================================================
      - name: Verify Version 1.1.0 Code 110 SDK 36
        shell: bash
        run: |
          set -e

          BUILD="taxi_work/app/build.gradle"

          if [ ! -f "$BUILD" ]; then
            echo "ERROR: app/build.gradle NOT FOUND"
            exit 1
          fi

          echo "Checking version information..."

          grep -nE \
            "versionCode|versionName|compileSdk|targetSdk" \
            "$BUILD" || true

          echo ""
          echo "Checking versionCode 110..."

          grep -Eq "versionCode[[:space:]]+110" "$BUILD" || {
            echo "ERROR: versionCode 110 not found."
            exit 1
          }

          echo "versionCode 110: OK"

          echo ""
          echo "Checking versionName 1.1.0..."

          grep -Eq \
            "versionName[[:space:]]+['\"]1\.1\.0['\"]" \
            "$BUILD" || {
              echo "ERROR: versionName 1.1.0 not found."
              exit 1
            }

          echo "versionName 1.1.0: OK"

          echo ""
          echo "Checking targetSdk 36..."

          grep -Eq "targetSdk[[:space:]]+36" "$BUILD" || {
            echo "ERROR: targetSdk 36 not found."
            exit 1
          }

          echo "targetSdk 36: OK"

          echo ""
          echo "Checking compileSdk 36..."

          grep -Eq "compileSdk[[:space:]]+36" "$BUILD" || {
            echo "ERROR: compileSdk 36 not found."
            exit 1
          }

          echo "compileSdk 36: OK"

      # ============================================================
      # 11. CHECK SIGNING SECRETS
      # ============================================================
      - name: Check signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          test -n "$KEYSTORE_BASE64" || {
            echo "ERROR: KEYSTORE_BASE64 missing."
            exit 1
          }

          test -n "$KEYSTORE_PASSWORD" || {
            echo "ERROR: KEYSTORE_PASSWORD missing."
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "ERROR: KEY_ALIAS missing."
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "ERROR: KEY_PASSWORD missing."
            exit 1
          }

          echo "Signing secrets: OK"

      # ============================================================
      # 12. PREPARE KEYSTORE
      # ============================================================
      - name: Prepare signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          echo "$KEYSTORE_BASE64" | base64 --decode > taxi-release.keystore

          test -s taxi-release.keystore || {
            echo "ERROR: Keystore creation failed."
            exit 1
          }

          echo "Keystore: OK"

      # ============================================================
      # 13. BUILD AAB + APK
      # ============================================================
      - name: Build Release AAB and APK
        working-directory: taxi_work
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING TAXI DRIVER 1.1.0"
          echo "=========================================="

          gradle clean bundleRelease assembleRelease --no-daemon

          echo ""
          echo "BUILD COMPLETED"

          echo ""
          echo "Generated outputs:"
          find app/build/outputs -type f | sort

      # ============================================================
      # 14. CHECK AAB
      # ============================================================
      - name: Check AAB
        shell: bash
        run: |
          set -e

          AAB="taxi_work/app/build/outputs/bundle/release/app-release.aab"

          test -f "$AAB" || {
            echo "ERROR: AAB was not created."
            exit 1
          }

          echo "AAB created successfully:"
          ls -lh "$AAB"

      # ============================================================
      # 15. SIGN AAB
      # ============================================================
      - name: Sign AAB
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          AAB="taxi_work/app/build/outputs/bundle/release/app-release.aab"

          jarsigner \
            -keystore taxi-release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            "$AAB" \
            "$KEY_ALIAS"

          echo "AAB signed successfully."

      # ============================================================
      # 16. VERIFY AAB
      # ============================================================
      - name: Verify AAB Signature
        shell: bash
        run: |
          set -e

          jarsigner \
            -verify \
            -verbose \
            -certs \
            taxi_work/app/build/outputs/bundle/release/app-release.aab

          echo "AAB signature VERIFIED."

      # ============================================================
      # 17. ALIGN APK
      # ============================================================
      - name: Align APK
        shell: bash
        run: |
          set -e

          APK="taxi_work/app/build/outputs/apk/release/app-release-unsigned.apk"

          test -f "$APK" || {
            echo "ERROR: Unsigned APK not found."
            exit 1
          }

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
            -f \
            -p \
            4 \
            "$APK" \
            taxi-unsigned-aligned.apk

          echo "APK aligned."

      # ============================================================
      # 18. SIGN APK
      # ============================================================
      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            sign \
            --ks taxi-release.keystore \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass pass:"$KEY_PASSWORD" \
            --out taxi-signed.apk \
            taxi-unsigned-aligned.apk

          echo "APK signed successfully."

      # ============================================================
      # 19. VERIFY APK
      # ============================================================
      - name: Verify APK Signature
        shell: bash
        run: |
          set -e

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            verify \
            --verbose \
            taxi-signed.apk

          echo "APK signature VERIFIED."

      # ============================================================
      # 20. CREATE FINAL FILES
      # ============================================================
      - name: Create final release files
        shell: bash
        run: |
          set -e

          rm -rf output
          mkdir -p output

          cp \
            taxi_work/app/build/outputs/bundle/release/app-release.aab \
            "output/Taxi-Driver-1.1.0-Premium-110-Currency-Signed.aab"

          cp \
            taxi-signed.apk \
            "output/Taxi-Driver-1.1.0-Premium-110-Currency-Signed.apk"

          echo ""
          echo "=========================================="
          echo "FINAL AAB + APK"
          echo "=========================================="

          ls -lh output/

      # ============================================================
      # 21. UPLOAD ARTIFACTS
      # ============================================================
      - name: Upload AAB and APK
        uses: actions/upload-artifact@v4
        with:
          name: Taxi-Driver-1.1.0-FINAL-Overpayment-Backup-Restore
          path: output/
          if-no-files-found: error
