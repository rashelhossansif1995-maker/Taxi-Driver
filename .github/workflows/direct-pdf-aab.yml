name: Taxi Driver 1.1.1 FINAL

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:

    name: Build Taxi Driver 1.1.1 FINAL
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. CHECKOUT
      # ==================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==================================================
      # 2. JAVA 17
      # ==================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==================================================
      # 3. GRADLE
      # ==================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"


      # ==================================================
      # 4. ANDROID SDK - MANUAL SETUP
      # ==================================================
      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID SDK SETUP"
          echo "=========================================="

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER=""

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          echo ""
          echo "Accepting licenses..."

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo ""
          echo "Updating SDK package information..."

          "$SDKMANAGER" --update || true

          echo ""
          echo "Installing Android SDK packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo ""
          echo "Android SDK installation completed."


      # ==================================================
      # 5. VERIFY ANDROID SDK
      # ==================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID SDK VERIFICATION"
          echo "=========================================="

          if [ -d "$ANDROID_HOME/platform-tools" ]; then
            echo "platform-tools: OK"
          else
            echo "ERROR: platform-tools not installed."
            exit 1
          fi

          if [ -d "$ANDROID_HOME/platforms/android-36" ]; then
            echo "Android 36: OK"
          else
            echo "ERROR: Android 36 not installed."
            exit 1
          fi

          if [ -d "$ANDROID_HOME/build-tools/36.0.0" ]; then
            echo "Build Tools 36.0.0: OK"
          else
            echo "ERROR: Build Tools 36.0.0 not installed."
            exit 1
          fi

          echo ""
          echo "ANDROID SDK READY."


      # ==================================================
      # 6. FIND ONLY FINAL CUMULATIVE ZIP
      # ==================================================
      - name: Find ONLY FINAL CUMULATIVE ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="./Taxi-Driver-1.1.1-FINAL-CUMULATIVE-SOURCE.zip"

          echo "=========================================="
          echo "SEARCHING FINAL CUMULATIVE SOURCE"
          echo "=========================================="

          if [ ! -f "$ZIP_FILE" ]; then

            echo "ERROR: Required source ZIP not found."
            echo ""
            echo "Required file:"
            echo "$ZIP_FILE"
            echo ""
            echo "Available ZIP files:"
            find . -type f -name "*.zip" -print | sort

            exit 1
          fi

          echo ""
          echo "FINAL CUMULATIVE SOURCE FOUND:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ==================================================
      # 7. EXTRACT SOURCE
      # ==================================================
      - name: Extract FINAL CUMULATIVE SOURCE
        shell: bash
        run: |
          set -e

          rm -rf taxi_source
          mkdir -p taxi_source

          unzip -q "$ZIP_FILE" -d taxi_source

          echo "=========================================="
          echo "SOURCE EXTRACTED"
          echo "=========================================="

          find taxi_source -maxdepth 6 -type f | sort


      # ==================================================
      # 8. FIND ANDROID PROJECT
      # ==================================================
      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          SETTINGS_FILE="$(
            find taxi_source \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -print -quit
          )"

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo "=========================================="
          echo "ANDROID PROJECT FOUND"
          echo "=========================================="

          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==================================================
      # 9. FORCE PLAY STORE VERSION
      # ==================================================
      - name: Force Version 1.1.1 / Code 111
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "PLAY STORE VERSION"
          echo "=========================================="

          echo "Version Name: 1.1.1"
          echo "Version Code: 111"
          echo "Min SDK: 24"
          echo "Target SDK: 36"

          GRADLE_FILE=""

          if [ -f "$PROJECT_DIR/app/build.gradle" ]; then
            GRADLE_FILE="$PROJECT_DIR/app/build.gradle"

          elif [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            GRADLE_FILE="$PROJECT_DIR/app/build.gradle.kts"

          else
            echo "ERROR: app build.gradle not found."
            exit 1
          fi

          echo "Gradle file:"
          echo "$GRADLE_FILE"

          python3 - "$GRADLE_FILE" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              s = f.read()

          # Version Code
          s = re.sub(
              r'versionCode\s*=?\s*\d+',
              'versionCode 111',
              s
          )

          # Version Name
          s = re.sub(
              r'versionName\s*=?\s*["\'][^"\']*["\']',
              'versionName "1.1.1"',
              s
          )

          # minSdk
          s = re.sub(
              r'minSdkVersion\s+\d+',
              'minSdkVersion 24',
              s
          )

          s = re.sub(
              r'minSdk\s*=?\s*\d+',
              'minSdk 24',
              s
          )

          # targetSdk
          s = re.sub(
              r'targetSdkVersion\s+\d+',
              'targetSdkVersion 36',
              s
          )

          s = re.sub(
              r'targetSdk\s*=?\s*\d+',
              'targetSdk 36',
              s
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(s)

          print("Version configuration updated.")
          PY


      # ==================================================
      # 10. VERIFY CONFIGURATION
      # ==================================================
      - name: Verify Play Store configuration
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "FINAL CONFIGURATION"
          echo "=========================================="

          grep -RniE \
            "versionCode|versionName|minSdk|minSdkVersion|targetSdk|targetSdkVersion" \
            "$PROJECT_DIR/app" \
            --include="build.gradle" \
            --include="build.gradle.kts" \
            || true

          echo ""
          echo "Required:"
          echo "Version Code = 111"
          echo "Version Name = 1.1.1"
          echo "Min SDK = 24"
          echo "Target SDK = 36"


      # ==================================================
      # 11. VERIFY CUMULATIVE INDEX
      # ==================================================
      - name: Verify CUMULATIVE index.html
        shell: bash
        run: |
          set -e

          INDEX_FILE="$PROJECT_DIR/app/src/main/assets/index.html"

          echo "=========================================="
          echo "VERIFY CUMULATIVE INDEX"
          echo "=========================================="

          if [ ! -f "$INDEX_FILE" ]; then
            echo "ERROR: index.html not found."
            exit 1
          fi

          ls -lh "$INDEX_FILE"

          echo ""
          echo "CUMULATIVE MODE:"
          echo "No automatic monthly deletion is performed."
          echo "No monthly reset command is performed."


      # ==================================================
      # 12. VERIFY PROJECT
      # ==================================================
      - name: Verify project files
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "PROJECT FILES"
          echo "=========================================="

          find "$PROJECT_DIR" \
            -maxdepth 6 \
            -type f \
            \( \
              -name "build.gradle" \
              -o \
              -name "build.gradle.kts" \
              -o \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            -print


      # ==================================================
      # 13. RELEASE KEYSTORE
      # ==================================================
      - name: Prepare release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$GITHUB_WORKSPACE/taxi-release.keystore"

          if [ ! -s "$GITHUB_WORKSPACE/taxi-release.keystore" ]; then
            echo "ERROR: Keystore is empty."
            exit 1
          fi

          echo "Keystore ready."


      # ==================================================
      # 14. CLEAN
      # ==================================================
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle clean


      # ==================================================
      # 15. BUILD AAB
      # ==================================================
      - name: Build Release AAB
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle bundleRelease --stacktrace


      # ==================================================
      # 16. BUILD APK
      # ==================================================
      - name: Build Release APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle assembleRelease --stacktrace


      # ==================================================
      # 17. FIND AAB
      # ==================================================
      - name: Find AAB
        shell: bash
        run: |
          set -e

          AAB="$(
            find "$PROJECT_DIR" \
              -type f \
              -name "*.aab" \
              -path "*/outputs/bundle/release/*" \
              -print -quit
          )"

          if [ -z "$AAB" ]; then
            echo "ERROR: AAB not found."
            find "$PROJECT_DIR" -type f -name "*.aab" -print
            exit 1
          fi

          echo "AAB FOUND:"
          echo "$AAB"

          echo "AAB_FILE=$AAB" >> "$GITHUB_ENV"


      # ==================================================
      # 18. SIGN AAB
      # ==================================================
      - name: Sign AAB
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          jarsigner \
            -keystore "$GITHUB_WORKSPACE/taxi-release.keystore" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            "$AAB_FILE" \
            "$KEY_ALIAS"

          echo "AAB signed."


      # ==================================================
      # 19. VERIFY AAB
      # ==================================================
      - name: Verify AAB
        shell: bash
        run: |
          set -e

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$AAB_FILE"

          echo "AAB signature verified."


      # ==================================================
      # 20. FIND APK
      # ==================================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          APK="$(
            find "$PROJECT_DIR" \
              -type f \
              -name "*release*.apk" \
              -path "*/outputs/apk/release/*" \
              -print -quit
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            find "$PROJECT_DIR" -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          echo "APK_FILE=$APK" >> "$GITHUB_ENV"


      # ==================================================
      # 21. ALIGN APK
      # ==================================================
      - name: Align APK
        shell: bash
        run: |
          set -e

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
            -f \
            -p \
            4 \
            "$APK_FILE" \
            "$GITHUB_WORKSPACE/taxi-aligned.apk"


      # ==================================================
      # 22. SIGN APK
      # ==================================================
      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$GITHUB_WORKSPACE/taxi-release.keystore" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$GITHUB_WORKSPACE/Taxi-Driver-1.1.1-FINAL-SIGNED.apk" \
            "$GITHUB_WORKSPACE/taxi-aligned.apk"

          echo "APK signed."


      # ==================================================
      # 23. VERIFY APK
      # ==================================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            verify \
            --verbose \
            "$GITHUB_WORKSPACE/Taxi-Driver-1.1.1-FINAL-SIGNED.apk"

          echo "APK signature verified."


      # ==================================================
      # 24. PREPARE FINAL FILES
      # ==================================================
      - name: Prepare final release files
        shell: bash
        run: |
          set -e

          rm -rf output
          mkdir -p output

          cp "$AAB_FILE" \
            "output/Taxi-Driver-1.1.1-FINAL-SIGNED.aab"

          cp "$GITHUB_WORKSPACE/Taxi-Driver-1.1.1-FINAL-SIGNED.apk" \
            "output/Taxi-Driver-1.1.1-FINAL-SIGNED.apk"

          echo "=========================================="
          echo "FINAL RELEASE FILES"
          echo "=========================================="

          ls -lh output/


      # ==================================================
      # 25. UPLOAD AAB + APK
      # ==================================================
      - name: Upload AAB and APK
        uses: actions/upload-artifact@v4
        with:
          name: Taxi-Driver-1.1.1-FINAL-SIGNED
          path: output/*
          if-no-files-found: error
          retention-days: 30
