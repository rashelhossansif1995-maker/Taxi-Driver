name: Taxi Driver 1.1.1 FINAL CUMULATIVE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:

    name: Build Taxi Driver 1.1.1 FINAL
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. CHECKOUT
      # ==================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==================================================
      # 2. JAVA 17
      # ==================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==================================================
      # 3. GRADLE
      # ==================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"


      # ==================================================
      # 4. ANDROID SDK
      # ==================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0


      # ==================================================
      # 5. VERIFY ANDROID SDK
      # ==================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID SDK CHECK"
          echo "=========================================="

          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            echo "ERROR: Android 36 platform not found."
            exit 1
          fi

          if [ ! -d "$ANDROID_HOME/build-tools/36.0.0" ]; then
            echo "ERROR: Build Tools 36.0.0 not found."
            exit 1
          fi

          echo "Android Platform 36: OK"
          echo "Build Tools 36.0.0: OK"


      # ==================================================
      # 6. FIND ONLY THE NEW CUMULATIVE ZIP
      # ==================================================
      - name: Find ONLY FINAL CUMULATIVE ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="./Taxi-Driver-1.1.1-FINAL-CUMULATIVE-SOURCE.zip"

          echo "=========================================="
          echo "CHECKING SOURCE ZIP"
          echo "=========================================="

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Required source ZIP not found."
            echo ""
            echo "Required:"
            echo "$ZIP_FILE"
            echo ""
            echo "Available ZIP files:"
            find . -type f -name "*.zip" -print | sort
            exit 1
          fi

          echo "NEW CUMULATIVE SOURCE FOUND:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ==================================================
      # 7. EXTRACT SOURCE
      # ==================================================
      - name: Extract FINAL CUMULATIVE SOURCE
        shell: bash
        run: |
          set -e

          rm -rf taxi_source
          mkdir -p taxi_source

          unzip -q "$ZIP_FILE" -d taxi_source

          echo "=========================================="
          echo "SOURCE EXTRACTED"
          echo "=========================================="

          find taxi_source -maxdepth 6 -type f | sort


      # ==================================================
      # 8. FIND ANDROID PROJECT
      # ==================================================
      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          SETTINGS_FILE="$(
            find taxi_source \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -print -quit
          )"

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo "=========================================="
          echo "ANDROID PROJECT"
          echo "=========================================="

          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==================================================
      # 9. FORCE PLAY STORE VERSION
      # ==================================================
      - name: Force Version 1.1.1 / Code 111
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SETTING PLAY STORE VERSION"
          echo "=========================================="

          echo "Version Name : 1.1.1"
          echo "Version Code : 111"
          echo "Min SDK      : 24"
          echo "Target SDK   : 36"

          GRADLE_FILE=""

          if [ -f "$PROJECT_DIR/app/build.gradle" ]; then
            GRADLE_FILE="$PROJECT_DIR/app/build.gradle"
          elif [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            GRADLE_FILE="$PROJECT_DIR/app/build.gradle.kts"
          else
            echo "ERROR: app/build.gradle or app/build.gradle.kts not found."
            exit 1
          fi

          echo "Gradle file:"
          echo "$GRADLE_FILE"

          python3 - "$GRADLE_FILE" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              s = f.read()

          # ------------------------------------------
          # versionCode
          # ------------------------------------------
          s = re.sub(
              r'versionCode\s*=?\s*\d+',
              'versionCode 111',
              s
          )

          # ------------------------------------------
          # versionName
          # ------------------------------------------
          s = re.sub(
              r'versionName\s*=?\s*["\'][^"\']*["\']',
              'versionName "1.1.1"',
              s
          )

          # ------------------------------------------
          # minSdk / minSdkVersion
          # ------------------------------------------
          s = re.sub(
              r'minSdkVersion\s+\d+',
              'minSdkVersion 24',
              s
          )

          s = re.sub(
              r'minSdk\s*=?\s*\d+',
              'minSdk 24',
              s
          )

          # ------------------------------------------
          # targetSdk / targetSdkVersion
          # ------------------------------------------
          s = re.sub(
              r'targetSdkVersion\s+\d+',
              'targetSdkVersion 36',
              s
          )

          s = re.sub(
              r'targetSdk\s*=?\s*\d+',
              'targetSdk 36',
              s
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(s)

          print("Gradle version configuration patched.")
          PY


      # ==================================================
      # 10. VERIFY VERSION CONFIGURATION
      # ==================================================
      - name: Verify Play Store configuration
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "FINAL PLAY STORE CONFIGURATION"
          echo "=========================================="

          grep -RniE \
            "versionCode|versionName|minSdk|minSdkVersion|targetSdk|targetSdkVersion" \
            "$PROJECT_DIR/app" \
            --include="build.gradle" \
            --include="build.gradle.kts" \
            || true

          echo ""
          echo "Required:"
          echo "versionCode = 111"
          echo "versionName = 1.1.1"
          echo "minSdk = 24"
          echo "targetSdk = 36"


      # ==================================================
      # 11. VERIFY CUMULATIVE INDEX
      # ==================================================
      - name: Verify CUMULATIVE index.html
        shell: bash
        run: |
          set -e

          INDEX_FILE="$PROJECT_DIR/app/src/main/assets/index.html"

          echo "=========================================="
          echo "VERIFY CUMULATIVE APP"
          echo "=========================================="

          if [ ! -f "$INDEX_FILE" ]; then
            echo "ERROR: index.html not found."
            exit 1
          fi

          echo "index.html found:"
          ls -lh "$INDEX_FILE"

          echo ""
          echo "CUMULATIVE DATA MODE"
          echo "--------------------"
          echo "Add Record data is not automatically cleared by this workflow."
          echo "No monthly reset command is executed."
          echo "No monthly delete command is executed."
          echo "Data remains until the application's own reset/clear action is used."


      # ==================================================
      # 12. VERIFY PROJECT FILES
      # ==================================================
      - name: Verify project files
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "PROJECT FILE CHECK"
          echo "=========================================="

          find "$PROJECT_DIR" \
            -maxdepth 6 \
            -type f \
            \( \
              -name "build.gradle" \
              -o \
              -name "build.gradle.kts" \
              -o \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            -print


      # ==================================================
      # 13. PREPARE RELEASE KEYSTORE
      # ==================================================
      - name: Prepare release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$GITHUB_WORKSPACE/taxi-release.keystore"

          if [ ! -s "$GITHUB_WORKSPACE/taxi-release.keystore" ]; then
            echo "ERROR: Keystore is empty."
            exit 1
          fi

          echo "Release keystore ready."


      # ==================================================
      # 14. CLEAN
      # ==================================================
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle clean


      # ==================================================
      # 15. BUILD RELEASE AAB
      # ==================================================
      - name: Build Release AAB
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle bundleRelease --stacktrace


      # ==================================================
      # 16. BUILD RELEASE APK
      # ==================================================
      - name: Build Release APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle assembleRelease --stacktrace


      # ==================================================
      # 17. FIND AAB
      # ==================================================
      - name: Find AAB
        shell: bash
        run: |
          set -e

          AAB="$(
            find "$PROJECT_DIR" \
              -type f \
              -name "*.aab" \
              -path "*/outputs/bundle/release/*" \
              -print -quit
          )"

          if [ -z "$AAB" ]; then
            echo "ERROR: Release AAB not found."
            find "$PROJECT_DIR" -type f -name "*.aab" -print
            exit 1
          fi

          echo "AAB FOUND:"
          echo "$AAB"

          echo "AAB_FILE=$AAB" >> "$GITHUB_ENV"


      # ==================================================
      # 18. SIGN AAB
      # ==================================================
      - name: Sign AAB
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          jarsigner \
            -keystore "$GITHUB_WORKSPACE/taxi-release.keystore" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            "$AAB_FILE" \
            "$KEY_ALIAS"

          echo "AAB signed."


      # ==================================================
      # 19. VERIFY AAB
      # ==================================================
      - name: Verify AAB
        shell: bash
        run: |
          set -e

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$AAB_FILE"

          echo "AAB signature verified."


      # ==================================================
      # 20. FIND APK
      # ==================================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          APK="$(
            find "$PROJECT_DIR" \
              -type f \
              -name "*release*.apk" \
              -path "*/outputs/apk/release/*" \
              -print -quit
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found."
            find "$PROJECT_DIR" -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          echo "APK_FILE=$APK" >> "$GITHUB_ENV"


      # ==================================================
      # 21. ALIGN APK
      # ==================================================
      - name: Align APK
        shell: bash
        run: |
          set -e

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
            -f \
            -p \
            4 \
            "$APK_FILE" \
            "$GITHUB_WORKSPACE/taxi-aligned.apk"


      # ==================================================
      # 22. SIGN APK
      # ==================================================
      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$GITHUB_WORKSPACE/taxi-release.keystore" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$GITHUB_WORKSPACE/Taxi-Driver-1.1.1-FINAL-SIGNED.apk" \
            "$GITHUB_WORKSPACE/taxi-aligned.apk"

          echo "APK signed."


      # ==================================================
      # 23. VERIFY APK
      # ==================================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            verify \
            --verbose \
            "$GITHUB_WORKSPACE/Taxi-Driver-1.1.1-FINAL-SIGNED.apk"

          echo "APK signature verified."


      # ==================================================
      # 24. FINAL RELEASE FILES
      # ==================================================
      - name: Prepare final release files
        shell: bash
        run: |
          set -e

          rm -rf output
          mkdir -p output

          cp "$AAB_FILE" \
            "output/Taxi-Driver-1.1.1-FINAL-SIGNED.aab"

          cp "$GITHUB_WORKSPACE/Taxi-Driver-1.1.1-FINAL-SIGNED.apk" \
            "output/Taxi-Driver-1.1.1-FINAL-SIGNED.apk"

          echo "=========================================="
          echo "FINAL RELEASE FILES"
          echo "=========================================="

          ls -lh output/


      # ==================================================
      # 25. UPLOAD AAB + APK
      # ==================================================
      - name: Upload AAB and APK
        uses: actions/upload-artifact@v4
        with:
          name: Taxi-Driver-1.1.1-FINAL-SIGNED
          path: output/*
          if-no-files-found: error
          retention-days: 30
