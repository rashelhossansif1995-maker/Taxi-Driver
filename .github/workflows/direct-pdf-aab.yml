name: Taxi Driver 1.1.2 - Play Store Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Locate Taxi Driver Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_FILE=""

          if [ -f "app/build.gradle" ]; then
            PROJECT_FILE="app/build.gradle"
          else
            PROJECT_FILE=$(find . -type f \
              -path '*/app/build.gradle' \
              -not -path '*/build/*' \
              -print -quit || true)
          fi

          if [ -z "$PROJECT_FILE" ]; then
            ZIP_FILE=$(find . -maxdepth 5 -type f \
              -iname '*Taxi*Driver*.zip' \
              -print -quit || true)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Project files or Taxi Driver ZIP not found."
              exit 1
            fi

            mkdir -p extracted-project
            unzip -q "$ZIP_FILE" -d extracted-project

            PROJECT_FILE=$(find extracted-project -type f \
              -path '*/app/build.gradle' \
              -print -quit || true)
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: app/build.gradle was not found."
            exit 1
          fi

          PROJECT_DIR="${PROJECT_FILE%/app/build.gradle}"

          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          yes | sdkmanager --licenses >/dev/null || true

      - name: Check project and Android Gradle Plugin
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if grep -q "com.android.application.*8.7.3" build.gradle; then
            sed -i \
              "s/com.android.application' version '8.7.3'/com.android.application' version '8.9.1'/" \
              build.gradle
          fi

          echo "Android Gradle Plugin configuration:"
          cat build.gradle

          echo "App configuration:"
          grep -E "compileSdk|targetSdk|applicationId|versionCode|versionName" \
            app/build.gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "ERROR: GitHub Secret $name is missing."
              exit 1
            fi
          done

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/taxi-release.keystore"

          test -s "$RUNNER_TEMP/taxi-release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/taxi-release.keystore" \
            >> "$GITHUB_ENV"

      - name: Build release AAB and APK
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle --no-daemon clean bundleRelease assembleRelease

      - name: Sign Android App Bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          AAB="$PROJECT_DIR/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"

          jarsigner \
            -keystore "$KEYSTORE_FILE" \
            -storepass:env KEYSTORE_PASSWORD \
            -keypass:env KEY_PASSWORD \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            "$AAB" "$KEY_ALIAS"

          jarsigner -verify "$AAB"

      - name: Align and sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/release"
          UNSIGNED_APK="$APK_DIR/app-release-unsigned.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"

          if [ ! -f "$UNSIGNED_APK" ]; then
            echo "ERROR: Unsigned APK was not found."
            find "$PROJECT_DIR/app/build/outputs/apk" \
              -type f -name '*.apk' -print || true
            exit 1
          fi

          "$BUILD_TOOLS/zipalign" -f -p 4 \
            "$UNSIGNED_APK" \
            "$RUNNER_TEMP/taxi-aligned.apk"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out "$RUNNER_TEMP/Taxi-Driver-Signed.apk" \
            "$RUNNER_TEMP/taxi-aligned.apk"

          "$BUILD_TOOLS/apksigner" verify --verbose \
            "$RUNNER_TEMP/Taxi-Driver-Signed.apk"

      - name: Prepare final AAB and APK
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          mkdir -p output

          cp "$PROJECT_DIR/app/build/outputs/bundle/release/app-release.aab" \
            output/Taxi-Driver-1.1.2-Signed.aab

          cp "$RUNNER_TEMP/Taxi-Driver-Signed.apk" \
            output/Taxi-Driver-1.1.2-Signed.apk

          ls -lh output

      - name: Upload AAB and APK
        uses: actions/upload-artifact@v4
        with:
          name: Taxi-Driver-1.1.2-AAB-APK
          path: output/*
          if-no-files-found: error
          retention-days: 14
