name: Build Taxi Driver 1.0.6 Signed AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. JAVA 17
      # =========================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # =========================================================
      # 3. ANDROID SDK
      # =========================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4


      - name: Install Android 36
        run: |
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"


      # =========================================================
      # 4. GRADLE
      # =========================================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'


      # =========================================================
      # 5. EXTRACT TAXI DRIVER PROJECT
      # =========================================================
      - name: Extract Taxi Driver 1.0.6 project
        shell: bash
        run: |
          set -e

          ZIP="Taxi_Driver_PlayStore_Update_1.0.6_DIRECT_PDF.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found."
            echo "Files in repository:"
            ls -la
            exit 1
          fi

          rm -rf project
          mkdir project

          unzip -q "$ZIP" -d project

          echo "======================================"
          echo "PROJECT EXTRACTED"
          echo "======================================"

          find project -maxdepth 4 -type f | head -100


      # =========================================================
      # 6. FIND GRADLE PROJECT
      # =========================================================
      - name: Find Gradle project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found inside ZIP."
            find project -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "======================================"
          echo "GRADLE PROJECT FOUND"
          echo "$PROJECT_DIR"
          echo "======================================"


      # =========================================================
      # 7. CONFIGURE VERSION 1.0.6 / VERSION CODE 106
      # =========================================================
      - name: Configure version 1.0.6
        shell: bash
        run: |
          set -e

          BUILD_FILE="$PROJECT_DIR/app/build.gradle"

          if [ ! -f "$BUILD_FILE" ]; then
            BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"
          fi

          if [ ! -f "$BUILD_FILE" ]; then
            echo "ERROR: app Gradle file not found."
            exit 1
          fi

          echo "Using Gradle file:"
          echo "$BUILD_FILE"

          # Groovy Gradle
          sed -i -E \
            's/versionCode[[:space:]]*[=:][[:space:]]*[0-9]+/versionCode 106/g' \
            "$BUILD_FILE"

          sed -i -E \
            's/versionCode[[:space:]]+[0-9]+/versionCode 106/g' \
            "$BUILD_FILE"

          # Kotlin Gradle
          sed -i -E \
            's/versionCode[[:space:]]*=[[:space:]]*[0-9]+/versionCode = 106/g' \
            "$BUILD_FILE"

          echo "======================================"
          echo "VERSION CONFIGURATION"
          echo "======================================"

          grep -n \
            "versionCode\|versionName\|targetSdk\|compileSdk" \
            "$BUILD_FILE" || true


      # =========================================================
      # 8. FORCE RELEASE DEBUGGABLE = FALSE
      # =========================================================
      - name: Force release build to be non-debuggable
        shell: bash
        run: |
          set -e

          BUILD_FILE="$PROJECT_DIR/app/build.gradle"

          if [ ! -f "$BUILD_FILE" ]; then
            BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"
          fi

          if [ ! -f "$BUILD_FILE" ]; then
            echo "ERROR: app Gradle file not found."
            exit 1
          fi

          python3 - "$BUILD_FILE" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          # -----------------------------------------------------
          # Kotlin DSL
          # -----------------------------------------------------
          if p.suffix == ".kts":

              if "debuggable = false" not in s:
                  if "buildTypes {" in s:
                      s = s.replace(
                          "buildTypes {",
                          """buildTypes {
              release {
                  debuggable = false
              }""",
                          1
                      )
                  else:
                      s += """

          buildTypes {
              release {
                  debuggable = false
              }
          }
          """

          # -----------------------------------------------------
          # Groovy Gradle
          # -----------------------------------------------------
          else:

              if "debuggable false" not in s:
                  if "buildTypes {" in s:
                      s = s.replace(
                          "buildTypes {",
                          """buildTypes {
              release {
                  debuggable false
              }""",
                          1
                      )
                  else:
                      s += """

          buildTypes {
              release {
                  debuggable false
              }
          }
          """

          p.write_text(s)
          PY

          echo "======================================"
          echo "RELEASE BUILD CONFIGURATION"
          echo "debuggable = false"
          echo "======================================"

          grep -n -A12 -B2 "buildTypes" "$BUILD_FILE" | head -40 || true


      # =========================================================
      # 9. DECODE EXISTING PLAY UPLOAD KEY
      # =========================================================
      - name: Decode existing signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$GITHUB_WORKSPACE/upload-keystore.jks"

          if [ ! -s "$GITHUB_WORKSPACE/upload-keystore.jks" ]; then
            echo "ERROR: Keystore file is empty."
            exit 1
          fi

          echo "======================================"
          echo "SIGNING KEY LOADED"
          echo "======================================"


      # =========================================================
      # 10. VERIFY SIGNING KEY
      # =========================================================
      - name: Verify existing signing key
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e

          keytool -list \
            -keystore "$GITHUB_WORKSPACE/upload-keystore.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

          echo "======================================"
          echo "SIGNING KEY VERIFIED"
          echo "======================================"


      # =========================================================
      # 11. BUILD RELEASE APK + AAB
      # =========================================================
      - name: Build release APK and AAB
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "CLEAN BUILD"
          echo "======================================"

          gradle clean \
            --no-daemon \
            --stacktrace \
            --console=plain

          echo "======================================"
          echo "BUILDING RELEASE APK + AAB"
          echo "======================================"

          gradle \
            :app:assembleRelease \
            :app:bundleRelease \
            --no-daemon \
            --stacktrace \
            --console=plain


      # =========================================================
      # 12. FIND GENERATED FILES
      # =========================================================
      - name: Find APK and AAB
        shell: bash
        run: |
          set -e

          APK_FILE=$(find "$PROJECT_DIR/app/build" \
            -type f \
            -name "*.apk" \
            | head -1)

          AAB_FILE=$(find "$PROJECT_DIR/app/build" \
            -type f \
            -name "*.aab" \
            | head -1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          if [ -z "$AAB_FILE" ]; then
            echo "ERROR: AAB not found."
            exit 1
          fi

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"
          echo "AAB_FILE=$AAB_FILE" >> "$GITHUB_ENV"

          echo "======================================"
          echo "GENERATED FILES"
          echo "======================================"

          ls -lh "$APK_FILE"
          ls -lh "$AAB_FILE"


      # =========================================================
      # 13. SIGN AAB
      # =========================================================
      - name: Sign AAB with existing upload key
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          jarsigner \
            -keystore "$GITHUB_WORKSPACE/upload-keystore.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -signedjar "${AAB_FILE}.signed" \
            "$AAB_FILE" \
            "$KEY_ALIAS"

          mv "${AAB_FILE}.signed" "$AAB_FILE"

          echo "======================================"
          echo "AAB SIGNED"
          echo "======================================"


      # =========================================================
      # 14. SIGN APK
      # =========================================================
      - name: Sign APK with existing upload key
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"

          "$APKSIGNER" sign \
            --ks "$GITHUB_WORKSPACE/upload-keystore.jks" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "${APK_FILE}.signed.apk" \
            "$APK_FILE"

          mv "${APK_FILE}.signed.apk" "$APK_FILE"

          echo "======================================"
          echo "APK SIGNED"
          echo "======================================"


      # =========================================================
      # 15. VERIFY AAB SIGNATURE
      # =========================================================
      - name: Verify AAB signature
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "VERIFYING AAB SIGNATURE"
          echo "======================================"

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$AAB_FILE"

          if ! unzip -l "$AAB_FILE" | \
            grep -Eq 'META-INF/[^/]+\.(RSA|DSA|EC)( |$)'; then

            echo "ERROR: AAB signature block not found."
            exit 1
          fi

          echo "======================================"
          echo "AAB SIGNATURE VERIFIED"
          echo "======================================"


      # =========================================================
      # 16. VERIFY APK SIGNATURE
      # =========================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" \
            verify \
            --verbose \
            "$APK_FILE"

          echo "======================================"
          echo "APK SIGNATURE VERIFIED"
          echo "======================================"


      # =========================================================
      # 17. SHOW FINAL BUILD INFORMATION
      # =========================================================
      - name: Show final Play Store build information
        shell: bash
        run: |
          set -e

          echo ""
          echo "=============================================="
          echo "       TAXI DRIVER PLAY STORE BUILD"
          echo "=============================================="
          echo ""
          echo "VERSION NAME : 1.0.6"
          echo "VERSION CODE : 106"
          echo "TARGET SDK   : 36"
          echo "RELEASE      : YES"
          echo "DEBUGGABLE   : FALSE"
          echo "AAB SIGNED   : YES"
          echo "APK SIGNED   : YES"
          echo ""
          echo "=============================================="

          ls -lh "$AAB_FILE"
          ls -lh "$APK_FILE"


      # =========================================================
      # 18. PREPARE FINAL PLAY STORE FILES
      # =========================================================
      - name: Prepare final Play Store files
        shell: bash
        run: |
          set -e

          cp "$AAB_FILE" \
            Taxi-Driver-1.0.6-Signed-106.aab

          cp "$APK_FILE" \
            Taxi-Driver-1.0.6-Signed-106.apk

          echo "=============================================="
          echo "PLAY STORE FILES READY"
          echo "=============================================="

          ls -lh \
            Taxi-Driver-1.0.6-Signed-106.aab \
            Taxi-Driver-1.0.6-Signed-106.apk


      # =========================================================
      # 19. UPLOAD ARTIFACT
      # =========================================================
      - name: Upload signed Play Store files
        uses: actions/upload-artifact@v4
        with:
          name: Taxi-Driver-1.0.6-Signed-106
          path: |
            Taxi-Driver-1.0.6-Signed-106.aab
            Taxi-Driver-1.0.6-Signed-106.apk
