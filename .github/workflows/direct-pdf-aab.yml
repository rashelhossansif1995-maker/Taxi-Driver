name: Taxi Driver 1.1.1 Final - AAB APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Taxi Driver 1.1.1
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. JAVA 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 3. ANDROID SDK
      # ==========================================
      - name: Setup Android SDK 36
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          fi

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -print -quit 2>/dev/null || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            find "$ANDROID_HOME" -maxdepth 5 -type f \
              -name sdkmanager 2>/dev/null || true
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo "Android SDK 36 ready."


      # ==========================================
      # 4. SETUP GRADLE
      # ==========================================
      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"


      # ==========================================
      # 5. FIND 1.1.1 ZIP
      # ==========================================
      - name: Find Taxi Driver 1.1.1 ZIP
        shell: bash
        run: |
          set -e

          echo "Searching repository..."

          ZIP_FILE="$(find . \
            -type f \
            \( \
              -name 'Taxi-Driver-1.1.1-FINAL-FIXED.zip' \
              -o \
              -name 'Taxi-Driver-1.1.1-FINAL-FIXED-SOURCE.zip' \
            \) \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Taxi Driver 1.1.1 ZIP not found."
            echo ""
            echo "Repository files:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "FOUND:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ==========================================
      # 6. EXTRACT SOURCE
      # ==========================================
      - name: Extract Taxi Driver 1.1.1
        shell: bash
        run: |
          set -e

          rm -rf extracted_source
          mkdir -p extracted_source

          unzip -q "$ZIP_FILE" -d extracted_source

          echo "Extracted source:"
          find extracted_source -maxdepth 5 -type f | sort


      # ==========================================
      # 7. FIND ANDROID PROJECT
      # ==========================================
      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          if [ -f "extracted_source/taxi_work/settings.gradle" ] || \
             [ -f "extracted_source/taxi_work/settings.gradle.kts" ]; then

            PROJECT_DIR="extracted_source/taxi_work"

          else

            SETTINGS_FILE="$(find extracted_source \
              -type f \
              \( \
                -name 'settings.gradle' \
                -o \
                -name 'settings.gradle.kts' \
              \) \
              -print -quit)"

            if [ -n "$SETTINGS_FILE" ]; then
              PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
            fi

          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."

            echo ""
            echo "Possible Gradle files:"
            find extracted_source \
              -type f \
              \( \
                -name 'settings.gradle' \
                -o \
                -name 'settings.gradle.kts' \
                -o \
                -name 'build.gradle' \
                -o \
                -name 'build.gradle.kts' \
              \) \
              -print

            exit 1
          fi

          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo "ANDROID PROJECT:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==========================================
      # 8. CHECK VERSION
      # ==========================================
      - name: Verify Version 1.1.1
        shell: bash
        run: |
          set -e

          echo "Checking project..."

          find "$PROJECT_DIR" \
            -maxdepth 3 \
            -type f \
            | sort

          echo ""
          echo "Version information:"

          grep -R \
            -n \
            -E \
            "versionCode|versionName|compileSdk|targetSdk" \
            "$PROJECT_DIR/app" \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            2>/dev/null || true


      # ==========================================
      # 9. BUILD
      # ==========================================
      - name: Build Release AAB and APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Gradle version:"
          gradle --version

          echo ""
          echo "Starting clean build..."

          gradle clean

          echo ""
          echo "Building AAB..."

          gradle bundleRelease --stacktrace

          echo ""
          echo "Building APK..."

          gradle assembleRelease --stacktrace


      # ==========================================
      # 10. FIND OUTPUT
      # ==========================================
      - name: Find AAB and APK
        shell: bash
        run: |
          set -e

          echo "===================================="
          echo "BUILD OUTPUT"
          echo "===================================="

          find "$PROJECT_DIR" \
            -type f \
            \( \
              -name "*.aab" \
              -o \
              -name "*.apk" \
            \) \
            -print

          echo ""
          echo "File sizes:"

          find "$PROJECT_DIR" \
            -type f \
            \( \
              -name "*.aab" \
              -o \
              -name "*.apk" \
            \) \
            -exec ls -lh {} \;


      # ==========================================
      # 11. COLLECT OUTPUT
      # ==========================================
      - name: Collect release files
        shell: bash
        run: |
          set -e

          rm -rf output
          mkdir -p output

          find "$PROJECT_DIR" \
            -type f \
            \( \
              -name "*.aab" \
              -o \
              -name "*.apk" \
            \) \
            -exec cp {} output/ \;

          echo ""
          echo "FINAL FILES:"
          ls -lh output/


      # ==========================================
      # 12. UPLOAD ARTIFACT
      # ==========================================
      - name: Upload Taxi Driver 1.1.1
        uses: actions/upload-artifact@v4
        with:
          name: Taxi-Driver-1.1.1-AAB-APK
          path: output/*
          if-no-files-found: error
          retention-days: 30
