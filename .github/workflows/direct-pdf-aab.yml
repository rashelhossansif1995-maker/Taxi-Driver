name: Build Taxi Driver 1.0.9 Premium - Signed AAB + APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 4. Android 36 + Build Tools
      - name: Install Android 36
        run: |
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # 5. Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # 6. Extract existing project ZIP
      - name: Extract Premium Project
        run: |
          set -e

          ZIP="Taxi_Driver_1.0.9_PREMIUM_FINAL_DESIGN_PROJECT_BUILD_FIXED.zip"

          test -f "$ZIP"

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP" -d project

      # 7. Find Android project
      - name: Find Android Project
        run: |
          set -e

          SETTINGS=$(find project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          test -n "$SETTINGS"

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android Project: $PROJECT_DIR"

      # 8. Verify Premium project
      - name: Verify Premium Project
        run: |
          set -e

          MAIN_FILE=$(find "$PROJECT_DIR/app/src/main/java" \
            -type f \
            -name "MainActivity.java" \
            -print -quit)

          test -n "$MAIN_FILE"

          test -f "$PROJECT_DIR/app/src/main/assets/index.html"

          test -f "$PROJECT_DIR/app/src/main/res/drawable-nodpi/taxi_driver_premium_logo.png"

          echo "MainActivity: $MAIN_FILE"
          echo "Premium HTML: OK"
          echo "Premium Logo: OK"

      # 9. Fix Premium Callback
      - name: Fix Premium Callback
        run: |
          set -e

          MAIN_FILE=$(find "$PROJECT_DIR/app/src/main/java" \
            -type f \
            -name "MainActivity.java" \
            -print -quit)

          python3 - "$MAIN_FILE" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          s = s.replace(
              "MainActivity.MainActivity.this::showPremiumPlans",
              "MainActivity.this::showPremiumPlans"
          )

          s = s.replace(
              "this::showPremiumPlans",
              "MainActivity.this::showPremiumPlans"
          )

          s = s.replace(
              "MainActivity.MainActivity.this::showPremiumPlans",
              "MainActivity.this::showPremiumPlans"
          )

          p.write_text(s)
          PY

          if grep -q "MainActivity.MainActivity.this::showPremiumPlans" "$MAIN_FILE"; then
            echo "ERROR: Invalid callback remains"
            exit 1
          fi

          if grep -q "MainActivity.this::showPremiumPlans" "$MAIN_FILE"; then
            echo "CALLBACK OK"
          else
            echo "ERROR: Callback not found"
            exit 1
          fi

      # 10. Configure Version + SDK
      - name: Configure Version 1.0.9
        run: |
          set -e

          BUILD_FILE="$PROJECT_DIR/app/build.gradle"

          python3 - "$BUILD_FILE" <<'PY'
          import sys
          import re
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          s = re.sub(
              r'versionCode\s+\d+',
              'versionCode 109',
              s
          )

          s = re.sub(
              r'versionName\s+"[^"]+"',
              'versionName "1.0.9"',
              s
          )

          s = re.sub(
              r'compileSdk\s+\d+',
              'compileSdk 36',
              s
          )

          s = re.sub(
              r'targetSdk\s+\d+',
              'targetSdk 36',
              s
          )

          s = re.sub(
              r'minSdk\s+\d+',
              'minSdk 23',
              s
          )

          p.write_text(s)
          PY

          echo "Version configuration:"
          grep -E "versionCode|versionName|compileSdk|targetSdk|minSdk" "$BUILD_FILE" || true

      # 11. Build AAB + APK
      - name: Build Release AAB and APK
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle clean assembleRelease bundleRelease \
            --no-daemon \
            --stacktrace \
            --console=plain

      # 12. Prepare signing key
      - name: Prepare Signing Key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          echo "$KEYSTORE_BASE64" | base64 --decode > taxi-release.keystore

          test -s taxi-release.keystore

          echo "Keystore ready"

      # 13. Sign AAB
      - name: Sign AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          mkdir -p output

          UNSIGNED_AAB=$(find "$PROJECT_DIR/app/build/outputs/bundle/release" \
            -type f \
            -name "*.aab" \
            -print -quit)

          test -n "$UNSIGNED_AAB"

          jarsigner \
            -keystore taxi-release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -signedjar \
              output/Taxi-Driver-1.0.9-Premium-109-Signed.aab \
            "$UNSIGNED_AAB" \
            "$KEY_ALIAS"

          jarsigner -verify \
            output/Taxi-Driver-1.0.9-Premium-109-Signed.aab

          echo "AAB SIGNED OK"

      # 14. Prepare APK
      - name: Prepare APK
        run: |
          set -e

          mkdir -p output

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/release"

          UNSIGNED_APK=$(find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*unsigned.apk" \
            -print -quit)

          if [ -z "$UNSIGNED_APK" ]; then
            UNSIGNED_APK=$(find "$APK_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              -print -quit)
          fi

          test -n "$UNSIGNED_APK"

          echo "APK found:"
          echo "$UNSIGNED_APK"

          echo "UNSIGNED_APK=$UNSIGNED_APK" >> "$GITHUB_ENV"

      # 15. Zipalign APK
      - name: Zipalign APK
        run: |
          set -e

          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"

          "$BUILD_TOOLS/zipalign" \
            -p \
            -f \
            4 \
            "$UNSIGNED_APK" \
            output/Taxi-Driver-1.0.9-Premium-109-aligned.apk

          echo "APK ZIPALIGN OK"

      # 16. Sign APK
      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"

          "$BUILD_TOOLS/apksigner" sign \
            --ks taxi-release.keystore \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out \
              output/Taxi-Driver-1.0.9-Premium-109-Signed.apk \
            output/Taxi-Driver-1.0.9-Premium-109-aligned.apk

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            output/Taxi-Driver-1.0.9-Premium-109-Signed.apk

          echo "APK SIGNED AND VERIFIED OK"

      # 17. Check final files
      - name: Check Final Files
        run: |
          set -e

          ls -lh output/

          test -s output/Taxi-Driver-1.0.9-Premium-109-Signed.aab
          test -s output/Taxi-Driver-1.0.9-Premium-109-Signed.apk

          echo ""
          echo "======================================"
          echo "AAB + APK BUILD SUCCESS"
          echo "======================================"

      # 18. Upload AAB
      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: Taxi-Driver-1.0.9-Premium-109-Signed-AAB
          path: output/Taxi-Driver-1.0.9-Premium-109-Signed.aab
          retention-days: 30

      # 19. Upload APK
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Taxi-Driver-1.0.9-Premium-109-Signed-APK
          path: output/Taxi-Driver-1.0.9-Premium-109-Signed.apk
          retention-days: 30
