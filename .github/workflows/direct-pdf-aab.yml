name: Taxi Driver 1.1.1 Final - AAB + APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Taxi Driver 1.1.1
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. SETUP JAVA 17
      # ==========================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 3. SETUP ANDROID SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ==========================================
      # 4. INSTALL ANDROID 36
      # ==========================================
      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"


      # ==========================================
      # 5. SETUP GRADLE
      # ==========================================
      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"


      # ==========================================
      # 6. FIND 1.1.1 SOURCE ZIP
      # ==========================================
      - name: Find 1.1.1 source ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for Taxi Driver 1.1.1 source ZIP..."

          ZIP_FILE="$(find . -maxdepth 3 -type f \
            -name 'Taxi-Driver-1.1.1-FINAL-FIXED.zip' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Taxi-Driver-1.1.1-FINAL-FIXED.zip not found."
            echo ""
            echo "Repository files:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "FOUND:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ==========================================
      # 7. EXTRACT SOURCE ZIP
      # ==========================================
      - name: Extract 1.1.1 source
        shell: bash
        run: |
          set -e

          rm -rf extracted_source
          mkdir -p extracted_source

          unzip -q "$ZIP_FILE" -d extracted_source

          echo "Extracted files:"
          find extracted_source -maxdepth 4 -type f | sort


      # ==========================================
      # 8. FIND taxi_work PROJECT
      # ==========================================
      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          if [ -f "extracted_source/taxi_work/app/build.gradle" ]; then
            PROJECT_DIR="extracted_source/taxi_work"
          else
            FOUND="$(find extracted_source \
              -type f \
              -path '*/app/build.gradle' \
              -print -quit || true)"

            if [ -n "$FOUND" ]; then
              PROJECT_DIR="$(dirname "$(dirname "$FOUND")")"
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project was not found."
            find extracted_source -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo "ANDROID PROJECT:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==========================================
      # 9. VERIFY VERSION
      # ==========================================
      - name: Verify Version 1.1.1
        shell: bash
        run: |
          set -e

          echo "Checking Version Code and Version Name..."

          grep -R \
            -n \
            -E \
            "versionCode|versionName|targetSdk|compileSdk" \
            "$PROJECT_DIR/app/build.gradle"

          echo ""
          echo "Expected:"
          echo "Version Code = 111"
          echo "Version Name = 1.1.1"
          echo "Target SDK   = 36"


      # ==========================================
      # 10. PREPARE SIGNING KEYSTORE
      # ==========================================
      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > taxi-release.keystore

          test -s taxi-release.keystore

          echo "Keystore prepared successfully."


      # ==========================================
      # 11. BUILD RELEASE AAB + APK
      # ==========================================
      - name: Build release AAB + APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          gradle clean bundleRelease assembleRelease --stacktrace


      # ==========================================
      # 12. SIGN AAB
      # ==========================================
      - name: Sign AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -e

          jarsigner \
            -keystore taxi-release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            "${PROJECT_DIR}/app/build/outputs/bundle/release/app-release.aab" \
            "$KEY_ALIAS"


      # ==========================================
      # 13. VERIFY AAB
      # ==========================================
      - name: Verify signed AAB
        run: |
          set -e

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "${PROJECT_DIR}/app/build/outputs/bundle/release/app-release.aab"


      # ==========================================
      # 14. ALIGN APK
      # ==========================================
      - name: Align APK
        run: |
          set -e

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
            -f \
            -p \
            4 \
            "${PROJECT_DIR}/app/build/outputs/apk/release/app-release-unsigned.apk" \
            taxi-unsigned-aligned.apk


      # ==========================================
      # 15. SIGN APK
      # ==========================================
      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks taxi-release.keystore \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass pass:"$KEY_PASSWORD" \
            --out taxi-signed.apk \
            taxi-unsigned-aligned.apk


      # ==========================================
      # 16. VERIFY APK
      # ==========================================
      - name: Verify signed APK
        run: |
          set -e

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            verify \
            --verbose \
            taxi-signed.apk


      # ==========================================
      # 17. PREPARE FINAL FILES
      # ==========================================
      - name: Prepare final AAB + APK
        run: |
          set -e

          mkdir -p output

          cp \
            "${PROJECT_DIR}/app/build/outputs/bundle/release/app-release.aab" \
            output/Taxi-Driver-1.1.1-Premium-111-Signed.aab

          cp \
            taxi-signed.apk \
            output/Taxi-Driver-1.1.1-Premium-111-Signed.apk

          echo "FINAL FILES:"
          ls -lh output/


      # ==========================================
      # 18. UPLOAD ARTIFACTS
      # ==========================================
      - name: Upload AAB + APK
        uses: actions/upload-artifact@v4
        with:
          name: Taxi-Driver-1.1.1-Premium-111-AAB-APK
          path: output/*
          if-no-files-found: error
          retention-days: 30
