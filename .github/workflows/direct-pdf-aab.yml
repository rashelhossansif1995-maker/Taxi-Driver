name: Build Taxi Driver Direct PDF

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4

      - name: Install Android 36 SDK components
        run: |
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verify Android SDK 36
        run: |
          test -d "${ANDROID_SDK_ROOT}/platforms/android-36"
          test -d "${ANDROID_SDK_ROOT}/build-tools/36.0.0"
          echo "Android SDK 36 verified."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract Taxi Driver 1.0.6 project
        run: |
          ZIP_FILE="Taxi_Driver_PlayStore_Update_1.0.6_DIRECT_PDF.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found!"
            ls -lah
            exit 1
          fi

          rm -rf taxi_driver_project
          mkdir -p taxi_driver_project

          unzip -o "$ZIP_FILE" -d taxi_driver_project

          PROJECT_DIR=$(find taxi_driver_project \
            -type f \
            -name "settings.gradle" \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found!"
            find taxi_driver_project -maxdepth 5 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found:"
          echo "$PROJECT_DIR"

      - name: Verify Android project
        run: |
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/java/com/taxidriver/apk/MainActivity.java"
          test -f "$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Android project verified."

      - name: Enable AndroidX
        run: |
          touch "$PROJECT_DIR/gradle.properties"

          if grep -q '^android.useAndroidX=' "$PROJECT_DIR/gradle.properties"; then
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' \
              "$PROJECT_DIR/gradle.properties"
          else
            echo 'android.useAndroidX=true' >> "$PROJECT_DIR/gradle.properties"
          fi

          if grep -q '^android.enableJetifier=' "$PROJECT_DIR/gradle.properties"; then
            sed -i 's/^android.enableJetifier=.*/android.enableJetifier=true/' \
              "$PROJECT_DIR/gradle.properties"
          else
            echo 'android.enableJetifier=true' >> "$PROJECT_DIR/gradle.properties"
          fi

      - name: Fix BillingClientStateListener
        run: |
          MAIN_ACTIVITY="$PROJECT_DIR/app/src/main/java/com/taxidriver/apk/MainActivity.java"

          python3 - "$MAIN_ACTIVITY" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          import_line = (
              "import com.android.billingclient.api."
              "BillingClientStateListener;"
          )

          if import_line not in text:
              marker = (
                  "import com.android.billingclient.api."
                  "BillingClient;"
              )

              if marker in text:
                  text = text.replace(
                      marker,
                      marker + "\n" + import_line,
                      1
                  )

          text = text.replace(
              "new BillingClient.BillingClientStateListener()",
              "new BillingClientStateListener()"
          )

          path.write_text(text, encoding="utf-8")

          print("BillingClientStateListener fixed.")
          PY

          grep -q \
            "import com.android.billingclient.api.BillingClientStateListener;" \
            "$MAIN_ACTIVITY"

          grep -q \
            "new BillingClientStateListener()" \
            "$MAIN_ACTIVITY"

          echo "Billing listener verified."

      - name: Set Play Store update version
        run: |
          BUILD_FILE="$PROJECT_DIR/app/build.gradle"

          echo "Current version:"
          grep -n "versionCode\|versionName" "$BUILD_FILE" || true

          sed -i -E \
            's/versionCode[[:space:]]+[0-9]+/versionCode 106/' \
            "$BUILD_FILE"

          echo "Final version:"
          grep -n "versionCode\|versionName" "$BUILD_FILE"

      - name: Verify Target API and package
        run: |
          BUILD_FILE="$PROJECT_DIR/app/build.gradle"
          MAIN="$PROJECT_DIR/app/src/main"

          echo "Checking Target API..."

          if grep -Eq \
            'targetSdk[[:space:]]*[=:]?[[:space:]]*36|targetSdkVersion[[:space:]]*[=:]?[[:space:]]*36' \
            "$BUILD_FILE"; then
            echo "Target API 36 VERIFIED."
          else
            echo "ERROR: Target API 36 was not found."
            exit 1
          fi

          echo "Checking package..."

          if grep -R -q \
            'com.taxidriver.apk' \
            "$MAIN"; then
            echo "Package com.taxidriver.apk VERIFIED."
          else
            echo "ERROR: Package com.taxidriver.apk not found."
            exit 1
          fi

          echo "Android configuration passed."

      - name: Verify Google Play Billing
        run: |
          BUILD_FILE="$PROJECT_DIR/app/build.gradle"
          MAIN="$PROJECT_DIR/app/src/main"

          echo "Checking Billing SDK..."

          grep -q \
            "billing:9.1.0" \
            "$BUILD_FILE"

          echo "Billing 9.1.0 verified."

          echo "Checking Premium Product ID..."

          grep -R -q \
            "taxi_driver_premium" \
            "$MAIN"

          echo "Premium Product ID verified."

          echo "Checking Billing configuration..."

          if grep -R -q \
            "billing:9.1.0" \
            "$PROJECT_DIR"; then
            echo "Google Play Billing configuration VERIFIED."
          else
            echo "ERROR: Billing configuration not found."
            exit 1
          fi

          echo "Billing verification passed."

      - name: Verify AdMob
        run: |
          BUILD_FILE="$PROJECT_DIR/app/build.gradle"
          MAIN="$PROJECT_DIR/app/src/main"

          echo "Checking AdMob SDK..."

          grep -q \
            "play-services-ads:25.5.0" \
            "$BUILD_FILE"

          echo "AdMob SDK verified."

          echo "Checking AdMob App ID..."

          grep -R -q \
            "ca-app-pub-2119693628616724~2117482089" \
            "$MAIN"

          echo "AdMob App ID verified."

          echo "Checking Banner Ad Unit ID..."

          grep -R -q \
            "ca-app-pub-2119693628616724/6269224943" \
            "$MAIN"

          echo "Banner Ad Unit ID verified."

      - name: Verify Adaptive Launcher Icon
        run: |
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          grep -q 'android:icon=' "$MANIFEST"
          grep -q 'android:roundIcon=' "$MANIFEST"

          echo "Launcher icon configuration verified."

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" \
            | base64 --decode \
            > upload-keystore.jks

          test -s upload-keystore.jks

          echo "Signing keystore decoded."

      - name: Build Release APK and AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd "$PROJECT_DIR"

          echo "Running Gradle clean..."

          gradle clean \
            --no-daemon \
            --stacktrace

          echo "Building Release APK and AAB..."

          gradle \
            :app:assembleRelease \
            :app:bundleRelease \
            --no-daemon \
            --stacktrace \
            --info \
            --console=plain \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/upload-keystore.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            2>&1 \
            | tee "$GITHUB_WORKSPACE/gradle-build.log"

      - name: Prepare APK and AAB
        if: success()
        run: |
          cp \
            "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" \
            Taxi-Driver-1.0.6-Direct-PDF.apk

          cp \
            "$PROJECT_DIR/app/build/outputs/bundle/release/app-release.aab" \
            Taxi-Driver-1.0.6-Direct-PDF.aab

          echo "APK:"
          ls -lh Taxi-Driver-1.0.6-Direct-PDF.apk

          echo "AAB:"
          ls -lh Taxi-Driver-1.0.6-Direct-PDF.aab

      - name: Upload APK and AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Taxi-Driver-1.0.6-Direct-PDF
          path: |
            Taxi-Driver-1.0.6-Direct-PDF.apk
            Taxi-Driver-1.0.6-Direct-PDF.aab

      - name: Upload Gradle Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Taxi-Driver-Gradle-Build-Log
          path: gradle-build.log
          if-no-files-found: ignore
