name: Build Taxi Driver 1.1.0 Final Commission - AAB + APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==============================
      # CHECKOUT
      # ==============================
      - name: Checkout
        uses: actions/checkout@v4


      # ==============================
      # JAVA 17
      # ==============================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==============================
      # ANDROID SDK
      # ==============================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # ==============================
      # ANDROID 36
      # ==============================
      - name: Install Android 36
        run: |
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"


      # ==============================
      # GRADLE
      # ==============================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"


      # ==============================
      # EXTRACT FINAL PROJECT
      # ==============================
      - name: Extract Final Commission Project
        run: |
          set -e

          ZIP="Taxi_Driver_1.1.0_FINAL_COMMISSION_FIXED.zip"

          echo "======================================"
          echo "USING PROJECT ZIP:"
          echo "$ZIP"
          echo "======================================"

          test -f "$ZIP"

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP" -d project

          echo "Project extracted successfully."


      # ==============================
      # FIND ANDROID PROJECT
      # ==============================
      - name: Find Android Project
        run: |
          set -e

          SETTINGS=$(find project -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) -print -quit)

          test -n "$SETTINGS"

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "======================================"
          echo "ANDROID PROJECT:"
          echo "$PROJECT_DIR"
          echo "======================================"


      # ==============================
      # VERIFY PROJECT
      # ==============================
      - name: Verify Project
        run: |
          set -e

          MAIN_FILE=$(find "$PROJECT_DIR/app/src/main/java" \
            -type f \
            -name "MainActivity.java" \
            -print -quit)

          test -n "$MAIN_FILE"

          test -f "$PROJECT_DIR/app/src/main/assets/index.html"

          test -f "$PROJECT_DIR/app/src/main/res/drawable-nodpi/taxi_driver_premium_logo.png"

          echo "======================================"
          echo "PROJECT VERIFICATION"
          echo "======================================"

          echo "MainActivity:"
          echo "$MAIN_FILE"

          echo "HTML:"
          echo "$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Premium logo:"
          echo "FOUND"

          echo "======================================"


      # ==============================
      # FIX PREMIUM CALLBACK
      # ==============================
      - name: Fix Premium Callback
        run: |
          set -e

          MAIN_FILE=$(find "$PROJECT_DIR/app/src/main/java" \
            -type f \
            -name "MainActivity.java" \
            -print -quit)

          test -n "$MAIN_FILE"

          python3 - "$MAIN_FILE" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          s = s.replace(
              "MainActivity.MainActivity.this::showPremiumPlans",
              "MainActivity.this::showPremiumPlans"
          )

          p.write_text(s)

          print("Premium callback cleanup completed.")
          PY

          echo "Checking Premium callback:"
          grep -n "showPremiumPlans" "$MAIN_FILE" || true


      # ==============================
      # CONFIGURE VERSION 1.1.0
      # ==============================
      - name: Configure Version 1.1.0
        run: |
          set -e

          python3 - "$PROJECT_DIR/app/build.gradle" <<'PY'
          import sys
          import re
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          # Version Code
          s = re.sub(
              r'versionCode\s+\d+',
              'versionCode 110',
              s,
              count=1
          )

          # Version Name
          s = re.sub(
              r'versionName\s+["\'][^"\']+["\']',
              'versionName "1.1.0"',
              s,
              count=1
          )

          # Compile SDK
          s = re.sub(
              r'compileSdk\s+\d+',
              'compileSdk 36',
              s,
              count=1
          )

          # Target SDK
          s = re.sub(
              r'targetSdk\s+\d+',
              'targetSdk 36',
              s,
              count=1
          )

          # Minimum SDK
          s = re.sub(
              r'minSdk\s+\d+',
              'minSdk 23',
              s,
              count=1
          )

          p.write_text(s)

          print("Version configuration completed.")
          PY

          echo "======================================"
          echo "FINAL BUILD CONFIGURATION"
          echo "======================================"

          grep -E \
            "versionCode|versionName|compileSdk|minSdk|targetSdk" \
            "$PROJECT_DIR/app/build.gradle" || true

          echo "======================================"


      # ==============================
      # BUILD AAB + APK
      # ==============================
      - name: Build Release AAB and APK
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle clean assembleRelease bundleRelease \
            --no-daemon \
            --stacktrace \
            --console=plain

          echo "======================================"
          echo "AAB + APK BUILD COMPLETED"
          echo "======================================"


      # ==============================
      # PREPARE SIGNING KEY
      # ==============================
      - name: Prepare Signing Key
        run: |
          set -e

          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore

          test -s release.keystore

          echo "Signing key prepared."

        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}


      # ==============================
      # SIGN AAB
      # ==============================
      - name: Sign AAB
        run: |
          set -e

          mkdir -p output

          AAB=$(find "$PROJECT_DIR/app/build/outputs/bundle/release" \
            -type f \
            -name "*.aab" \
            -print -quit)

          test -n "$AAB"

          echo "======================================"
          echo "UNSIGNED AAB:"
          echo "$AAB"
          echo "======================================"

          jarsigner \
            -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$AAB" \
            "$KEY_ALIAS"

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$AAB"

          cp "$AAB" \
            "output/Taxi-Driver-1.1.0-Premium-110-Currency-Signed.aab"

          echo "Signed AAB created."

        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}


      # ==============================
      # SIGN APK
      # ==============================
      - name: Sign APK
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/release" \
            -type f \
            -name "*.apk" \
            -print -quit)

          test -n "$APK"

          echo "======================================"
          echo "UNSIGNED APK:"
          echo "$APK"
          echo "======================================"

          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"

          # ZIPALIGN
          "$BUILD_TOOLS/zipalign" \
            -f 4 \
            "$APK" \
            aligned.apk

          # APK SIGN
          "$BUILD_TOOLS/apksigner" sign \
            --ks release.keystore \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out \
            "output/Taxi-Driver-1.1.0-Premium-110-Currency-Signed.apk" \
            aligned.apk

          # VERIFY APK
          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            "output/Taxi-Driver-1.1.0-Premium-110-Currency-Signed.apk"

          echo "Signed APK created."

        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}


      # ==============================
      # SHOW FINAL FILES
      # ==============================
      - name: Show Final Files
        run: |
          echo "======================================"
          echo "FINAL BUILD FILES"
          echo "======================================"

          ls -lh output/

          echo "======================================"

          echo "Expected AAB:"
          echo "Taxi-Driver-1.1.0-Premium-110-Currency-Signed.aab"

          echo "Expected APK:"
          echo "Taxi-Driver-1.1.0-Premium-110-Currency-Signed.apk"

          echo "======================================"


      # ==============================
      # UPLOAD AAB + APK
      # ==============================
      - name: Upload AAB + APK
        uses: actions/upload-artifact@v4
        with:
          name: Taxi-Driver-1.1.0-Premium-110-Currency-AAB-APK

          path: |
            output/Taxi-Driver-1.1.0-Premium-110-Currency-Signed.aab
            output/Taxi-Driver-1.1.0-Premium-110-Currency-Signed.apk

          if-no-files-found: error
