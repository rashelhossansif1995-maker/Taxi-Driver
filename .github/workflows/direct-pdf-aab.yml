    private void setupAdView() {

        adView = new AdView(this);

        adView.setAdSize(
                AdSize.BANNER
        );

        adView.setAdUnitId(
                ADMOB_BANNER_UNIT_ID
        );

        FrameLayout.LayoutParams adLp =
                new FrameLayout.LayoutParams(
                        FrameLayout.LayoutParams.MATCH_PARENT,
                        dp(50)
                );

        adLp.gravity =
                android.view.Gravity.BOTTOM;

        rootLayout.addView(
                adView,
                adLp
        );

        if (isPremiumUnlocked()) {

            adView.setVisibility(
                    View.GONE
            );

            updateWebViewBottomMargin(
                    false
            );

        } else {

            adView.setVisibility(
                    View.VISIBLE
            );

            updateWebViewBottomMargin(
                    true
            );

            MobileAds.initialize(
                    this,
                    status -> loadBannerAd()
            );
        }
    }

    private void loadBannerAd() {

        if (adView == null ||
                isPremiumUnlocked()) {
            return;
        }

        runOnUiThread(
                () -> adView.loadAd(
                        new AdRequest.Builder().build()
                )
        );
    }

    private int dp(int value) {

        return Math.round(
                value *
                getResources()
                        .getDisplayMetrics()
                        .density
        );
    }

    private boolean isPremiumUnlocked() {

        return premiumPrefs != null &&
                premiumPrefs.getBoolean(
                        PREF_PREMIUM,
                        false
                );
    }

    private void setPremiumUnlocked(
            boolean unlocked
    ) {

        if (premiumPrefs != null) {

            premiumPrefs.edit()
                    .putBoolean(
                            PREF_PREMIUM,
                            unlocked
                    )
                    .apply();
        }

        updateAdVisibility(
                unlocked
        );

        runOnUiThread(() -> {

            if (webView != null) {

                webView.evaluateJavascript(
                        "window.AndroidPremiumState && " +
                        "window.AndroidPremiumState(" +
                        unlocked +
                        ");",
                        null
                );
            }
        });
    }

    private void updateAdVisibility(
            boolean premium
    ) {

        if (adView == null ||
                rootLayout == null ||
                webView == null) {
            return;
        }

        runOnUiThread(() -> {

            adView.setVisibility(
                    premium
                            ? View.GONE
                            : View.VISIBLE
            );

            updateWebViewBottomMargin(
                    !premium
            );

            if (premium) {

                adView.destroy();

            } else {

                loadBannerAd();
            }
        });
    }

    private void updateWebViewBottomMargin(
            boolean reserveAdSpace
    ) {

        FrameLayout.LayoutParams lp =
                (FrameLayout.LayoutParams)
                        webView.getLayoutParams();

        lp.bottomMargin =
                reserveAdSpace
                        ? dp(50)
                        : 0;

        webView.setLayoutParams(lp);
    }

    private void setupBilling() {

        billingClient =
                BillingClient.newBuilder(this)

                        .setListener(
                                this::onPurchasesUpdated
                        )

                        .enablePendingPurchases(
                                PendingPurchasesParams
                                        .newBuilder()
                                        .enableOneTimeProducts()
                                        .build()
                        )

                        .enableAutoServiceReconnection()

                        .build();

        billingClient.startConnection(
                new BillingClientStateListener() {

                    @Override
                    public void onBillingSetupFinished(
                            BillingResult billingResult
                    ) {

                        if (
                                billingResult.getResponseCode()
                                ==
                                BillingClient.BillingResponseCode.OK
                        ) {

                            queryExistingPremiumPurchase();

                            queryPremiumProduct();
                        }
                    }

                    @Override
                    public void onBillingServiceDisconnected() {

                        // Automatic reconnection is enabled.
                    }
                }
        );
    }

    private void queryExistingPremiumPurchase() {

        if (billingClient == null ||
                !billingClient.isReady()) {
            return;
        }

        QueryPurchasesParams params =
                QueryPurchasesParams.newBuilder()

                        .setProductType(
                                BillingClient.ProductType.INAPP
                        )

                        .build();

        billingClient.queryPurchasesAsync(
                params,
                (billingResult, purchases) -> {

                    if (
                            billingResult.getResponseCode()
                            !=
                            BillingClient.BillingResponseCode.OK
                    ) {
                        return;
                    }

                    for (
                            Purchase purchase :
                            purchases
                    ) {

                        if (
                                purchase.getProducts()
                                        .contains(
                                                PREMIUM_PRODUCT_ID
                                        )
                                &&
                                purchase.getPurchaseState()
                                        ==
                                Purchase.PurchaseState.PURCHASED
                        ) {

                            grantPremium(
                                    purchase
                            );

                            return;
                        }
                    }
                }
        );
    }

    private void queryPremiumProduct() {

        if (billingClient == null ||
                !billingClient.isReady()) {
            return;
        }

        QueryProductDetailsParams.Product product =
                QueryProductDetailsParams.Product
                        .newBuilder()

                        .setProductId(
                                PREMIUM_PRODUCT_ID
                        )

                        .setProductType(
                                BillingClient.ProductType.INAPP
                        )

                        .build();

        QueryProductDetailsParams params =
                QueryProductDetailsParams
                        .newBuilder()

                        .setProductList(
                                java.util.Collections
                                        .singletonList(
                                                product
                                        )
                        )

                        .build();

        billingClient.queryProductDetailsAsync(
                params,
                (billingResult, result) -> {

                    if (
                            billingResult.getResponseCode()
                            !=
                            BillingClient.BillingResponseCode.OK
                    ) {
                        return;
                    }

                    List<ProductDetails> products =
                            result.getProductDetailsList();

                    if (
                            products != null &&
                            !products.isEmpty()
                    ) {

                        premiumProductDetails =
                                products.get(0);
                    }
                }
        );
    }

    private void purchasePremium() {

        if (isPremiumUnlocked()) {

            showBillingMessage(
                    "Premium is already active."
            );

            return;
        }

        if (
                billingClient == null ||
                !billingClient.isReady()
        ) {

            showBillingMessage(
                    "Google Play Billing is connecting. " +
                    "Please try again in a moment."
            );

            return;
        }

        if (premiumProductDetails == null) {

            queryPremiumProduct();

            showBillingMessage(
                    "Premium is not available yet. " +
                    "Make sure the one-time product is active " +
                    "in Google Play Console."
            );

            return;
        }

        List<ProductDetails.OneTimePurchaseOfferDetails>
                offers =
                premiumProductDetails
                        .getOneTimePurchaseOfferDetailsList();

        if (
                offers == null ||
                offers.isEmpty()
        ) {

            showBillingMessage(
                    "No purchase offer is currently available for Premium."
            );

            return;
        }

        String offerToken =
                offers.get(0).getOfferToken();

        BillingFlowParams.ProductDetailsParams
                productDetailsParams =
                BillingFlowParams.ProductDetailsParams
                        .newBuilder()

                        .setProductDetails(
                                premiumProductDetails
                        )

                        .setOfferToken(
                                offerToken
                        )

                        .build();

        BillingFlowParams billingFlowParams =
                BillingFlowParams.newBuilder()

                        .setProductDetailsParamsList(
                                java.util.Collections
                                        .singletonList(
                                                productDetailsParams
                                        )
                        )

                        .build();

        billingClient.launchBillingFlow(
                this,
                billingFlowParams
        );
    }

    private void onPurchasesUpdated(
            BillingResult billingResult,
            List<Purchase> purchases
    ) {

        if (
                billingResult.getResponseCode()
                ==
                BillingClient.BillingResponseCode.OK
                &&
                purchases != null
        ) {

            for (
                    Purchase purchase :
                    purchases
            ) {

                if (
                        purchase.getProducts()
                                .contains(
                                        PREMIUM_PRODUCT_ID
                                )
                ) {

                    if (
                            purchase.getPurchaseState()
                            ==
                            Purchase.PurchaseState.PURCHASED
                    ) {

                        grantPremium(
                                purchase
                        );

                    } else if (
                            purchase.getPurchaseState()
                            ==
                            Purchase.PurchaseState.PENDING
                    ) {

                        showBillingMessage(
                                "Purchase is pending. " +
                                "Ads will be removed after " +
                                "Google Play confirms payment."
                        );
                    }
                }
            }

        } else if (
                billingResult.getResponseCode()
                !=
                BillingClient.BillingResponseCode.USER_CANCELED
        ) {

            showBillingMessage(
                    "Premium purchase could not be completed: "
                    +
                    billingResult.getDebugMessage()
            );
        }
    }

    private void grantPremium(
            Purchase purchase
    ) {

        setPremiumUnlocked(
                true
        );

        if (
                !purchase.isAcknowledged()
                &&
                billingClient != null
                &&
                billingClient.isReady()
        ) {

            AcknowledgePurchaseParams params =
                    AcknowledgePurchaseParams
                            .newBuilder()

                            .setPurchaseToken(
                                    purchase.getPurchaseToken()
                            )

                            .build();

            billingClient.acknowledgePurchase(
                    params,
                    billingResult -> {

                        if (
                                billingResult.getResponseCode()
                                !=
                                BillingClient.BillingResponseCode.OK
                        ) {

                            showBillingMessage(
                                    "Premium was purchased, " +
                                    "but Google Play acknowledgement " +
                                    "is still pending."
                            );
                        }
                    }
            );
        }

        showBillingMessage(
                "Premium activated. Ads have been removed."
        );
    }

