name: Taxi Driver - Fixed AAB Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fL \
            "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip" \
            -o "$RUNNER_TEMP/sdk.zip"

          mkdir -p "$RUNNER_TEMP/sdk"
          unzip -q "$RUNNER_TEMP/sdk.zip" -d "$RUNNER_TEMP/sdk"

          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv "$RUNNER_TEMP/sdk/cmdline-tools" \
             "$ANDROID_HOME/cmdline-tools/latest"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Find the correct Taxi Driver project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          if [ -f "app/build.gradle" ]; then
            PROJECT_DIR="."
          else
            ZIP_FILE=""

            for candidate in \
              "Taxi-Driver-1.1.2-Merged-Project-FIXED.zip" \
              "Taxi-Driver-1.1.2-Merged-Project.zip"
            do
              if [ -f "$candidate" ]; then
                ZIP_FILE="$candidate"
                break
              fi
            done

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Correct Taxi Driver ZIP not found."
              echo "Upload Taxi-Driver-1.1.2-Merged-Project-FIXED.zip"
              exit 1
            fi

            mkdir -p "$RUNNER_TEMP/taxi-project"
            unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/taxi-project"

            PROJECT_FILE=$(find "$RUNNER_TEMP/taxi-project" \
              -type f -path '*/app/build.gradle' \
              -print -quit || true)

            if [ -z "$PROJECT_FILE" ]; then
              echo "ERROR: app/build.gradle not found in ZIP."
              exit 1
            fi

            PROJECT_DIR="${PROJECT_FILE%/app/build.gradle}"
          fi

          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/java/com/taxidriver/apk/MainActivity.java"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Selected project: $PROJECT_DIR"

          grep -n "showPremiumPlans" \
            "$PROJECT_DIR/app/src/main/java/com/taxidriver/apk/MainActivity.java" \
            || {
              echo "ERROR: showPremiumPlans is missing from selected source."
              exit 1
            }

      - name: Check Gradle configuration
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if grep -q "version '8.7.3'" build.gradle; then
            sed -i "s/version '8.7.3'/version '8.9.1'/" build.gradle
          fi

          cat build.gradle

          grep -E \
            "compileSdk|targetSdk|applicationId|versionCode|versionName" \
            app/build.gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          for name in \
            KEYSTORE_BASE64 \
            KEYSTORE_PASSWORD \
            KEY_ALIAS \
            KEY_PASSWORD
          do
            if [ -z "${!name}" ]; then
              echo "ERROR: Missing GitHub Secret: $name"
              exit 1
            fi
          done

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/release.keystore"

          test -s "$RUNNER_TEMP/release.keystore"

          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" \
            >> "$GITHUB_ENV"

      - name: Build release AAB and APK
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle --no-daemon clean bundleRelease assembleRelease

      - name: Sign AAB
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          AAB="$PROJECT_DIR/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"

          jarsigner \
            -keystore "$KEYSTORE_FILE" \
            -storepass:env KEYSTORE_PASSWORD \
            -keypass:env KEY_PASSWORD \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            "$AAB" "$KEY_ALIAS"

          jarsigner -verify "$AAB"

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release-unsigned.apk"
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"

          test -s "$APK"

          "$TOOLS/zipalign" -f -p 4 \
            "$APK" "$RUNNER_TEMP/aligned.apk"

          "$TOOLS/apksigner" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out "$RUNNER_TEMP/Taxi-Driver-Signed.apk" \
            "$RUNNER_TEMP/aligned.apk"

          "$TOOLS/apksigner" verify --verbose \
            "$RUNNER_TEMP/Taxi-Driver-Signed.apk"

      - name: Prepare final files
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output

          cp \
            "$PROJECT_DIR/app/build/outputs/bundle/release/app-release.aab" \
            output/Taxi-Driver-1.1.2-Signed.aab

          cp "$RUNNER_TEMP/Taxi-Driver-Signed.apk" \
            output/Taxi-Driver-1.1.2-Signed.apk

          ls -lh output

      - name: Upload final AAB and APK
        uses: actions/upload-artifact@v4
        with:
          name: Taxi-Driver-1.1.2-AAB-APK
          path: output/*
          if-no-files-found: error
          retention-days: 14
