name: Build Taxi Driver 1.0.6 Signed AAB - API 23 All Devices

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. JAVA 17
      # =========================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # =========================================================
      # 3. ANDROID SDK
      # =========================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36
        run: |
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"


      # =========================================================
      # 4. GRADLE
      # =========================================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'


      # =========================================================
      # 5. EXTRACT PROJECT
      # =========================================================
      - name: Extract Taxi Driver project
        shell: bash
        run: |
          set -e

          ZIP="Taxi_Driver_PlayStore_Update_1.0.6_DIRECT_PDF.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Project ZIP not found."
            ls -la
            exit 1
          fi

          rm -rf project
          mkdir project

          unzip -q "$ZIP" -d project

          echo "PROJECT EXTRACTED"

          find project -maxdepth 4 -type f | head -100


      # =========================================================
      # 6. FIND GRADLE PROJECT
      # =========================================================
      - name: Find Gradle project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found."
            find project -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "GRADLE PROJECT:"
          echo "$PROJECT_DIR"


      # =========================================================
      # 7. FIND APP GRADLE FILE
      # =========================================================
      - name: Find app Gradle file
        shell: bash
        run: |
          set -e

          BUILD_FILE="$PROJECT_DIR/app/build.gradle"

          if [ ! -f "$BUILD_FILE" ]; then
            BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"
          fi

          if [ ! -f "$BUILD_FILE" ]; then
            echo "ERROR: app Gradle file not found."
            exit 1
          fi

          echo "BUILD_FILE=$BUILD_FILE" >> "$GITHUB_ENV"

          echo "BUILD FILE:"
          echo "$BUILD_FILE"


      # =========================================================
      # 8. VERSION 1.0.6 / CODE 106
      # =========================================================
      - name: Configure version 1.0.6
        shell: bash
        run: |
          set -e

          python3 - "$BUILD_FILE" <<'PY'
          import sys
          import re
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          # Version Code
          s = re.sub(
              r'\bversionCode\s*(?:=)?\s*\d+',
              'versionCode 106',
              s
          )

          # Version Name
          s = re.sub(
              r'\bversionName\s*(?:=)?\s*["\'][^"\']+["\']',
              'versionName "1.0.6"',
              s
          )

          p.write_text(s)
          PY

          echo "======================================"
          echo "VERSION CONFIGURATION"
          echo "======================================"

          grep -n \
            "versionCode\|versionName" \
            "$BUILD_FILE" || true


      # =========================================================
      # 9. MIN SDK 23
      # =========================================================
      - name: Force minimum SDK 23
        shell: bash
        run: |
          set -e

          python3 - "$BUILD_FILE" <<'PY'
          import sys
          import re
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          # Groovy
          s = re.sub(
              r'\bminSdkVersion\s*[=:]?\s*\d+',
              'minSdkVersion 23',
              s
          )

          # Groovy/Kotlin
          s = re.sub(
              r'\bminSdk\s*=\s*\d+',
              'minSdk = 23',
              s
          )

          s = re.sub(
              r'\bminSdk\s+\d+',
              'minSdk 23',
              s
          )

          p.write_text(s)
          PY

          echo "======================================"
          echo "MIN SDK = 23"
          echo "======================================"

          grep -n \
            "minSdk\|minSdkVersion" \
            "$BUILD_FILE" || true


      # =========================================================
      # 10. TARGET SDK 36
      # =========================================================
      - name: Force target SDK 36
        shell: bash
        run: |
          set -e

          python3 - "$BUILD_FILE" <<'PY'
          import sys
          import re
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          s = re.sub(
              r'\btargetSdkVersion\s*[=:]?\s*\d+',
              'targetSdkVersion 36',
              s
          )

          s = re.sub(
              r'\btargetSdk\s*=\s*\d+',
              'targetSdk = 36',
              s
          )

          s = re.sub(
              r'\btargetSdk\s+\d+',
              'targetSdk 36',
              s
          )

          p.write_text(s)
          PY

          echo "======================================"
          echo "TARGET SDK = 36"
          echo "======================================"

          grep -n \
            "targetSdk\|targetSdkVersion" \
            "$BUILD_FILE" || true


      # =========================================================
      # 11. RELEASE MUST NOT BE DEBUGGABLE
      # =========================================================
      - name: Force release debuggable false
        shell: bash
        run: |
          set -e

          python3 - "$BUILD_FILE" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          # Existing true -> false
          s = s.replace(
              "debuggable true",
              "debuggable false"
          )

          s = s.replace(
              "debuggable = true",
              "debuggable = false"
          )

          # Add release setting if missing
          if "debuggable false" not in s and "debuggable = false" not in s:

              if p.suffix == ".kts":
                  block = """buildTypes {
              release {
                  debuggable = false
              }
          """
              else:
                  block = """buildTypes {
              release {
                  debuggable false
              }
          """

              if "buildTypes {" in s:
                  s = s.replace(
                      "buildTypes {",
                      block,
                      1
                  )
              else:
                  if p.suffix == ".kts":
                      s += """

          buildTypes {
              release {
                  debuggable = false
              }
          }
          """
                  else:
                      s += """

          buildTypes {
              release {
                  debuggable false
              }
          }
          """

          p.write_text(s)
          PY

          echo "RELEASE DEBUGGABLE = FALSE"


      # =========================================================
      # 12. REDUCE UNNECESSARY DEVICE FEATURE FILTERING
      # =========================================================
      - name: Add optional hardware features
        shell: bash
        run: |
          set -e

          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "Manifest not found:"
            echo "$MANIFEST"
            exit 1
          fi

          python3 - "$MANIFEST" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          optional_features = [
              '    <uses-feature android:name="android.hardware.camera" android:required="false" />',
              '    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />',
              '    <uses-feature android:name="android.hardware.camera.any" android:required="false" />',
              '    <uses-feature android:name="android.hardware.location.gps" android:required="false" />',
              '    <uses-feature android:name="android.hardware.location.network" android:required="false" />',
              '    <uses-feature android:name="android.hardware.bluetooth" android:required="false" />',
              '    <uses-feature android:name="android.hardware.bluetooth_le" android:required="false" />',
              '    <uses-feature android:name="android.hardware.microphone" android:required="false" />',
              '    <uses-feature android:name="android.hardware.wifi" android:required="false" />'
          ]

          insert = "\n".join(optional_features)

          if "<application" not in s:
              raise SystemExit("ERROR: <application> not found in manifest.")

          missing = []

          for line in optional_features:
              name = line.split('android:name="')[1].split('"')[0]

              if f'android:name="{name}"' not in s:
                  missing.append(line)

          if missing:
              addition = "\n" + "\n".join(missing) + "\n"
              s = s.replace(
                  "<application",
                  addition + "\n    <application",
                  1
              )

          p.write_text(s)
          PY

          echo "======================================"
          echo "OPTIONAL DEVICE FEATURES CONFIGURED"
          echo "======================================"

          grep -n \
            "uses-feature" \
            "$MANIFEST" || true


      # =========================================================
      # 13. VERIFY FINAL CONFIG
      # =========================================================
      - name: Verify final Android configuration
        shell: bash
        run: |
          set -e

          echo ""
          echo "================================================"
          echo "FINAL TAXI DRIVER CONFIGURATION"
          echo "================================================"

          echo "VERSION NAME:"
          grep -n "versionName" "$BUILD_FILE" || true

          echo ""
          echo "VERSION CODE:"
          grep -n "versionCode" "$BUILD_FILE" || true

          echo ""
          echo "MIN SDK:"
          grep -n "minSdk" "$BUILD_FILE" || true

          echo ""
          echo "TARGET SDK:"
          grep -n "targetSdk" "$BUILD_FILE" || true

          echo ""
          echo "DEVICE FEATURES:"
          grep -n "uses-feature" \
            "$PROJECT_DIR/app/src/main/AndroidManifest.xml" || true

          echo ""
          echo "================================================"


      # =========================================================
      # 14. LOAD EXISTING SIGNING KEY
      # =========================================================
      - name: Decode existing signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$GITHUB_WORKSPACE/upload-keystore.jks"

          test -s "$GITHUB_WORKSPACE/upload-keystore.jks"

          echo "SIGNING KEY LOADED"


      # =========================================================
      # 15. VERIFY KEY
      # =========================================================
      - name: Verify signing key
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e

          keytool -list \
            -keystore "$GITHUB_WORKSPACE/upload-keystore.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

          echo "SIGNING KEY VERIFIED"


      # =========================================================
      # 16. BUILD APK + AAB
      # =========================================================
      - name: Build release APK and AAB
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "CLEAN"
          echo "======================================"

          gradle clean \
            --no-daemon \
            --stacktrace \
            --console=plain

          echo "======================================"
          echo "BUILD RELEASE"
          echo "======================================"

          gradle \
            :app:assembleRelease \
            :app:bundleRelease \
            --no-daemon \
            --stacktrace \
            --console=plain


      # =========================================================
      # 17. FIND BUILD FILES
      # =========================================================
      - name: Find APK and AAB
        shell: bash
        run: |
          set -e

          APK_FILE=$(find "$PROJECT_DIR/app/build" \
            -type f \
            -name "*.apk" \
            | head -1)

          AAB_FILE=$(find "$PROJECT_DIR/app/build" \
            -type f \
            -name "*.aab" \
            | head -1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          if [ -z "$AAB_FILE" ]; then
            echo "ERROR: AAB not found."
            exit 1
          fi

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"
          echo "AAB_FILE=$AAB_FILE" >> "$GITHUB_ENV"

          ls -lh "$APK_FILE"
          ls -lh "$AAB_FILE"


      # =========================================================
      # 18. SIGN AAB
      # =========================================================
      - name: Sign AAB
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          jarsigner \
            -keystore "$GITHUB_WORKSPACE/upload-keystore.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -signedjar "${AAB_FILE}.signed" \
            "$AAB_FILE" \
            "$KEY_ALIAS"

          mv "${AAB_FILE}.signed" "$AAB_FILE"

          echo "AAB SIGNED"


      # =========================================================
      # 19. SIGN APK
      # =========================================================
      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"

          "$APKSIGNER" sign \
            --ks "$GITHUB_WORKSPACE/upload-keystore.jks" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "${APK_FILE}.signed.apk" \
            "$APK_FILE"

          mv "${APK_FILE}.signed.apk" "$APK_FILE"

          echo "APK SIGNED"


      # =========================================================
      # 20. VERIFY AAB
      # =========================================================
      - name: Verify AAB signature
        shell: bash
        run: |
          set -e

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$AAB_FILE"

          if ! unzip -l "$AAB_FILE" | \
            grep -Eq 'META-INF/[^/]+\.(RSA|DSA|EC)( |$)'; then
            echo "ERROR: AAB signature block not found."
            exit 1
          fi

          echo "AAB SIGNATURE VERIFIED"


      # =========================================================
      # 21. VERIFY APK
      # =========================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" \
            verify \
            --verbose \
            "$APK_FILE"

          echo "APK SIGNATURE VERIFIED"


      # =========================================================
      # 22. CHECK AAB MANIFEST FEATURES
      # =========================================================
      - name: Inspect final APK compatibility
        shell: bash
        run: |
          set -e

          AAPT2="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2"

          echo "=============================================="
          echo "FINAL APK DEVICE COMPATIBILITY"
          echo "=============================================="

          "$AAPT2" dump badging "$APK_FILE" \
            | grep -E \
              "sdkVersion|targetSdkVersion|uses-feature|uses-permission" \
              | head -100 || true


      # =========================================================
      # 23. FINAL INFORMATION
      # =========================================================
      - name: Show final Play Store build
        shell: bash
        run: |
          set -e

          echo ""
          echo "================================================"
          echo "        TAXI DRIVER PLAY STORE BUILD"
          echo "================================================"
          echo ""
          echo "VERSION NAME : 1.0.6"
          echo "VERSION CODE : 106"
          echo "MIN SDK      : 23"
          echo "TARGET SDK   : 36"
          echo "DEBUGGABLE   : FALSE"
          echo "AAB SIGNED   : YES"
          echo "APK SIGNED   : YES"
          echo ""
          echo "DEVICE TARGET:"
          echo "PHONE  : YES"
          echo "TABLET : YES"
          echo "TV     : YES (if manifest supports it)"
          echo "CAR    : YES (if manifest supports it)"
          echo ""
          echo "================================================"

          ls -lh "$AAB_FILE"
          ls -lh "$APK_FILE"


      # =========================================================
      # 24. PREPARE FINAL FILES
      # =========================================================
      - name: Prepare final Play Store files
        shell: bash
        run: |
          set -e

          cp "$AAB_FILE" \
            Taxi-Driver-1.0.6-Signed-106-API23.aab

          cp "$APK_FILE" \
            Taxi-Driver-1.0.6-Signed-106-API23.apk

          echo "=============================================="
          echo "FINAL FILES READY"
          echo "=============================================="

          ls -lh \
            Taxi-Driver-1.0.6-Signed-106-API23.aab \
            Taxi-Driver-1.0.6-Signed-106-API23.apk


      # =========================================================
      # 25. UPLOAD ARTIFACT
      # =========================================================
      - name: Upload signed Play Store files
        uses: actions/upload-artifact@v4
        with:
          name: Taxi-Driver-1.0.6-Signed-106-API23
          path: |
            Taxi-Driver-1.0.6-Signed-106-API23.aab
            Taxi-Driver-1.0.6-Signed-106-API23.apk
