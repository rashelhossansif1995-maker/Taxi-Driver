name: Build Taxi Driver 1.1.1 FINAL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Taxi Driver 1.1.1
    runs-on: ubuntu-latest

    steps:

      # ============================================
      # 1. CHECKOUT
      # ============================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================
      # 2. JAVA 17
      # ============================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================
      # 3. GRADLE
      # ============================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # ============================================
      # 4. ANDROID SDK 36
      # ============================================
      - name: Setup Android SDK 36
        shell: bash
        run: |
          set -e

          SDKMANAGER=""

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" --update || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo "Android SDK 36 READY."

      # ============================================
      # 5. FIND 1.1.1 SOURCE ZIP
      # ============================================
      - name: Find Taxi Driver 1.1.1 Source ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 1 -type f \
            \( -iname 'Taxi-Driver-1.1.1*.zip' \
            -o -iname 'Taxi_Driver-1.1.1*.zip' \
            -o -iname '*1.1.1*SOURCE*.zip' \
            \) \
            -print | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Taxi Driver 1.1.1 source ZIP not found."
            echo ""
            echo "Available ZIP files:"
            find . -maxdepth 2 -type f -iname "*.zip" -print | sort
            exit 1
          fi

          echo "SOURCE_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "Source ZIP found:"
          echo "$ZIP_FILE"

      # ============================================
      # 6. EXTRACT SOURCE
      # ============================================
      - name: Extract source
        shell: bash
        run: |
          set -e

          rm -rf taxi_source
          mkdir -p taxi_source

          unzip -q "$SOURCE_ZIP" -d taxi_source

          echo "Source extracted."

      # ============================================
      # 7. FIND ANDROID PROJECT
      # ============================================
      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE="$(
            find taxi_source \
              -type f \
              \( \
                -name "settings.gradle" \
                -o -name "settings.gradle.kts" \
              \) \
              -print -quit
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android settings.gradle not found."
            find taxi_source -maxdepth 5 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      # ============================================
      # 8. FIND INDEX.HTML
      # ============================================
      - name: Find index.html
        shell: bash
        run: |
          set -e

          INDEX_FILE="$PROJECT_DIR/app/src/main/assets/index.html"

          if [ ! -f "$INDEX_FILE" ]; then
            INDEX_FILE="$(
              find "$PROJECT_DIR" \
                -type f \
                -path "*/src/main/assets/index.html" \
                -print -quit
            )"
          fi

          if [ -z "$INDEX_FILE" ] || [ ! -f "$INDEX_FILE" ]; then
            echo "ERROR: index.html not found."
            exit 1
          fi

          echo "INDEX_FILE=$INDEX_FILE" >> "$GITHUB_ENV"

          echo "index.html found:"
          ls -lh "$INDEX_FILE"

      # ============================================
      # 9. APPLY RESET ALL DATA FIX
      # ============================================
      - name: Apply Reset All Data Fix
        shell: bash
        run: |
          set -e

          python3 - "$INDEX_FILE" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              s = f.read()

          old = """localStorage.removeItem(key);
          localStorage.removeItem(key+'_archive');"""

          new = """localStorage.removeItem(key);
          localStorage.removeItem(key+'_archive');

          // Delete all monthly stored trip data
          for(let i=localStorage.length-1;i>=0;i--){
            const k=localStorage.key(i);
            if(k && k.indexOf(monthlyEntriesPrefix)===0){
              localStorage.removeItem(k);
            }
          }"""

          if old not in s:
              raise SystemExit(
                  "ERROR: Reset function pattern not found. "
                  "Build stopped to prevent incorrect modification."
              )

          s = s.replace(old, new, 1)

          with open(path, "w", encoding="utf-8") as f:
              f.write(s)

          print("RESET FIX APPLIED SUCCESSFULLY.")
          PY

      # ============================================
      # 10. VERIFY RESET FIX
      # ============================================
      - name: Verify Reset All Data Fix
        shell: bash
        run: |
          set -e

          grep -q "Delete all monthly stored trip data" "$INDEX_FILE"

          grep -q "monthlyEntriesPrefix" "$INDEX_FILE"

          echo "RESET FIX VERIFIED."

      # ============================================
      # 11. FIND BUILD.GRADLE
      # ============================================
      - name: Find build.gradle
        shell: bash
        run: |
          set -e

          if [ -f "$PROJECT_DIR/app/build.gradle" ]; then
            GRADLE_FILE="$PROJECT_DIR/app/build.gradle"
          elif [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            GRADLE_FILE="$PROJECT_DIR/app/build.gradle.kts"
          elif [ -f "$PROJECT_DIR/build.gradle" ]; then
            GRADLE_FILE="$PROJECT_DIR/build.gradle"
          elif [ -f "$PROJECT_DIR/build.gradle.kts" ]; then
            GRADLE_FILE="$PROJECT_DIR/build.gradle.kts"
          else
            echo "ERROR: build.gradle not found."
            exit 1
          fi

          echo "GRADLE_FILE=$GRADLE_FILE" >> "$GITHUB_ENV"

          echo "Gradle file:"
          echo "$GRADLE_FILE"

      # ============================================
      # 12. FORCE VERSION 1.1.1 / CODE 111
      # ============================================
      - name: Set Version 1.1.1
        shell: bash
        run: |
          set -e

          python3 - "$GRADLE_FILE" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              s = f.read()

          # versionCode
          s = re.sub(
              r'versionCode\s*(?:=)?\s*\d+',
              'versionCode 111',
              s,
              count=1
          )

          # versionName
          s = re.sub(
              r'versionName\s*(?:=)?\s*["\'][^"\']*["\']',
              'versionName "1.1.1"',
              s,
              count=1
          )

          # targetSdk
          s = re.sub(
              r'targetSdk(?:Version)?\s*(?:=)?\s*\d+',
              'targetSdk 36',
              s,
              count=1
          )

          # minSdk
          s = re.sub(
              r'minSdk(?:Version)?\s*(?:=)?\s*\d+',
              'minSdk 24',
              s,
              count=1
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(s)

          print("VERSION CONFIGURATION UPDATED.")
          PY

      # ============================================
      # 13. VERIFY VERSION
      # ============================================
      - name: Verify Version and SDK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "FINAL BUILD CONFIGURATION"
          echo "======================================"

          grep -nE \
            "versionCode|versionName|minSdk|targetSdk" \
            "$GRADLE_FILE" || true

          echo ""
          echo "Required:"
          echo "Version Code : 111"
          echo "Version Name : 1.1.1"
          echo "Min SDK      : 24"
          echo "Target SDK   : 36"

      # ============================================
      # 14. PREPARE KEYSTORE
      # ============================================
      - name: Prepare release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$GITHUB_WORKSPACE/taxi-release.keystore"

          test -s "$GITHUB_WORKSPACE/taxi-release.keystore"

          echo "Keystore ready."

      # ============================================
      # 15. GRADLE CLEAN
      # ============================================
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle clean --stacktrace

      # ============================================
      # 16. BUILD AAB
      # ============================================
      - name: Build Release AAB
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle bundleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/taxi-release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            --stacktrace

      # ============================================
      # 17. BUILD APK
      # ============================================
      - name: Build Release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/taxi-release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            --stacktrace

      # ============================================
      # 18. FIND AAB
      # ============================================
      - name: Find AAB
        shell: bash
        run: |
          set -e

          AAB="$(
            find "$PROJECT_DIR" \
              -type f \
              -name "*.aab" \
              -path "*/outputs/bundle/release/*" \
              -print -quit
          )"

          if [ -z "$AAB" ]; then
            echo "ERROR: AAB not found."
            exit 1
          fi

          echo "AAB_FILE=$AAB" >> "$GITHUB_ENV"

          ls -lh "$AAB"

      # ============================================
      # 19. FIND APK
      # ============================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          APK="$(
            find "$PROJECT_DIR" \
              -type f \
              -name "*release*.apk" \
              -path "*/outputs/apk/release/*" \
              -print -quit
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          echo "APK_FILE=$APK" >> "$GITHUB_ENV"

          ls -lh "$APK"

      # ============================================
      # 20. VERIFY AAB SIGNATURE
      # ============================================
      - name: Verify AAB
        shell: bash
        run: |
          set -e

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$AAB_FILE"

          echo "AAB signature verified."

      # ============================================
      # 21. ALIGN APK
      # ============================================
      - name: Align APK
        shell: bash
        run: |
          set -e

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
            -f \
            -p \
            4 \
            "$APK_FILE" \
            "$GITHUB_WORKSPACE/taxi-aligned.apk"

      # ============================================
      # 22. SIGN APK
      # ============================================
      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$GITHUB_WORKSPACE/taxi-release.keystore" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$GITHUB_WORKSPACE/Taxi-Driver-1.1.1-FINAL-SIGNED.apk" \
            "$GITHUB_WORKSPACE/taxi-aligned.apk"

          echo "APK signed."

      # ============================================
      # 23. VERIFY APK
      # ============================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            verify \
            --verbose \
            "$GITHUB_WORKSPACE/Taxi-Driver-1.1.1-FINAL-SIGNED.apk"

          echo "APK signature verified."

      # ============================================
      # 24. PREPARE FINAL OUTPUT
      # ============================================
      - name: Prepare final release files
        shell: bash
        run: |
          set -e

          rm -rf output
          mkdir -p output

          cp "$AAB_FILE" \
            "output/Taxi-Driver-1.1.1-FINAL-SIGNED.aab"

          cp "$GITHUB_WORKSPACE/Taxi-Driver-1.1.1-FINAL-SIGNED.apk" \
            "output/Taxi-Driver-1.1.1-FINAL-SIGNED.apk"

          echo "======================================"
          echo "FINAL RELEASE FILES"
          echo "======================================"

          ls -lh output/

      # ============================================
      # 25. UPLOAD AAB + APK
      # ============================================
      - name: Upload AAB and APK
        uses: actions/upload-artifact@v4
        with:
          name: Taxi-Driver-1.1.1-FINAL-SIGNED
          path: output/*
          if-no-files-found: error
          retention-days: 30
