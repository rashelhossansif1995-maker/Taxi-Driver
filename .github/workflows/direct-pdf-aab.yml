name: Build Taxi Driver Direct PDF

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout Repository
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. JDK 17
      # ==========================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # 3. Android SDK
      # ==========================================
      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4


      # ==========================================
      # 4. Install Android 36
      # ==========================================
      - name: Install Android 36 SDK components
        run: |
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"


      # ==========================================
      # 5. Gradle
      # ==========================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'


      # ==========================================
      # 6. Extract NEW Taxi Driver Project
      # ==========================================
      - name: Extract Taxi Driver 1.0.6 project
        run: |
          ZIP_FILE="Taxi_Driver_PlayStore_Update_1.0.6_DIRECT_PDF.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found!"
            echo "Files in repository:"
            ls -lah
            exit 1
          fi

          rm -rf taxi_driver_project
          mkdir -p taxi_driver_project

          unzip -o "$ZIP_FILE" -d taxi_driver_project

          PROJECT_DIR=$(find taxi_driver_project \
            -type f \
            -name "settings.gradle" \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found!"
            find taxi_driver_project -maxdepth 5 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "PROJECT FOUND"
          echo "=========================================="
          echo "$PROJECT_DIR"


      # ==========================================
      # 7. Verify Project
      # ==========================================
      - name: Verify Android project
        run: |
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/java/com/taxidriver/apk/MainActivity.java"
          test -f "$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Android project verified successfully."


      # ==========================================
      # 8. Enable AndroidX
      # ==========================================
      - name: Enable AndroidX
        run: |
          touch "$PROJECT_DIR/gradle.properties"

          if grep -q '^android.useAndroidX=' \
            "$PROJECT_DIR/gradle.properties"; then

            sed -i \
              's/^android.useAndroidX=.*/android.useAndroidX=true/' \
              "$PROJECT_DIR/gradle.properties"

          else

            echo 'android.useAndroidX=true' \
              >> "$PROJECT_DIR/gradle.properties"

          fi


          if grep -q '^android.enableJetifier=' \
            "$PROJECT_DIR/gradle.properties"; then

            sed -i \
              's/^android.enableJetifier=.*/android.enableJetifier=true/' \
              "$PROJECT_DIR/gradle.properties"

          else

            echo 'android.enableJetifier=true' \
              >> "$PROJECT_DIR/gradle.properties"

          fi


          echo "AndroidX enabled."


      # ==========================================
      # 9. Fix Billing Listener
      # ==========================================
      - name: Fix BillingClientStateListener
        run: |

          MAIN_ACTIVITY="$PROJECT_DIR/app/src/main/java/com/taxidriver/apk/MainActivity.java"

          python3 - "$MAIN_ACTIVITY" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])

          text = path.read_text(encoding="utf-8")

          import_line = (
              "import com.android.billingclient.api."
              "BillingClientStateListener;"
          )

          if import_line not in text:

              marker = (
                  "import com.android.billingclient.api."
                  "BillingClient;"
              )

              if marker in text:

                  text = text.replace(
                      marker,
                      marker + "\n" + import_line,
                      1
                  )

          text = text.replace(
              "new BillingClient.BillingClientStateListener()",
              "new BillingClientStateListener()"
          )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "BillingClientStateListener fixed successfully."
          )
          PY


      # ==========================================
      # 10. Set Version Code
      # ==========================================
      - name: Set Play Store update version
        run: |

          BUILD_FILE="$PROJECT_DIR/app/build.gradle"

          echo "Current version configuration:"

          grep -n \
            "versionCode\|versionName" \
            "$BUILD_FILE" || true


          # Previous release was 1.0.5.
          # New release = 1.0.6 / versionCode 106.

          sed -i -E \
            's/versionCode[[:space:]]+[0-9]+/versionCode 106/' \
            "$BUILD_FILE"


          echo "New version configuration:"

          grep -n \
            "versionCode\|versionName" \
            "$BUILD_FILE"


      # ==========================================
      # 11. Verify Target API / Package
      # ==========================================
      - name: Verify Target API and package
        run: |

          BUILD_FILE="$PROJECT_DIR/app/build.gradle"

          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"


          grep -Eq \
            "targetSdk[[:space:]]+36" \
            "$BUILD_FILE"


          grep -Eq \
            "minSdk[[:space:]]+23" \
            "$BUILD_FILE"


          grep -q \
            "com.taxidriver.apk" \
            "$MANIFEST"


          echo "Target API 36 verified."

          echo "Min SDK 23 verified."

          echo "Package com.taxidriver.apk verified."


      # ==========================================
      # 12. Verify Google Play Billing
      # ==========================================
      - name: Verify Google Play Billing
        run: |

          BUILD_FILE="$PROJECT_DIR/app/build.gradle"

          MAIN="$PROJECT_DIR/app/src/main"


          grep -q \
            "billing:9.1.0" \
            "$BUILD_FILE"


          grep -R -q \
            "taxi_driver_premium" \
            "$MAIN"


          grep -q \
            "com.android.vending.BILLING" \
            "$MAIN/AndroidManifest.xml"


          echo "Google Play Billing 9.1.0 verified."

          echo "Premium Product ID verified."

          echo "Billing permission verified."


      # ==========================================
      # 13. Verify AdMob
      # ==========================================
      - name: Verify AdMob
        run: |

          BUILD_FILE="$PROJECT_DIR/app/build.gradle"

          MAIN="$PROJECT_DIR/app/src/main"


          grep -q \
            "play-services-ads:25.5.0" \
            "$BUILD_FILE"


          grep -R -q \
            "ca-app-pub-2119693628616724~2117482089" \
            "$MAIN"


          grep -R -q \
            "ca-app-pub-2119693628616724/6269224943" \
            "$MAIN"


          echo "AdMob SDK verified."

          echo "Real AdMob App ID verified."

          echo "Real Banner Ad Unit ID verified."


      # ==========================================
      # 14. Verify Adaptive Launcher Icon
      # ==========================================
      - name: Verify Adaptive Launcher Icon
        run: |

          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          grep -q \
            'android:icon=' \
            "$MANIFEST"


          grep -q \
            'android:roundIcon=' \
            "$MANIFEST"


          echo "Adaptive launcher icon configuration verified."


      # ==========================================
      # 15. Decode Signing Key
      # ==========================================
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

        run: |

          if [ -z "$KEYSTORE_BASE64" ]; then

            echo "ERROR:"
            echo "KEYSTORE_BASE64 secret is missing."

            exit 1

          fi


          echo "$KEYSTORE_BASE64" \
            | base64 --decode \
            > upload-keystore.jks


          test -s upload-keystore.jks


          echo "Signing keystore decoded successfully."


      # ==========================================
      # 16. Build Release APK + AAB
      # ==========================================
      - name: Build Release APK and AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        run: |

          cd "$PROJECT_DIR"


          echo "=========================================="
          echo "GRADLE CLEAN"
          echo "=========================================="


          gradle clean \
            --no-daemon \
            --stacktrace


          echo "=========================================="
          echo "BUILD RELEASE APK + AAB"
          echo "=========================================="


          gradle \
            :app:assembleRelease \
            :app:bundleRelease \
            --no-daemon \
            --stacktrace \
            --info \
            --console=plain \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/upload-keystore.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            2>&1 \
            | tee "$GITHUB_WORKSPACE/gradle-build.log"


      # ==========================================
      # 17. Prepare AAB + APK
      # ==========================================
      - name: Prepare APK and AAB
        if: success()

        run: |

          cp \
            "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" \
            Taxi-Driver-1.0.6-Direct-PDF.apk


          cp \
            "$PROJECT_DIR/app/build/outputs/bundle/release/app-release.aab" \
            Taxi-Driver-1.0.6-Direct-PDF.aab


          echo "=========================================="
          echo "FINAL APK"
          echo "=========================================="


          ls -lh \
            Taxi-Driver-1.0.6-Direct-PDF.apk


          echo "=========================================="
          echo "FINAL AAB"
          echo "=========================================="


          ls -lh \
            Taxi-Driver-1.0.6-Direct-PDF.aab


      # ==========================================
      # 18. Upload APK + AAB
      # ==========================================
      - name: Upload APK and AAB
        if: success()

        uses: actions/upload-artifact@v4

        with:
          name: Taxi-Driver-1.0.6-Direct-PDF

          path: |
            Taxi-Driver-1.0.6-Direct-PDF.apk
            Taxi-Driver-1.0.6-Direct-PDF.aab


      # ==========================================
      # 19. Upload Build Log
      # ==========================================
      - name: Upload Gradle Build Log
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: Taxi-Driver-Gradle-Build-Log

          path: gradle-build.log

          if-no-files-found: ignore
