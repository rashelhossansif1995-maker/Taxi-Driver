<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Taxi Driver Premium</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  background:#20242a;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#111;
}
.overlay{
  width:100%;
  min-height:100vh;
  background:rgba(0,0,0,.48);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px 12px;
}
.premium{
  width:min(430px,100%);
  background:#f7f8fa;
  border-radius:28px;
  overflow:hidden;
  box-shadow:0 24px 70px rgba(0,0,0,.45);
}
.hero{
  position:relative;
  min-height:285px;
  padding:25px 22px 18px;
  color:white;
  overflow:hidden;
  background:
    radial-gradient(circle at 78% 48%,rgba(255,194,35,.18),transparent 30%),
    linear-gradient(135deg,#071a31 0%,#0b2949 58%,#061525 100%);
}
.hero:after{
  content:"";
  position:absolute;
  left:-10%;
  right:-10%;
  bottom:0;
  height:62px;
  border-top:3px solid #f5bd29;
  border-radius:50%;
  box-shadow:0 -7px 18px rgba(245,189,41,.55);
}
.close{
  position:absolute;
  top:16px;
  right:16px;
  width:46px;height:46px;
  border:0;border-radius:50%;
  background:rgba(255,255,255,.14);
  color:#fff;font-size:31px;
  cursor:pointer;
  z-index:5;
}
.crown{font-size:55px;text-align:center;line-height:55px;filter:drop-shadow(0 0 10px #ffd34e)}
.title{
  text-align:left;
  margin:4px 0 0 4px;
  font-size:48px;
  line-height:.95;
  font-weight:800;
  letter-spacing:-2px;
}
.title span{
  display:block;
  color:#ffd33f;
  text-shadow:0 3px 15px rgba(255,191,28,.65);
}
.taxi{
  position:absolute;
  right:4px;
  bottom:37px;
  width:205px;
  height:82px;
  z-index:2;
}
.car{
  position:absolute;
  left:8px;right:4px;bottom:8px;
  height:49px;
  background:linear-gradient(#ffd83f,#e8a900);
  border-radius:28px 30px 10px 10px;
  box-shadow:0 8px 16px rgba(0,0,0,.35);
}
.roof{
  position:absolute;
  left:48px;top:-29px;
  width:103px;height:48px;
  background:linear-gradient(135deg,#ffd94a,#e7a700);
  clip-path:polygon(18% 100%,35% 0,73% 0,100% 100%);
}
.window{
  position:absolute;
  left:60px;top:-22px;
  width:80px;height:25px;
  background:#152535;
  clip-path:polygon(18% 100%,30% 5%,68% 5%,90% 100%);
}
.light{
  position:absolute;left:92px;top:-37px;
  background:#ffd329;color:#111;
  font-size:8px;font-weight:800;
  padding:3px 8px;border-radius:4px;
}
.wheel{
  position:absolute;bottom:-5px;width:32px;height:32px;
  border-radius:50%;background:#121820;border:6px solid #555;
}
.w1{left:27px}.w2{right:28px}
.features{
  position:absolute;
  left:18px;right:18px;bottom:10px;
  z-index:4;
  display:flex;gap:12px;
}
.feature{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700}
.icon{
  width:42px;height:42px;border:2px solid #ffd35a;
  border-radius:50%;display:grid;place-items:center;
  font-size:21px;color:#ffd35a;
}
.noads .icon{border-color:#ef4c57;color:#ef4c57}
.plans{padding:22px 18px 18px;background:#f8f9fb}
.plan{
  width:100%;
  min-height:82px;
  border:1px solid #e2e6ec;
  border-radius:23px;
  background:#fff;
  margin-bottom:13px;
  display:flex;align-items:center;
  padding:12px 15px;
  box-shadow:0 5px 16px rgba(20,40,70,.07);
  cursor:pointer;
}
.plan.selected{
  border:2px solid #f0b51b;
  background:linear-gradient(100deg,#fffdf1,#fff0bd);
}
.planicon{
  width:58px;height:58px;border-radius:17px;
  display:grid;place-items:center;
  color:#fff;font-size:29px;margin-right:16px;
}
.gold{background:linear-gradient(145deg,#e8bd45,#9a5d00)}
.blue{background:linear-gradient(145deg,#4b9cf5,#1462c0)}
.green{background:linear-gradient(145deg,#4bd28c,#159a61)}
.planname{font-size:25px;font-weight:700;flex:1}
.price{font-size:23px;font-weight:800;white-space:nowrap}
.radio{
  width:27px;height:27px;border-radius:50%;
  border:3px solid #aab2bf;margin-left:14px;
  position:relative;flex:none;
}
.selected .radio{border-color:#d99500}
.selected .radio:after{
  content:"";position:absolute;inset:4px;
  background:#d99500;border-radius:50%;
}
.cancel{
  width:100%;height:72px;border-radius:22px;
  border:1.5px solid #e0b326;background:#fff;
  color:#c89508;font-size:22px;font-weight:800;
  cursor:pointer;
}
@media(max-width:380px){
 .title{font-size:40px}.hero{min-height:275px}
 .taxi{transform:scale(.85);transform-origin:right bottom}
 .feature{font-size:11px}.planname{font-size:21px}.price{font-size:19px}
}
</style>
</head>
<body>
<div class="overlay">
  <section class="premium">
    <div class="hero">
      <button class="close" onclick="closePremium()">×</button>
      <div class="crown">♛</div>
      <div class="title">Taxi Driver<span>Premium</span></div>

      <div class="taxi" aria-label="Taxi illustration">
        <div class="roof"></div><div class="window"></div><div class="light">TAXI</div>
        <div class="car"></div><div class="wheel w1"></div><div class="wheel w2"></div>
      </div>

      <div class="features">
        <div class="feature"><div class="icon">▥</div><span>Full<br>Features</span></div>
        <div class="feature noads"><div class="icon">AD</div><span>No<br>Ads</span></div>
        <div class="feature"><div class="icon">☁</div><span>Use<br>Everywhere</span></div>
      </div>
    </div>

    <div class="plans">
      <div class="plan selected" data-id="taxi_driver_premium" onclick="selectPlan(this)">
        <div class="planicon gold">◇</div>
        <div class="planname">Lifetime</div>
        <div class="price">AED 19.99</div>
        <div class="radio"></div>
      </div>

      <div class="plan" data-id="taxi_driver_premium_monthly" onclick="selectPlan(this)">
        <div class="planicon blue">▣</div>
        <div class="planname">Monthly</div>
        <div class="price">AED 2.09</div>
        <div class="radio"></div>
      </div>

      <div class="plan" data-id="taxi_driver_premium_yearly" onclick="selectPlan(this)">
        <div class="planicon green">365</div>
        <div class="planname">Yearly</div>
        <div class="price">AED 9.99</div>
        <div class="radio"></div>
      </div>

      <button class="cancel" onclick="closePremium()">CANCEL</button>
    </div>
  </section>
</div>

<script>
let selectedProduct = "taxi_driver_premium";

function selectPlan(el){
  document.querySelectorAll(".plan").forEach(p=>p.classList.remove("selected"));
  el.classList.add("selected");
  selectedProduct = el.dataset.id;

  // Android WebView hook. Keep your existing native billing implementation.
  if(window.AndroidBilling && typeof AndroidBilling.purchasePremium === "function"){
    AndroidBilling.purchasePremium(selectedProduct);
  }
}

function closePremium(){
  if(window.AndroidBilling && typeof AndroidBilling.closePremium === "function"){
    AndroidBilling.closePremium();
  }else{
    document.querySelector(".overlay").style.display="none";
  }
}
</script>
</body>
</html>
